<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'JetBrains Mono', Consolas, monospace" style="background-color: #0f172a;">
  <!-- 
    THEME: The Gatekeeper Pattern
    CONCEPT: Context Flow Interception & Permission Gradients
    STYLE: Dark Mode, Neon, Circuit/Schematic
  -->

  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#facc15" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4ade80" />
    </marker>

    <!-- Logic Gates Symbols -->
    <symbol id="gate-symbol" viewBox="0 0 40 40">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#64748b" stroke-width="2"/>
      <path d="M 20 8 L 20 32" stroke="#64748b" stroke-width="2"/>
      <path d="M 8 20 L 32 20" stroke="#64748b" stroke-width="2"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="340" height="70" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="5" y="5" width="340" height="70" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="45" fill="#38bdf8" font-size="28" font-weight="bold" filter="url(#glow)">GATEKEEPER PATTERN</text>
    <text x="25" y="65" fill="#94a3b8" font-size="12" letter-spacing="2">HOOKS &amp; PLUGINS ARCHITECTURE</text>
  </g>

  <!-- MAIN STRUCTURE -->
  
  <!-- 1. Agent Runtime (Source) -->
  <g transform="translate(100, 250)">
    <rect x="0" y="-100" width="160" height="350" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="-70" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">AGENT RUNTIME</text>
    <line x1="10" y1="-50" x2="150" y2="-50" stroke="#334155" stroke-width="1"/>
    
    <!-- Internal Code Lines -->
    <g opacity="0.5">
      <rect x="20" y="-30" width="80" height="6" rx="2" fill="#64748b"/>
      <rect x="20" y="-15" width="100" height="6" rx="2" fill="#64748b"/>
      <rect x="20" y="0" width="60" height="6" rx="2" fill="#64748b"/>
      <rect x="20" y="15" width="90" height="6" rx="2" fill="#64748b"/>
      <!-- Active Line Animation -->
      <rect x="20" y="40" width="110" height="6" rx="2" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- 2. The Hook/Gate (Middle) -->
  <g transform="translate(500, 150)">
    <!-- Main Gate Container -->
    <path d="M 0 0 L 200 0 L 220 20 L 220 330 L 200 350 L 0 350 L -20 330 L -20 20 Z" 
          fill="#1e293b" stroke="#a855f7" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Header -->
    <rect x="-20" y="20" width="240" height="40" fill="#a855f7" opacity="0.1"/>
    <text x="100" y="45" fill="#a855f7" font-size="18" font-weight="bold" text-anchor="middle">HOOK INTERCEPTOR</text>
    <text x="100" y="65" fill="#e9d5ff" font-size="10" text-anchor="middle">LIFECYCLE EVENT BUS</text>

    <!-- Scanner Beam Animation -->
    <rect x="-15" y="80" width="230" height="2" fill="#a855f7" opacity="0.8" filter="url(#glow)">
      <animate attributeName="y" values="80; 320; 80" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0.2; 0.8" dur="3s" repeatCount="indefinite" />
    </rect>

    <!-- Logic Gates Representation -->
    <use href="#gate-symbol" x="20" y="100" width="30" height="30" />
    <use href="#gate-symbol" x="85" y="100" width="30" height="30" />
    <use href="#gate-symbol" x="150" y="100" width="30" height="30" />
    
    <!-- Connection Lines inside gate -->
    <path d="M 35 130 L 35 280" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 100 130 L 100 280" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 165 130 L 165 280" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- 3. Target World (Right) -->
  <g transform="translate(900, 250)">
    <rect x="0" y="-100" width="160" height="350" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="80" y="-70" fill="#4ade80" font-size="16" font-weight="bold" text-anchor="middle">REAL WORLD</text>
    <line x1="10" y1="-50" x2="150" y2="-50" stroke="#334155" stroke-width="1"/>
    
    <!-- Target Representations -->
    <text x="80" y="0" fill="#94a3b8" font-size="12" text-anchor="middle">Filesystem</text>
    <text x="80" y="80" fill="#94a3b8" font-size="12" text-anchor="middle">Git Repo</text>
    <text x="80" y="160" fill="#94a3b8" font-size="12" text-anchor="middle">Network</text>
  </g>

  <!-- PATHS AND ANIMATIONS -->

  <!-- Path A: READ (Safe) -->
  <!-- Route: Agent -> Gate -> World -->
  <path id="path-read" d="M 260 270 L 480 270 M 720 270 L 900 270" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Flowing Packet: READ -->
  <g>
    <rect x="-30" y="-12" width="60" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2">
      <!-- 
           KeyTimes logic:
           0.0 - 0.3: Move to Gate (260 -> 480)
           0.3 - 0.5: Wait inside Gate (processing)
           0.5 - 1.0: Move to World (720 -> 900)
           
           Wait, animateMotion handles the path. If I break the path, it's harder.
           Let's use a single path for the motion, but hide the stroke where necessary.
           Path: M 260 270 L 900 270
      -->
      <animateMotion path="M 260 270 L 900 270" dur="4s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
    <text x="0" y="4" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">READ
      <animateMotion path="M 260 270 L 900 270" dur="4s" repeatCount="indefinite" calcMode="linear"/>
    </text>
    <!-- Label -->
    <text x="370" y="260" fill="#38bdf8" font-size="10" opacity="0.7">PASS-THROUGH</text>
  </g>

  <!-- Path B: WRITE LOW RISK (Modify/Check) -->
  <!-- Route: Agent -> Gate -> (Modify) -> World -->
  <path id="path-modify" d="M 260 350 L 480 350 M 720 350 L 900 350" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Packet: WRITE (Yellow) -->
  <g>
    <!-- Packet Shape -->
    <path d="M -30 -12 L 20 -12 L 30 0 L 20 12 L -30 12 Z" fill="#1e293b" stroke="#facc15" stroke-width="2">
      <!-- Logic: Pause at gate, then continue -->
      <animateMotion path="M 260 350 L 590 350 L 900 350" keyPoints="0; 0.45; 0.45; 1" keyTimes="0; 0.3; 0.6; 1" dur="5s" repeatCount="indefinite" calcMode="linear"/>
    </path>
    <text x="0" y="4" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle">WRITE
      <animateMotion path="M 260 350 L 590 350 L 900 350" keyPoints="0; 0.45; 0.45; 1" keyTimes="0; 0.3; 0.6; 1" dur="5s" repeatCount="indefinite" calcMode="linear"/>
    </text>

    <!-- Transformation Flash at Gate -->
    <circle cx="590" cy="350" r="20" fill="none" stroke="#facc15" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="1.5s" begin="1.5s" repeatCount="indefinite"/> 
      <animate attributeName="r" values="20;50" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="370" y="340" fill="#facc15" font-size="10" opacity="0.7">INSPECT &amp; LOG</text>


  <!-- Path C: DANGER (Block) -->
  <!-- Route: Agent -> Gate -> X (Block) -->
  <path id="path-block" d="M 260 430 L 480 430 M 720 430 L 750 430" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Packet: DANGER (Red) -->
  <g>
    <rect x="-35" y="-12" width="70" height="24" rx="2" fill="#1e293b" stroke="#ef4444" stroke-width="2">
      <animateMotion path="M 260 430 L 590 430" dur="3s" repeatCount="indefinite" calcMode="linear" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="4" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">rm -rf /
      <animateMotion path="M 260 430 L 590 430" dur="3s" repeatCount="indefinite" calcMode="linear" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Block Symbol at Gate Output -->
  <g transform="translate(620, 430)">
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#ef4444" stroke-width="4" stroke-linecap="round" opacity="0.8">
       <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#ef4444" stroke-width="4" stroke-linecap="round" opacity="0.8">
       <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1s" repeatCount="indefinite"/>
    </line>
    <text x="25" y="5" fill="#ef4444" font-size="12" font-weight="bold">BLOCKED</text>
  </g>
  <text x="370" y="420" fill="#ef4444" font-size="10" opacity="0.7">INTERCEPT!</text>

  <!-- Legend / Gradient -->
  <g transform="translate(950, 40)">
    <text x="0" y="0" fill="#94a3b8" font-size="10" text-anchor="end" font-weight="bold">PERMISSION GRADIENT</text>
    
    <rect x="-100" y="10" width="100" height="4" fill="#38bdf8" />
    <text x="-110" y="15" fill="#38bdf8" font-size="10" text-anchor="end">Read</text>
    
    <rect x="-100" y="25" width="100" height="4" fill="#facc15" />
    <text x="-110" y="30" fill="#facc15" font-size="10" text-anchor="end">Write (Low)</text>
    
    <rect x="-100" y="40" width="100" height="4" fill="#ef4444" />
    <text x="-110" y="45" fill="#ef4444" font-size="10" text-anchor="end">Write (High)</text>
  </g>

  <!-- Connecting Lines (Circuit Traces) -->
  <path d="M 500 270 L 260 270" stroke="none" fill="none"/> <!-- Invisible Logic Link -->
  <circle cx="590" cy="270" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="590" cy="350" r="4" fill="#facc15">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="590" cy="430" r="4" fill="#ef4444">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>

</svg>