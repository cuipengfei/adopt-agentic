<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'IBM Plex Sans', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" style="background-color: #f8fafc;">
  <!-- 
    THEME: The Gatekeeper Pattern
    CONCEPT: Context Flow Interception & Permission Gradients
    STYLE: Blueprint / Technical Schematic (Security Checkpoint)
  -->

  <defs>
    <!-- Blueprint Grid Pattern (minor) -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#cbd5e1" opacity="0.7"/>
    </pattern>

    <!-- Blueprint Grid Pattern (major) -->
    <pattern id="grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    </pattern>

    <!-- Ink Shadow Filter (kept id="glow" to preserve references) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a" />
    </marker>

    <!-- Logic Gates Symbols -->
    <symbol id="gate-symbol" viewBox="0 0 40 40">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#64748b" stroke-width="2"/>
      <path d="M 20 8 L 20 32" stroke="#64748b" stroke-width="2"/>
      <path d="M 8 20 L 32 20" stroke="#64748b" stroke-width="2"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" />
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.9" />
  <rect width="100%" height="100%" fill="url(#grid-major)" opacity="0.55" />

  <!-- Blueprint Sheet Frame & Registration Marks -->
  <g opacity="0.95">
    <rect x="30" y="30" width="1140" height="615" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="42" y="42" width="1116" height="591" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,6"/>

    <!-- Corner crop marks -->
    <path d="M 24 60 L 24 24 L 60 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 1176 60 L 1176 24 L 1140 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 615 L 24 651 L 60 651" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 1176 615 L 1176 651 L 1140 651" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title Block -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="340" height="70" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="5" y="5" width="340" height="70" fill="none" stroke="#0f172a" stroke-width="2"/>
    <text x="25" y="45" fill="#0f172a" font-size="28" font-weight="700" filter="url(#glow)">GATEKEEPER PATTERN</text>
    <text x="25" y="65" fill="#334155" font-size="12" letter-spacing="1.6">HOOKS &amp; PLUGINS ARCHITECTURE</text>
  </g>

  <!-- MAIN STRUCTURE -->
  
  <!-- 1. Agent Runtime (Source) -->
  <g transform="translate(100, 250)">
    <rect x="0" y="-100" width="160" height="350" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="-70" fill="#1d4ed8" font-size="16" font-weight="700" text-anchor="middle">AGENT RUNTIME</text>
    <line x1="10" y1="-50" x2="150" y2="-50" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Internal Code Lines -->
    <g opacity="0.5">
      <rect x="20" y="-30" width="80" height="6" rx="2" fill="#94a3b8"/>
      <rect x="20" y="-15" width="100" height="6" rx="2" fill="#94a3b8"/>
      <rect x="20" y="0" width="60" height="6" rx="2" fill="#94a3b8"/>
      <rect x="20" y="15" width="90" height="6" rx="2" fill="#94a3b8"/>
      <!-- Active Line Animation -->
      <rect x="20" y="40" width="110" height="6" rx="2" fill="#2563eb">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- 2. The Hook/Gate (Middle) -->
  <g transform="translate(500, 150)">
    <!-- Main Gate Container -->
    <path d="M 0 0 L 200 0 L 220 20 L 220 330 L 200 350 L 0 350 L -20 330 L -20 20 Z" 
          fill="#ffffff" stroke="#0284c7" stroke-width="3" filter="url(#glow)"/>

    <!-- Animated perimeter (inspection loop) -->
    <path d="M 0 0 L 200 0 L 220 20 L 220 330 L 200 350 L 0 350 L -20 330 L -20 20 Z"
          fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.65">
      <animate attributeName="stroke-dashoffset" values="0;72" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Header -->
    <rect x="-20" y="20" width="240" height="40" fill="#0284c7" opacity="0.08"/>
    <text x="100" y="45" fill="#0369a1" font-size="18" font-weight="700" text-anchor="middle">HOOK INTERCEPTOR</text>
    <text x="100" y="65" fill="#334155" font-size="10" text-anchor="middle">LIFECYCLE EVENT BUS</text>

    <!-- Scanner Beam Animation -->
    <rect x="-15" y="80" width="230" height="2" fill="#0284c7" opacity="0.8" filter="url(#glow)">
      <animate attributeName="y" values="80; 320; 80" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0.2; 0.8" dur="3s" repeatCount="indefinite" />
    </rect>

    <!-- Logic Gates Representation -->
    <use href="#gate-symbol" x="20" y="100" width="30" height="30" />
    <use href="#gate-symbol" x="85" y="100" width="30" height="30" />
    <use href="#gate-symbol" x="150" y="100" width="30" height="30" />
    
    <!-- Connection Lines inside gate -->
    <path d="M 35 130 L 35 280" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 100 130 L 100 280" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 165 130 L 165 280" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- 3. Target World (Right) -->
  <g transform="translate(900, 250)">
    <rect x="0" y="-100" width="160" height="350" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="-70" fill="#16a34a" font-size="16" font-weight="700" text-anchor="middle">REAL WORLD</text>
    <line x1="10" y1="-50" x2="150" y2="-50" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Target Representations -->
    <text x="80" y="0" fill="#334155" font-size="12" text-anchor="middle">Filesystem</text>
    <text x="80" y="80" fill="#334155" font-size="12" text-anchor="middle">Git Repo</text>
    <text x="80" y="160" fill="#334155" font-size="12" text-anchor="middle">Network</text>
  </g>

  <!-- PATHS AND ANIMATIONS -->

  <!-- Path A: READ (Safe) -->
  <!-- Route: Agent -> Gate -> World -->
  <path id="path-read" d="M 260 270 L 480 270 M 720 270 L 900 270" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Flowing Packet: READ -->
  <g>
    <rect x="-30" y="-12" width="60" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2">
      <!-- 
           KeyTimes logic:
           0.0 - 0.3: Move to Gate (260 -> 480)
           0.3 - 0.5: Wait inside Gate (processing)
           0.5 - 1.0: Move to World (720 -> 900)
           
           Wait, animateMotion handles the path. If I break the path, it's harder.
           Let's use a single path for the motion, but hide the stroke where necessary.
           Path: M 260 270 L 900 270
      -->
      <animateMotion path="M 260 270 L 900 270" dur="4s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
    <text x="0" y="4" fill="#2563eb" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">READ
      <animateMotion path="M 260 270 L 900 270" dur="4s" repeatCount="indefinite" calcMode="linear"/>
    </text>
    <!-- Label -->
    <text x="370" y="260" fill="#1d4ed8" font-size="10" opacity="0.7">PASS-THROUGH</text>
  </g>

  <!-- Path B: WRITE LOW RISK (Modify/Check) -->
  <!-- Route: Agent -> Gate -> (Modify) -> World -->
  <path id="path-modify" d="M 260 350 L 480 350 M 720 350 L 900 350" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Packet: WRITE (Yellow) -->
  <g>
    <!-- Packet Shape -->
    <path d="M -30 -12 L 20 -12 L 30 0 L 20 12 L -30 12 Z" fill="#fff7ed" stroke="#f59e0b" stroke-width="2">
      <!-- Logic: Pause at gate, then continue -->
      <animateMotion path="M 260 350 L 590 350 L 900 350" keyPoints="0; 0.45; 0.45; 1" keyTimes="0; 0.3; 0.6; 1" dur="5s" repeatCount="indefinite" calcMode="linear"/>
    </path>
    <text x="0" y="4" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">WRITE
      <animateMotion path="M 260 350 L 590 350 L 900 350" keyPoints="0; 0.45; 0.45; 1" keyTimes="0; 0.3; 0.6; 1" dur="5s" repeatCount="indefinite" calcMode="linear"/>
    </text>

    <!-- Transformation Flash at Gate -->
    <circle cx="590" cy="350" r="20" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="1.5s" begin="1.5s" repeatCount="indefinite"/> 
      <animate attributeName="r" values="20;50" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="370" y="340" fill="#b45309" font-size="10" opacity="0.7">INSPECT &amp; LOG</text>


  <!-- Path C: DANGER (Block) -->
  <!-- Route: Agent -> Gate -> X (Block) -->
  <path id="path-block" d="M 260 430 L 480 430 M 720 430 L 750 430" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Packet: DANGER (Red) -->
  <g>
    <rect x="-35" y="-12" width="70" height="24" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="2">
      <animateMotion path="M 260 430 L 590 430" dur="3s" repeatCount="indefinite" calcMode="linear" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="4" fill="#dc2626" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">rm -rf /
      <animateMotion path="M 260 430 L 590 430" dur="3s" repeatCount="indefinite" calcMode="linear" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Block Symbol at Gate Output -->
  <g transform="translate(620, 430)">
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#dc2626" stroke-width="4" stroke-linecap="round" opacity="0.8">
       <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#dc2626" stroke-width="4" stroke-linecap="round" opacity="0.8">
       <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1s" repeatCount="indefinite"/>
    </line>
    <text x="25" y="5" fill="#dc2626" font-size="12" font-weight="700">BLOCKED</text>
  </g>
  <text x="370" y="420" fill="#b91c1c" font-size="10" opacity="0.7">INTERCEPT!</text>

  <!-- Legend / Gradient -->
  <g transform="translate(950, 40)">
    <text x="0" y="0" fill="#334155" font-size="10" text-anchor="end" font-weight="700">PERMISSION GRADIENT</text>
    
    <rect x="-100" y="10" width="100" height="4" fill="#2563eb" />
    <text x="-110" y="15" fill="#2563eb" font-size="10" text-anchor="end">Read</text>
    
    <rect x="-100" y="25" width="100" height="4" fill="#f59e0b" />
    <text x="-110" y="30" fill="#f59e0b" font-size="10" text-anchor="end">Write (Low)</text>
    
    <rect x="-100" y="40" width="100" height="4" fill="#dc2626" />
    <text x="-110" y="45" fill="#dc2626" font-size="10" text-anchor="end">Write (High)</text>
  </g>

  <!-- Connecting Lines (Circuit Traces) -->
  <path d="M 500 270 L 260 270" stroke="none" fill="none"/> <!-- Invisible Logic Link -->
  <circle cx="590" cy="270" r="4" fill="#2563eb">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="590" cy="350" r="4" fill="#f59e0b">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="590" cy="430" r="4" fill="#dc2626">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>

</svg>
