<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'JetBrains Mono', Consolas, monospace" style="background-color: #0f172a;">
  <!-- Definitions -->
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f87171" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="320" height="60" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="15" y="38" fill="#38bdf8" font-size="24" font-weight="bold" letter-spacing="2">VERIFICATION LOOP</text>
    <text x="250" y="38" fill="#94a3b8" font-size="12">SYS.MON</text>
  </g>

  <!-- Main Pipeline Path (Invisible Guide) -->
  <path id="mainFlow" d="M 150 300 L 1050 300" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5"/>

  <!-- ==================== GATE 1: COMMAND LEVEL ==================== -->
  <g transform="translate(300, 220)">
    <!-- Gate Structure -->
    <rect x="-60" y="0" width="120" height="160" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <line x1="-60" y1="80" x2="60" y2="80" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Scanner Bar Animation -->
    <rect x="-50" y="10" width="100" height="4" fill="#22d3ee" opacity="0.8">
      <animate attributeName="y" values="10;150;10" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" />
    </rect>

    <!-- Label -->
    <text x="0" y="-20" fill="#22d3ee" font-size="16" font-weight="bold" text-anchor="middle" filter="url(#glow-cyan)">L1: EXECUTION</text>
    <text x="0" y="190" fill="#94a3b8" font-size="12" text-anchor="middle">Syntax / Exit Code</text>

    <!-- Status Light -->
    <circle cx="0" cy="-50" r="6" fill="#22d3ee">
      <animate attributeName="r" values="6;8;6" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== GATE 2: TASK LEVEL ==================== -->
  <g transform="translate(600, 220)">
    <!-- Gate Structure -->
    <rect x="-60" y="0" width="120" height="160" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="0" cy="80" r="40" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="5,3">
       <animateTransform attributeName="transform" type="rotate" from="0 0 80" to="360 0 80" dur="8s" repeatCount="indefinite" />
    </circle>
    
    <!-- Inner Logic Symbol -->
    <path d="M -15 80 L -5 90 L 15 70" fill="none" stroke="#a78bfa" stroke-width="2">
       <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Label -->
    <text x="0" y="-20" fill="#a78bfa" font-size="16" font-weight="bold" text-anchor="middle" filter="url(#glow-violet)">L2: LOGIC</text>
    <text x="0" y="190" fill="#94a3b8" font-size="12" text-anchor="middle">Tests / Semantics</text>

    <!-- Status Light -->
    <circle cx="0" cy="-50" r="6" fill="#a78bfa">
      <animate attributeName="r" values="6;8;6" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== GATE 3: SYSTEM LEVEL ==================== -->
  <g transform="translate(900, 220)">
    <!-- Gate Structure -->
    <rect x="-60" y="0" width="120" height="160" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    
    <!-- Human Eye / Value Symbol -->
    <path d="M -30 80 Q 0 50 30 80 Q 0 110 -30 80" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="0" cy="80" r="10" fill="#fbbf24" opacity="0.5">
       <animate attributeName="r" values="10;12;10" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Label -->
    <text x="0" y="-20" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle" filter="url(#glow-amber)">L3: VALUE</text>
    <text x="0" y="190" fill="#94a3b8" font-size="12" text-anchor="middle">Intent / Cost</text>

    <!-- Status Light -->
    <circle cx="0" cy="-50" r="6" fill="#fbbf24">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== FEEDBACK LOOPS ==================== -->
  
  <!-- Agent Start Point -->
  <g transform="translate(150, 300)">
    <circle cx="0" cy="0" r="40" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <text x="0" y="5" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">AGENT</text>
    <text x="0" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">Action</text>
  </g>

  <!-- Main Pipeline Connectors -->
  <line x1="190" y1="300" x2="240" y2="300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="360" y1="300" x2="540" y2="300" stroke="#334155" stroke-width="2"/>
  <line x1="660" y1="300" x2="840" y2="300" stroke="#334155" stroke-width="2"/>
  <line x1="960" y1="300" x2="1080" y2="300" stroke="#334155" stroke-width="2"/>

  <!-- Success Output -->
  <g transform="translate(1120, 300)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="0" y="5" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">DONE</text>
  </g>

  <!-- Feedback Path (Bottom) -->
  <path d="M 300 380 L 300 500 L 150 500 L 150 350" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5,5" opacity="0.4"/>
  <path d="M 600 380 L 600 500 L 150 500" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5,5" opacity="0.4"/>
  <path d="M 900 380 L 900 500 L 150 500" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5,5" opacity="0.4"/>

  <!-- Feedback Node (Context Injection) -->
  <g transform="translate(150, 500)">
    <circle cx="0" cy="0" r="25" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    <text x="0" y="40" fill="#f87171" font-size="12" text-anchor="middle">CONTEXT INJECTION</text>
    
    <!-- Injection Animation -->
    <circle cx="0" cy="0" r="20" fill="#f87171" opacity="0.5">
       <animate attributeName="r" values="5;20;5" dur="1.5s" repeatCount="indefinite"/>
       <animate attributeName="opacity" values="0.8;0;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== ANIMATED PACKETS ==================== -->

  <!-- Packet 1: Success Flow (Straight Through) -->
  <circle r="6" fill="#ffffff" filter="url(#glow-cyan)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 150 300 L 1120 300" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="fill" values="#ffffff;#22d3ee;#a78bfa;#fbbf24;#4ade80" keyTimes="0;0.2;0.5;0.8;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Packet 2: Fail at L1 (Execution Error) -->
  <circle r="4" fill="#f87171">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 150 300 L 300 300 L 300 500 L 150 500 L 150 340" keyPoints="0;0.2;0.5;0.8;1" keyTimes="0;0.3;0.5;0.8;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.1;0.8;0.9;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Packet 3: Fail at L2 (Test Fail) -->
  <circle r="4" fill="#f87171">
    <animateMotion dur="5s" begin="1s" repeatCount="indefinite" path="M 150 300 L 600 300 L 600 500 L 150 500 L 150 340" />
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.1;0.8;0.9;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulse Effects on Gates -->
  <!-- L1 Pulse -->
  <rect x="290" y="290" width="20" height="20" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="20;60" dur="0.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="height" values="20;60" dur="0.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="290;270" dur="0.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="290;270" dur="0.5s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Legend -->
  <g transform="translate(40, 600)">
    <text x="0" y="0" fill="#94a3b8" font-size="12">FLOW LEGEND:</text>
    
    <circle cx="10" cy="20" r="4" fill="#38bdf8"/>
    <text x="25" y="24" fill="#94a3b8" font-size="10">Action Flow</text>
    
    <circle cx="100" cy="20" r="4" fill="#f87171"/>
    <text x="115" y="24" fill="#94a3b8" font-size="10">Feedback Loop (Error)</text>

    <circle cx="230" cy="20" r="4" fill="#4ade80"/>
    <text x="245" y="24" fill="#94a3b8" font-size="10">Success</text>
  </g>

</svg>