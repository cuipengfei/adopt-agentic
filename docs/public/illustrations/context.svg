<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" style="background-color: #f8f9fa;">
  <!-- DEFINITIONS -->
  <defs>
    <!-- Paper Texture / Subtle Grid -->
    <pattern id="subwayGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    
    <!-- Station Marker -->
    <circle id="station" r="8" fill="white" stroke="#334155" stroke-width="3"/>
    <circle id="station-transfer" r="12" fill="white" stroke="#334155" stroke-width="3"/>
    
    <!-- Train Car -->
    <rect id="train" x="-10" y="-4" width="20" height="8" rx="2" fill="#334155"/>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="url(#subwayGrid)" />
  
  <!-- TITLE BLOCK (Subway Sign Style) -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="300" height="60" rx="4" fill="#1e293b"/>
    <text x="20" y="38" fill="white" font-size="24" font-weight="bold" letter-spacing="1">CONTEXT LINE</text>
    <rect x="20" y="48" width="260" height="4" fill="#3b82f6">
      <animate attributeName="opacity" values="0.8; 1; 0.8" dur="3s" repeatCount="indefinite"/>
    </rect> <!-- Line Color Strip -->
  </g>

  <!-- LEGEND -->
  <g transform="translate(40, 580)">
    <rect x="0" y="0" width="200" height="80" fill="white" stroke="#cbd5e1" stroke-width="1" rx="2"/>
    <text x="10" y="20" font-size="12" font-weight="bold" fill="#64748b">LEGEND</text>
    
    <line x1="10" y1="40" x2="40" y2="40" stroke="#3b82f6" stroke-width="4">
      <animate attributeName="opacity" values="1; 0.5; 1" dur="2s" repeatCount="indefinite"/>
    </line>
    <text x="50" y="44" font-size="10" fill="#334155">Request Line</text>
    
    <line x1="10" y1="60" x2="40" y2="60" stroke="#10b981" stroke-width="4">
      <animate attributeName="opacity" values="1; 0.5; 1" dur="2s" begin="1s" repeatCount="indefinite"/>
    </line>
    <text x="50" y="64" font-size="10" fill="#334155">Response Line</text>
  </g>

  <!-- MAIN CIRCUIT -->
  <g transform="translate(600, 337.5)">
    <!-- TRACKS -->
    
    <!-- 1. The Request Loop (Blue) -->
    <!-- Path: Start(-400,-150) -> Write(-200,-150) -> Down to Actions Line(-150,-100) -> Across to Window(350,-100) -->
    <path id="requestPath" d="M -400 -180 L -220 -180 L -20 -180 L 350 -100" 
          fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 2. The Response Loop (Green) -->
    <!-- Path: Window(350,100) -> LLM(200,100) -> Agent(-200,100) -> Up and Left to End(-400,0) -->
    <path id="responsePath" d="M 350 100 L -200 100 L -300 0 L -400 0" 
          fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- 3. The Isolate Siding (Purple) - Alternative path (animated flow) -->
    <path id="isolatePath" d="M -220 -180 L -220 -20 L -20 -20 L -20 -180" 
          fill="none" stroke="#a855f7" stroke-width="6" stroke-dasharray="12,4">
      <animate attributeName="stroke-dashoffset" values="0;32" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- STATIONS & ZONES -->
    
    <!-- User Station (Start) -->
    <g transform="translate(-400, -180)">
      <circle r="15" fill="white" stroke="#3b82f6" stroke-width="4">
        <animate attributeName="stroke-width" values="4; 8; 4" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="1; 0.5; 1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-25" text-anchor="middle" font-weight="bold" fill="#1e293b">USER INPUT</text>
    </g>

    <!-- Action 1: WRITE (Generation) -->
    <g transform="translate(-220, -180)">
      <circle r="8" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="8; 16; 8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6; 0; 0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <use href="#station"/>
      <text x="0" y="-15" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">WRITE</text>
      <text x="0" y="20" text-anchor="middle" font-size="10" fill="#64748b">Generate</text>
    </g>

    <!-- Action 2: ISOLATE (Branch Point) -->
    <g transform="translate(-220, -20)">
      <circle r="12" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="12; 20; 12" dur="2s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6; 0; 0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <use href="#station-transfer"/>
      <text x="0" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">ISOLATE</text>
      <text x="0" y="40" text-anchor="middle" font-size="10" fill="#64748b">Separate</text>
    </g>
    
    <!-- Action 3: SELECT (Filter) -->
    <g transform="translate(-20, -180)">
      <circle r="8" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="8; 16; 8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6; 0; 0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <use href="#station"/>
      <text x="0" y="-15" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">SELECT</text>
      <text x="0" y="20" text-anchor="middle" font-size="10" fill="#64748b">Filter</text>
    </g>

    <!-- Action 4: SQUEEZE (Compress) -->
    <g transform="translate(-20, -20)">
      <circle r="8" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="8; 16; 8" dur="2s" begin="0.75s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6; 0; 0.6" dur="2s" begin="0.75s" repeatCount="indefinite"/>
      </circle>
      <use href="#station"/>
      <text x="0" y="-15" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">SQUEEZE</text>
      <text x="0" y="20" text-anchor="middle" font-size="10" fill="#64748b">Compress</text>
    </g>

    <!-- Context Window (Terminus/Hub) -->
    <g transform="translate(350, 0)">
      <!-- The Window Zone Box -->
      <rect x="-60" y="-130" width="120" height="260" rx="8" fill="white" stroke="#1e293b" stroke-width="3" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="2s" repeatCount="indefinite"/>
    </rect>
      
      <!-- Window Title -->
      <text x="0" y="-150" text-anchor="middle" font-weight="bold" font-size="16" fill="#1e293b">CONTEXT WINDOW</text>
      
      <!-- Capacity Meter Background -->
      <rect x="40" y="-100" width="10" height="200" rx="4" fill="#e2e8f0"/>
      <!-- Capacity Meter Fill (Animated) -->
      <rect x="40" y="0" width="10" height="100" rx="4" fill="#ef4444">
        <animate attributeName="height" values="100; 180; 60; 100" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="0; -80; 20; 0" dur="5s" repeatCount="indefinite"/>
      </rect>
      <!-- Capacity Label -->
      <text x="65" y="0" transform="rotate(90, 65, 0)" font-size="10" fill="#64748b" font-weight="bold" letter-spacing="1">CAPACITY</text>
      
      <!-- "No Memory" Symbol (animated warning) -->
      <g transform="translate(0, 0)">
         <circle r="30" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.3">
           <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
         </circle>
         <path d="M -20 -20 L 20 20" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
         <text x="0" y="5" text-anchor="middle" font-size="10" fill="#ef4444" opacity="0.8">NO MEMORY</text>
      </g>

      <!-- Connection Points -->
    <circle cx="0" cy="-100" r="8" fill="#3b82f6">
      <animate attributeName="opacity" values="1; 0.5; 1" dur="1s" repeatCount="indefinite"/>
    </circle> <!-- In -->
    <circle cx="0" cy="100" r="8" fill="#10b981">
      <animate attributeName="opacity" values="1; 0.5; 1" dur="1s" begin="0.5s" repeatCount="indefinite"/>
    </circle> <!-- Out -->
    </g>

    <!-- LLM Station -->
    <g transform="translate(200, 100)">
      <rect x="-40" y="-20" width="80" height="40" fill="#1e293b" rx="4"/>
      <circle cx="30" cy="-10" r="3" fill="#10b981">
        <animate attributeName="opacity" values="1; 0.2; 1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-weight="bold" fill="white">LLM</text>
    </g>
    
    <!-- Agent Response Station -->
    <g transform="translate(-200, 100)">
      <circle r="8" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="8; 16; 8" dur="2s" begin="1.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6; 0; 0.6" dur="2s" begin="1.25s" repeatCount="indefinite"/>
      </circle>
       <use href="#station"/>
       <text x="0" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">AGENT</text>
       <text x="0" y="40" text-anchor="middle" font-size="10" fill="#64748b">Process</text>
    </g>

    <!-- Result (End) -->
    <g transform="translate(-400, 0)">
       <circle r="15" fill="white" stroke="#10b981" stroke-width="4">
         <animate attributeName="stroke-width" values="4; 8; 4" dur="2s" begin="1s" repeatCount="indefinite"/>
         <animate attributeName="stroke-opacity" values="1; 0.5; 1" dur="2s" begin="1s" repeatCount="indefinite"/>
       </circle>
       <text x="0" y="35" text-anchor="middle" font-weight="bold" fill="#1e293b">RESULT</text>
    </g>

    <!-- ANIMATION TRAINS -->
    
    <!-- Train 1: Blue (Request) -->
    <circle r="6" fill="#2563eb">
      <animateMotion dur="4s" repeatCount="indefinite" path="M -400 -180 L -220 -180 L -20 -180 L 350 -100"/>
    </circle>
    <!-- Train 1b: Blue staggered (Request 2nd packet) -->
    <circle r="4" fill="#3b82f6" opacity="0.6">
      <animateMotion dur="4s" begin="1.5s" repeatCount="indefinite" path="M -400 -180 L -220 -180 L -20 -180 L 350 -100"/>
    </circle>
    
    <!-- Train 2: Purple (Isolate Branch) -->
    <circle r="4" fill="#9333ea">
      <animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M -220 -180 L -220 -20 L -20 -20 L -20 -180"/>
    </circle>

    <!-- Train 3: Green (Response) -->
    <circle r="6" fill="#16a34a">
      <animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M 350 100 L -200 100 L -300 0 L -400 0"/>
    </circle>
    
  </g>
  
  <!-- EXPLANATORY TEXT (Bottom Right) -->
  <g transform="translate(900, 580)" font-family="monospace" font-size="12" fill="#64748b">
    <text x="0" y="0" font-weight="bold">SYSTEM STATUS:</text>
    <circle cx="-12" cy="-4" r="4" fill="#10b981">
      <animate attributeName="fill" values="#10b981;#ef4444;#10b981" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="20">• Stateless Protocol</text>
    <text x="0" y="40">• Full Re-Transmission</text>
    <text x="0" y="60">• Noise Filters Active</text>
  </g>

</svg>
