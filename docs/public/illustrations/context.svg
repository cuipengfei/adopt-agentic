<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'JetBrains Mono', Consolas, monospace" style="background-color: #0f172a;">
  <!-- DEFINITIONS -->
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    
    <!-- Glow Filters -->
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4ade80" />
    </marker>

    <!-- Gradient for Window Level -->
    <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- TITLE BLOCK -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="340" height="60" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="38" fill="#38bdf8" font-size="24" font-weight="bold" letter-spacing="2">CONTEXT REFINERY</text>
    <text x="320" y="15" fill="#38bdf8" font-size="10" text-anchor="end">SYS.MONITOR</text>
    <circle cx="330" cy="11" r="3" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== STAGE 1: WRITE (GENERATION) ==================== -->
  <g transform="translate(100, 200)">
    <!-- Input Source Box -->
    <rect x="0" y="0" width="140" height="100" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="2" filter="url(#glow-green)"/>
    <text x="70" y="30" fill="#4ade80" font-size="16" font-weight="bold" text-anchor="middle">WRITE</text>
    <text x="70" y="50" fill="#86efac" font-size="10" text-anchor="middle">Generate Signal</text>
    
    <!-- Typing Animation -->
    <g transform="translate(30, 65)">
      <rect x="0" y="0" width="5" height="2" fill="#4ade80">
        <animate attributeName="width" values="5; 80; 80; 5" keyTimes="0; 0.4; 0.9; 1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="8" width="5" height="2" fill="#4ade80">
        <animate attributeName="width" values="5; 60; 60; 5" keyTimes="0; 0.4; 0.9; 1" dur="2s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <!-- Cursor -->
      <rect x="85" y="0" width="4" height="10" fill="#4ade80" opacity="0">
        <animate attributeName="x" values="5; 85; 85; 5" keyTimes="0; 0.4; 0.9; 1" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Pipe 1 -->
  <path d="M 240 250 L 300 250" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4">
    <animate attributeName="stroke-dashoffset" from="8" to="0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- ==================== STAGE 2: SELECT (FILTER) ==================== -->
  <g transform="translate(300, 180)">
    <!-- Funnel Shape -->
    <path d="M 0 20 L 120 20 L 100 120 L 20 120 Z" fill="#1e293b" stroke="#22d3ee" stroke-width="2" filter="url(#glow-blue)"/>
    <text x="60" y="50" fill="#22d3ee" font-size="16" font-weight="bold" text-anchor="middle">SELECT</text>
    <text x="60" y="70" fill="#a5f3fc" font-size="10" text-anchor="middle">Filter Noise</text>

    <!-- Filtering Animation Particles -->
    <!-- Good particle passes -->
    <circle cx="60" cy="20" r="4" fill="#22d3ee">
      <animate attributeName="cy" values="20; 140" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Bad particle rejected -->
    <circle cx="40" cy="20" r="4" fill="#ef4444">
      <animate attributeName="cy" values="20; 80" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 0" keyTimes="0; 1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4; 0" keyTimes="0; 1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pipe 2 -->
  <path d="M 360 300 L 360 350 L 500 350" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle r="3" fill="#22d3ee">
    <animateMotion path="M 360 300 L 360 350 L 500 350" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== STAGE 3: SQUEEZE (COMPRESS) ==================== -->
  <g transform="translate(500, 280)">
    <!-- Compressor Box -->
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#1e293b" stroke="#facc15" stroke-width="2" filter="url(#glow-orange)"/>
    <text x="70" y="30" fill="#facc15" font-size="16" font-weight="bold" text-anchor="middle">SQUEEZE</text>
    <text x="70" y="125" fill="#fef08a" font-size="10" text-anchor="middle">Compression</text>

    <!-- Piston Animation -->
    <rect x="20" y="40" width="100" height="10" fill="#facc15">
      <animate attributeName="y" values="40; 80; 40" dur="2s" repeatCount="indefinite"/>
    </rect>
    <!-- Block being crushed -->
    <rect x="40" y="90" width="60" height="20" fill="#fef08a" opacity="0.8">
      <animate attributeName="height" values="20; 5; 20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="90; 105; 90" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Pipe 3 -->
  <path d="M 640 350 L 750 350" stroke="#facc15" stroke-width="2" stroke-dasharray="4,4">
     <animate attributeName="stroke-dashoffset" from="8" to="0" dur="0.5s" repeatCount="indefinite"/>
  </path>

  <!-- ==================== STAGE 4: ISOLATE (PARTITION) ==================== -->
  <g transform="translate(750, 250)">
    <rect x="0" y="0" width="120" height="200" rx="4" fill="#1e293b" stroke="#c084fc" stroke-width="2" filter="url(#glow-purple)"/>
    <text x="60" y="30" fill="#c084fc" font-size="16" font-weight="bold" text-anchor="middle">ISOLATE</text>
    
    <!-- Partition Lines -->
    <line x1="10" y1="70" x2="110" y2="70" stroke="#c084fc" stroke-width="1"/>
    <line x1="10" y1="130" x2="110" y2="130" stroke="#c084fc" stroke-width="1"/>
    
    <!-- Active Slice Indicator -->
    <rect x="15" y="75" width="90" height="50" fill="#c084fc" opacity="0.2">
      <animate attributeName="opacity" values="0.1; 0.4; 0.1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="105" fill="#e879f9" font-size="12" text-anchor="middle">Slice A</text>
    <text x="60" y="165" fill="#6b7280" font-size="12" text-anchor="middle">Slice B</text>
  </g>

  <!-- ==================== TARGET: CONTEXT WINDOW ==================== -->
  <g transform="translate(950, 150)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="200" height="400" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="200" height="40" rx="8" fill="#1e293b"/>
    <text x="100" y="25" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">CONTEXT WINDOW</text>
    <rect x="0" y="30" width="200" height="10" fill="#0f172a"/> <!-- Cover bottom rounded corners of header -->
    <line x1="0" y1="40" x2="200" y2="40" stroke="#38bdf8" stroke-width="1"/>

    <!-- Capacity Meter -->
    <g transform="translate(180, 50)">
      <rect x="0" y="0" width="10" height="340" fill="#1e293b" rx="2"/>
      <rect x="2" y="100" width="6" height="240" fill="#ef4444" rx="1">
        <animate attributeName="height" values="240; 200; 250; 240" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="100; 140; 90; 100" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#ef4444; #eab308; #ef4444" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Liquid Content -->
    <rect x="10" y="250" width="160" height="140" fill="url(#liquidGradient)" opacity="0.8">
       <animate attributeName="height" values="140; 100; 150; 140" dur="5s" repeatCount="indefinite"/>
       <animate attributeName="y" values="250; 290; 240; 250" dur="5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Floating Blocks inside Window -->
    <rect x="20" y="300" width="100" height="10" fill="#38bdf8" opacity="0.6">
        <animate attributeName="y" values="300; 305; 300" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="320" width="80" height="10" fill="#38bdf8" opacity="0.4">
        <animate attributeName="y" values="320; 325; 320" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="340" width="120" height="10" fill="#38bdf8" opacity="0.7">
        <animate attributeName="y" values="340; 335; 340" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Warning Label -->
    <text x="100" y="380" fill="#ef4444" font-size="10" text-anchor="middle" font-weight="bold" opacity="0">
      WARNING: WINDOW FULL
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Connector to Window -->
  <path d="M 870 350 L 950 350" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-blue)">
    <animate attributeName="stroke-dasharray" values="0,100; 100,0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- Legend / Stats -->
  <g transform="translate(40, 600)">
    <text x="0" y="0" fill="#94a3b8" font-size="12">NOISE LEVEL: CRITICAL</text>
    <rect x="140" y="-10" width="100" height="10" fill="#1e293b"/>
    <rect x="140" y="-10" width="70" height="10" fill="#ef4444">
      <animate attributeName="width" values="70; 75; 65; 70" dur="0.5s" repeatCount="indefinite"/>
    </rect>
    
    <text x="300" y="0" fill="#94a3b8" font-size="12">OPTIMIZATION: ACTIVE</text>
    <rect x="440" y="-10" width="100" height="10" fill="#1e293b"/>
    <rect x="440" y="-10" width="40" height="10" fill="#4ade80">
       <animate attributeName="width" values="40; 90" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>