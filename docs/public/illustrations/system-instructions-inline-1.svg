<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">System instructions: injected first, unchanged every round</title>
  <desc id="desc">Two request envelopes show the system prompt staying identical while messages grow across rounds. A user customization pill attaches at the system layer, illustrating why system instructions are a high-leverage handle.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>

    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <style><![CDATA[
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }

    .title { font-size: 22px; font-weight: 900; fill: #0f172a; letter-spacing: 0.2px; }
    .subtitle { font-size: 13px; font-weight: 600; fill: #64748b; }
    .kicker { font-size: 11px; font-weight: 800; letter-spacing: 0.9px; fill: #64748b; }

    .label { font-size: 12px; font-weight: 800; fill: #334155; }
    .small { font-size: 11px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 11px; fill: #334155; }

    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .block-system { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
    .block-messages { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
    .pill { fill: #ffffff; stroke: #bfdbfe; stroke-width: 1.5; }

    .arrow { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
    .arrow-blue-solid { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#arrow-blue); }
    .arrow-dash { fill: none; stroke: #2563eb; stroke-width: 2.8; stroke-dasharray: 10 10; marker-end: url(#arrow-blue); animation: dash 1.8s linear infinite; }

    .lock { stroke: #2563eb; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .accent { fill: #2563eb; }

    @keyframes dash { to { stroke-dashoffset: -40; } }
  ]]></style>

  <!-- Background + outer panel -->
  <rect class="bg" x="0" y="0" width="1200" height="420"/>
  <rect class="panel" x="24" y="24" width="1152" height="372" rx="18" filter="url(#shadow)"/>

  <!-- Header -->
  <text class="title" x="48" y="64">System instructions are the baseline, every round</text>
  <text class="subtitle" x="48" y="90">Messages grow with the conversation — the system prompt stays identical (and is injected first).</text>
  <line x1="48" y1="110" x2="1152" y2="110" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Custom instruction pill (high leverage handle) -->
  <g transform="translate(60, 126)">
    <rect class="pill" x="0" y="0" width="400" height="34" rx="17" fill="#ffffff" filter="url(#shadow-sm)"/>
    <circle cx="18" cy="17" r="8" fill="#2563eb" opacity="0.18"/>
    <circle cx="18" cy="17" r="4" fill="#2563eb"/>
    <text x="34" y="22" class="label" fill="#2563eb">User custom instructions</text>
    <text x="390" y="22" class="small" text-anchor="end">(highest leverage)</text>
  </g>

  <!-- Two request envelopes -->
  <g transform="translate(60, 174)">
    <!-- Round 1 card -->
    <rect class="card" x="0" y="0" width="500" height="190" rx="14" filter="url(#shadow-sm)"/>
    <text class="kicker" x="18" y="28">→ REQUEST (ROUND 1)</text>

    <g transform="translate(18, 44)">
      <!-- System block -->
      <rect class="block-system" x="0" y="0" width="464" height="72" rx="12"/>
      <text class="label" x="14" y="22" fill="#2563eb">system</text>
      <text class="small" x="78" y="22">base rules + your custom instructions</text>
      <text class="mono" x="14" y="46">"You are an AI coding assistant…"</text>
      <text class="small" x="14" y="62">Injected first • highest priority</text>

      <!-- Lock icon (pulse) -->
      <g transform="translate(434, 14)">
        <rect class="lock" x="0" y="10" width="18" height="14" rx="3"/>
        <path class="lock" d="M4 10 V6 C4 2.5 7 0.5 9 0.5 C11 0.5 14 2.5 14 6 V10"/>
        <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="2.4s" repeatCount="indefinite" additive="sum"/>
      </g>
    </g>

    <g transform="translate(18, 126)">
      <!-- Messages block -->
      <rect class="block-messages" x="0" y="0" width="464" height="50" rx="12"/>
      <text class="label" x="14" y="22">messages[]</text>
      <text class="mono" x="106" y="22">[ user: "…" ]</text>
      <text class="small" x="14" y="42">Runtime context (grows every round)</text>
    </g>

    <!-- Round 2 card -->
    <rect class="card" x="600" y="0" width="500" height="190" rx="14" filter="url(#shadow-sm)"/>
    <text class="kicker" x="618" y="28">→ REQUEST (ROUND 2)</text>

    <g transform="translate(618, 44)">
      <!-- System block (same) -->
      <rect class="block-system" x="0" y="0" width="464" height="72" rx="12"/>
      <text class="label" x="14" y="22" fill="#2563eb">system</text>
      <text class="small" x="78" y="22">exactly the same string</text>
      <text class="mono" x="14" y="46">"You are an AI coding assistant…"</text>
      <text class="small" x="14" y="62">Unchanged across rounds</text>

      <!-- Sync badge -->
      <g transform="translate(420, 2)">
        <circle cx="18" cy="18" r="16" fill="#2563eb" opacity="0.10"/>
        <path d="M12 18 a6 6 0 0 1 10 -4" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M22 14 l3 0 l0 -3" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M24 18 a6 6 0 0 1 -10 4" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M14 22 l-3 0 l0 3" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="0 18 18;360 18 18" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(618, 126)">
      <!-- Messages block (bigger) -->
      <rect class="block-messages" x="0" y="0" width="464" height="50" rx="12"/>
      <text class="label" x="14" y="22">messages[]</text>
      <text class="mono" x="106" y="22">[ user, assistant, user… ]</text>
      <text class="small" x="14" y="42">Longer history, more runtime context</text>

      <!-- Growing indicator (pulse) -->
      <g transform="translate(424, 12)">
        <circle cx="14" cy="14" r="10" fill="#64748b" opacity="0.12"/>
        <path d="M14 6 V22" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
        <path d="M6 14 H22" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
        <animate attributeName="opacity" values="1;0.55;1" dur="1.8s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Arrow: system unchanged between rounds -->
    <path class="arrow-dash" d="M 500 80 L 600 80"/>
    <text x="550" y="66" text-anchor="middle" class="small" fill="#2563eb">system unchanged</text>

    <!-- Arrow: custom instructions attach to system layer -->
    <path class="arrow-blue-solid" d="M 190 -6 C 190 18 150 28 110 44"/>
    <circle r="4" class="accent" opacity="0.85">
      <animateMotion path="M 190 -6 C 190 18 150 28 110 44" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Footer hint -->
  <text class="small" x="48" y="384">Rule of thumb: if it should apply to every session, put it in system instructions. If it is task-specific, inject it at runtime.</text>
</svg>
