<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'JetBrains Mono', Consolas, monospace" style="background-color: #0f172a;">
  <!-- 
    MCP - External Capability Expansion
    Style: Cyberpunk/Technical Schematic
    Colors:
    - Background: #0f172a (Dark Slate)
    - Grid: #1e293b
    - Primary (Agent): #38bdf8 (Sky Blue)
    - Protocol (MCP): #f472b6 (Pink)
    - Local (stdio): #22d3ee (Cyan)
    - Remote (HTTP): #4ade80 (Green)
    - Text: #ffffff / #94a3b8
  -->

  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Data Packet Marker -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="grad-stdio" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="grad-http" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Header -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="320" height="60" fill="none" stroke="#f472b6" stroke-width="2"/>
    <text x="15" y="38" fill="#f472b6" font-size="24" font-weight="bold" filter="url(#glow)">MCP ARCHITECTURE</text>
    <text x="340" y="38" fill="#94a3b8" font-size="14">Model Context Protocol // v1.0</text>
  </g>

  <!-- Legend -->
  <g transform="translate(950, 40)">
     <circle cx="0" cy="0" r="4" fill="#22d3ee"/>
     <text x="15" y="4" fill="#94a3b8" font-size="12">stdio (Local)</text>
     
     <circle cx="0" cy="20" r="4" fill="#4ade80"/>
     <text x="15" y="24" fill="#94a3b8" font-size="12">SSE (Remote)</text>
  </g>

  <!-- CENTRAL AGENT CORE -->
  <g transform="translate(600, 320)">
    <!-- Core Hexagon Shape -->
    <path d="M 0 -80 L 70 -40 L 70 40 L 0 80 L -70 40 L -70 -40 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3">
       <animate attributeName="stroke-opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" />
    </path>
    
    <!-- Inner Pulse -->
    <path d="M 0 -60 L 52 -30 L 52 30 L 0 60 L -52 30 L -52 -30 Z" fill="#38bdf8" opacity="0.1">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite" />
    </path>

    <text x="0" y="5" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">AGENT</text>
    <text x="0" y="25" fill="#38bdf8" font-size="12" text-anchor="middle">Client Runtime</text>
  </g>

  <!-- THE "USB HUB" INTERFACE BAR -->
  <g transform="translate(600, 500)">
     <!-- Main Bus Bar -->
     <rect x="-400" y="-10" width="800" height="20" fill="#1e293b" stroke="#f472b6" stroke-width="2" rx="4"/>
     <text x="0" y="40" fill="#f472b6" font-size="14" text-anchor="middle" letter-spacing="2">UNIVERSAL INTERFACE LAYER</text>
     
     <!-- Connection to Agent -->
     <line x1="0" y1="-10" x2="0" y2="-100" stroke="#f472b6" stroke-width="4" stroke-dasharray="8,4">
        <animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite" />
     </line>
     
     <!-- Protocol Label -->
     <rect x="-40" y="-70" width="80" height="24" fill="#0f172a" stroke="#f472b6"/>
     <text x="0" y="-53" fill="#f472b6" font-size="12" text-anchor="middle" font-weight="bold">JSON-RPC</text>
  </g>

  <!-- ================= MODULES ================= -->

  <!-- MODULE 1: LOCAL FILES (stdio) -->
  <g transform="translate(250, 600)">
    <!-- Connection Pipe -->
    <path d="M 0 -30 L 0 -90" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="0" cy="-30" r="4" fill="#22d3ee"/>
    
    <!-- Data Particles Up -->
    <circle r="3" fill="#22d3ee">
       <animateMotion path="M 0 -30 L 0 -100" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Box -->
    <rect x="-60" y="-30" width="120" height="80" fill="#1e293b" stroke="#22d3ee" stroke-width="2" rx="4"/>
    <text x="0" y="10" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">FILES</text>
    <text x="0" y="30" fill="#22d3ee" font-size="10" text-anchor="middle">Local FS</text>
    
    <!-- Status LED -->
    <circle cx="-45" cy="35" r="3" fill="#22d3ee">
       <animate attributeName="opacity" values="1;0.3;1" dur="0.5s" repeatCount="indefinite" />
    </circle>
    <text x="-35" y="38" fill="#94a3b8" font-size="9">PID:9021</text>
  </g>

  <!-- MODULE 2: DATABASE (stdio) -->
  <g transform="translate(450, 600)">
    <!-- Connection Pipe -->
    <path d="M 0 -30 L 0 -90" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="0" cy="-30" r="4" fill="#22d3ee"/>

    <!-- Data Particles Up -->
    <circle r="3" fill="#22d3ee">
       <animateMotion path="M 0 -30 L 0 -100" dur="1.5s" begin="0.7s" repeatCount="indefinite" />
    </circle>

    <!-- Cylinder Shape -->
    <path d="M -50 -20 L 50 -20 L 50 40 L -50 40 Z" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <ellipse cx="0" cy="-20" rx="50" ry="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <ellipse cx="0" cy="40" rx="50" ry="10" fill="none" stroke="#22d3ee" stroke-width="2"/>
    
    <text x="0" y="15" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">SQL DB</text>
    <text x="0" y="35" fill="#22d3ee" font-size="10" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- MODULE 3: BROWSER/WEB (HTTP) -->
  <g transform="translate(750, 600)">
    <!-- Connection Pipe (Dashed for HTTP) -->
    <path d="M 0 -30 L 0 -90" stroke="#4ade80" stroke-width="3" stroke-dasharray="4,4"/>
    <circle cx="0" cy="-30" r="4" fill="#4ade80"/>

    <!-- Data Particles Up -->
    <circle r="3" fill="#4ade80">
       <animateMotion path="M 0 -30 L 0 -100" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Box -->
    <rect x="-60" y="-30" width="120" height="80" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="4"/>
    <text x="0" y="10" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">BROWSER</text>
    <text x="0" y="30" fill="#4ade80" font-size="10" text-anchor="middle">Firecrawl</text>
    
    <!-- Network Icon -->
    <path d="M -40 35 L -30 35 L -25 30" fill="none" stroke="#4ade80" stroke-width="1"/>
    <circle cx="-45" cy="35" r="2" fill="#4ade80"/>
  </g>

  <!-- MODULE 4: SAAS API (HTTP) -->
  <g transform="translate(950, 600)">
    <!-- Connection Pipe (Dashed) -->
    <path d="M 0 -30 L 0 -90" stroke="#4ade80" stroke-width="3" stroke-dasharray="4,4"/>
    <circle cx="0" cy="-30" r="4" fill="#4ade80"/>

    <!-- Data Particles Up -->
    <circle r="3" fill="#4ade80">
       <animateMotion path="M 0 -30 L 0 -100" dur="2s" begin="1s" repeatCount="indefinite" />
    </circle>

    <!-- Cloud-ish Shape Box -->
    <path d="M -60 -10 L -60 50 L 60 50 L 60 -10 L 40 -30 L -40 -30 Z" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    
    <text x="0" y="10" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">JIRA/SLACK</text>
    <text x="0" y="30" fill="#4ade80" font-size="10" text-anchor="middle">Remote API</text>
    <text x="0" y="45" fill="#94a3b8" font-size="9">localhost:8080</text>
  </g>

  <!-- ================= CONTEXT INJECTION VISUALIZATION ================= -->
  
  <g transform="translate(300, 150)">
     <!-- Label -->
     <text x="0" y="-20" fill="#94a3b8" font-size="12">TOOL DEFINITIONS INJECTION</text>
     
     <!-- The "Context Stream" -->
     <path d="M 0 0 L 250 100" stroke="#f472b6" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
     
     <!-- Floating Code Blocks (Tool Defs) -->
     <g>
        <rect x="0" y="0" width="100" height="40" fill="#1e293b" stroke="#f472b6" stroke-width="1" rx="2" opacity="0.8"/>
        <text x="10" y="15" fill="#f472b6" font-size="10">{ "name":</text>
        <text x="10" y="28" fill="#ffffff" font-size="10">  "read_file" }</text>
        
        <!-- Animation: Float into Agent -->
        <animateMotion path="M -50 -50 L 250 130" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" />
     </g>

     <g>
        <rect x="0" y="0" width="100" height="40" fill="#1e293b" stroke="#22d3ee" stroke-width="1" rx="2" opacity="0.8"/>
        <text x="10" y="15" fill="#22d3ee" font-size="10">{ "name":</text>
        <text x="10" y="28" fill="#ffffff" font-size="10">  "query_db" }</text>
        
        <!-- Animation: Float into Agent (Delayed) -->
        <animateMotion path="M -50 -50 L 250 130" dur="4s" begin="1.3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1.3s" repeatCount="indefinite" />
     </g>
     
     <g>
        <rect x="0" y="0" width="100" height="40" fill="#1e293b" stroke="#4ade80" stroke-width="1" rx="2" opacity="0.8"/>
        <text x="10" y="15" fill="#4ade80" font-size="10">{ "name":</text>
        <text x="10" y="28" fill="#ffffff" font-size="10">  "jira_get" }</text>
        
        <!-- Animation: Float into Agent (Delayed) -->
        <animateMotion path="M -50 -50 L 250 130" dur="4s" begin="2.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="2.6s" repeatCount="indefinite" />
     </g>
  </g>

  <!-- ================= LLM CONNECTION (Top Right) ================= -->
  <g transform="translate(900, 150)">
    <!-- Cloud Shape for LLM -->
    <path d="M -40 0 Q -40 -30 0 -30 T 40 0 Q 60 0 60 20 T 40 40 L -40 40 Q -60 40 -60 20 T -40 0" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="0" y="15" fill="#94a3b8" font-size="14" text-anchor="middle" font-weight="bold">LLM API</text>
    
    <!-- Connection to Agent -->
    <path d="M -50 40 L -230 130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
    
    <!-- "Blind" Icon - showing LLM doesn't see difference -->
    <g transform="translate(0, 60)">
       <text x="0" y="0" fill="#94a3b8" font-size="10" text-anchor="middle" font-style="italic">"It's just a tool_call"</text>
    </g>
  </g>

</svg>