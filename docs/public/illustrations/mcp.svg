<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" style="background-color: #f6f7fb;">
  <!-- 
    MCP - Isometric 3D Blocks Infographic
    Preserves ALL 14 original SMIL animations.
  -->

  <defs>
    <!-- 1. Background (clean, bright) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5ff"/>
    </linearGradient>

    <!-- 2. Soft Shadow for Isometric Blocks -->
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow-md" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 3. Markers for Data Flow (Retained for completeness) -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- ================= HEADER ================= -->
  <g transform="translate(40, 40)">
    <!-- Isometric title block -->
    <g filter="url(#shadow-sm)">
      <!-- Top / Side / Front faces -->
      <polygon points="0,0 320,0 340,16 20,16" fill="#fdba74" stroke="#c2410c" stroke-width="1"/>
      <polygon points="0,0 20,16 20,56 0,40" fill="#ea580c" stroke="#c2410c" stroke-width="1"/>
      <polygon points="20,16 340,16 340,56 20,56" fill="#f97316" stroke="#c2410c" stroke-width="1"/>
      <!-- Small connector notch detail -->
      <rect x="292" y="26" width="26" height="10" rx="2" fill="#fff7ed" opacity="0.85"/>
      <circle cx="322" cy="31" r="2" fill="#c2410c" opacity="0.8"/>
    </g>

    <text x="34" y="42" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="-0.5">MCP ARCHITECTURE</text>
    
    <!-- Subtitle (Tech Detail) -->
    <text x="380" y="38" fill="#475569" font-size="14" font-weight="600">Model Context Protocol // v1.0</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(950, 40)">
     <g transform="translate(0, 0)">
       <circle cx="0" cy="0" r="6" fill="#3b82f6" stroke="#ffffff" stroke-width="2" filter="url(#shadow-sm)"/>
       <text x="15" y="4" fill="#475569" font-size="12" font-weight="bold">stdio (Local)</text>
     </g>
      <g transform="translate(0, 25)">
        <circle cx="0" cy="0" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="2" filter="url(#shadow-sm)"/>
        <text x="15" y="4" fill="#475569" font-size="12" font-weight="bold">Streamable HTTP (Remote)</text>
      </g>
  </g>

  <!-- ================= CENTRAL AGENT CORE ================= -->
  <g transform="translate(600, 320)" filter="url(#shadow-md)">
    <!-- Isometric block core (runtime) -->
    <g transform="scale(1.2)">
      <!-- Top face -->
      <path d="M0 -50 L43.3 -25 L0 0 L-43.3 -25 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="0.8" opacity="0.98"/>
      <!-- Left face -->
      <path d="M-43.3 -25 L0 0 L0 50 L-43.3 25 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="0.8" opacity="0.98"/>
      <!-- Right face -->
      <path d="M0 0 L43.3 -25 L43.3 25 L0 50 Z" fill="#1d4ed8" stroke="#1e40af" stroke-width="0.8" opacity="0.98"/>
    </g>

    <!-- Pulse Ring (retained animation) -->
    <path d="M 0 -70 L 60 -35 L 60 35 L 0 70 L -60 35 L -60 -35 Z" fill="none" stroke="#f97316" stroke-width="2" opacity="0.55">
       <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite" />
       <animate attributeName="stroke-width" values="2;10;2" dur="3s" repeatCount="indefinite" />
    </path>

    <!-- USB-C like port (visual metaphor) -->
    <g transform="translate(0, 56)">
      <rect x="-26" y="0" width="52" height="24" rx="8" fill="#0f172a" opacity="0.9"/>
      <rect x="-18" y="6" width="36" height="12" rx="5" fill="#1f2937" opacity="0.95"/>
      <circle cx="-10" cy="12" r="2" fill="#fb923c" opacity="0.9"/>
      <circle cx="10" cy="12" r="2" fill="#fb923c" opacity="0.9"/>
    </g>

    <text x="0" y="85" fill="#0f172a" font-size="20" font-weight="800" text-anchor="middle">AGENT</text>
    <text x="0" y="105" fill="#2563eb" font-size="12" text-anchor="middle" font-weight="700">Client Runtime</text>
  </g>

  <!-- ================= UNIVERSAL INTERFACE LAYER (USB HUB) ================= -->
  <g transform="translate(600, 500)">
     <!-- Isometric USB hub block -->
     <g filter="url(#shadow-sm)">
       <!-- Top / Front / Sides -->
       <polygon points="-410,-26 410,-26 430,-14 -390,-14" fill="#fdba74" stroke="#c2410c" stroke-width="1"/>
       <polygon points="-390,-14 430,-14 430,18 -390,18" fill="#f97316" stroke="#c2410c" stroke-width="1"/>
       <polygon points="-410,-26 -390,-14 -390,18 -410,6" fill="#ea580c" stroke="#c2410c" stroke-width="1"/>
       <polygon points="410,-26 430,-14 430,18 410,6" fill="#c2410c" stroke="#9a3412" stroke-width="1" opacity="0.95"/>

       <!-- Ports (physical interface metaphor) -->
       <g opacity="0.95">
         <rect x="-280" y="-4" width="70" height="18" rx="5" fill="#0f172a" opacity="0.75"/>
         <rect x="-190" y="-4" width="70" height="18" rx="5" fill="#0f172a" opacity="0.75"/>
         <rect x="-100" y="-4" width="70" height="18" rx="5" fill="#0f172a" opacity="0.75"/>
         <rect x="-10" y="-4" width="70" height="18" rx="5" fill="#0f172a" opacity="0.75"/>
         <rect x="80" y="-4" width="70" height="18" rx="5" fill="#0f172a" opacity="0.75"/>
         <rect x="170" y="-4" width="70" height="18" rx="5" fill="#0f172a" opacity="0.75"/>
       </g>

       <!-- Tiny status LEDs -->
       <circle cx="-330" cy="-8" r="3" fill="#22c55e" opacity="0.95"/>
       <circle cx="-318" cy="-8" r="3" fill="#3b82f6" opacity="0.95"/>
       <circle cx="-306" cy="-8" r="3" fill="#fb923c" opacity="0.95"/>
     </g>

     <text x="0" y="42" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="800" letter-spacing="1">UNIVERSAL INTERFACE LAYER</text>
     
     <!-- Connection to Agent (Vertical) -->
     <line x1="0" y1="-10" x2="0" y2="-100" stroke="#f97316" stroke-width="5" stroke-dasharray="10,6" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite" />
     </line>
     
     <!-- Protocol Label Badge -->
     <g transform="translate(0, -70)">
       <g filter="url(#shadow-sm)">
         <polygon points="-52,-14 52,-14 64,-4 -40,-4" fill="#93c5fd" stroke="#1e40af" stroke-width="1"/>
         <polygon points="-40,-4 64,-4 64,18 -40,18" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
         <polygon points="-52,-14 -40,-4 -40,18 -52,8" fill="#1d4ed8" stroke="#1e40af" stroke-width="1" opacity="0.95"/>
       </g>
       <text x="0" y="10" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="800">JSON-RPC</text>
     </g>
  </g>

  <!-- ================= MODULES ================= -->

  <!-- MODULE 1: FILES (Local FS) -->
  <g transform="translate(250, 600)">
    <!-- Connection (Cyan Pipe) -->
    <path d="M 0 -30 L 0 -90" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Data Particles Up -->
    <circle r="4" fill="#3b82f6">
       <animateMotion path="M 0 -30 L 0 -100" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Isometric block: FILES -->
    <g filter="url(#shadow-sm)">
      <path d="M0 -30 L44 -8 L0 14 L-44 -8 Z" fill="#bfdbfe" stroke="#1e40af" stroke-width="1"/>
      <path d="M-44 -8 L0 14 L0 54 L-44 32 Z" fill="#60a5fa" stroke="#1e40af" stroke-width="1"/>
      <path d="M0 14 L44 -8 L44 32 L0 54 Z" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    </g>

    <text x="0" y="28" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">FILES</text>
    <text x="0" y="45" fill="#1d4ed8" font-size="10" text-anchor="middle" font-weight="800">Local FS</text>
    
    <!-- Status LED (Green for active PID) -->
    <circle cx="-45" cy="35" r="3" fill="#22c55e">
       <animate attributeName="opacity" values="1;0.4;1" dur="0.8s" repeatCount="indefinite" />
    </circle>
    <text x="-35" y="38" fill="#64748b" font-size="10" font-family="monospace">PID:9021</text>
  </g>

  <!-- MODULE 2: SQL DB (Postgres) -->
  <g transform="translate(450, 600)">
    <!-- Connection -->
    <path d="M 0 -30 L 0 -90" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <circle r="4" fill="#3b82f6">
       <animateMotion path="M 0 -30 L 0 -100" dur="1.5s" begin="0.7s" repeatCount="indefinite" />
    </circle>

    <!-- Isometric block: SQL DB -->
    <g filter="url(#shadow-sm)">
      <path d="M0 -30 L44 -8 L0 14 L-44 -8 Z" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
      <path d="M-44 -8 L0 14 L0 54 L-44 32 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="1"/>
      <path d="M0 14 L44 -8 L44 32 L0 54 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>

      <!-- Data layers hint -->
      <path d="M0 24 L44 2" stroke="#1e40af" stroke-width="1" opacity="0.25" fill="none"/>
      <path d="M0 34 L44 12" stroke="#1e40af" stroke-width="1" opacity="0.25" fill="none"/>
      <path d="M0 44 L44 22" stroke="#1e40af" stroke-width="1" opacity="0.25" fill="none"/>
    </g>

    <text x="0" y="28" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">SQL DB</text>
    <text x="0" y="45" fill="#1d4ed8" font-size="10" text-anchor="middle" font-weight="800">PostgreSQL</text>
  </g>

  <!-- MODULE 3: BROWSER (Firecrawl) -->
  <g transform="translate(750, 600)">
    <!-- Connection (Dashed Green) -->
    <path d="M 0 -30 L 0 -90" stroke="#22c55e" stroke-width="4" stroke-dasharray="6,6" stroke-linecap="round"/>
    <circle r="4" fill="#22c55e">
       <animateMotion path="M 0 -30 L 0 -100" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Isometric block: BROWSER -->
    <g filter="url(#shadow-sm)">
      <path d="M0 -30 L44 -8 L0 14 L-44 -8 Z" fill="#bbf7d0" stroke="#166534" stroke-width="1"/>
      <path d="M-44 -8 L0 14 L0 54 L-44 32 Z" fill="#86efac" stroke="#166534" stroke-width="1"/>
      <path d="M0 14 L44 -8 L44 32 L0 54 Z" fill="#22c55e" stroke="#166534" stroke-width="1"/>
    </g>
    
    <text x="0" y="28" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">BROWSER</text>
    <text x="0" y="45" fill="#166534" font-size="10" text-anchor="middle" font-weight="800">Firecrawl</text>
    
    <!-- Globe Icon (top face sticker) -->
    <circle cx="-28" cy="-6" r="6" stroke="#166534" stroke-width="1" fill="none" opacity="0.9"/>
    <path d="M-34 -6 L-22 -6" stroke="#166534" stroke-width="1" opacity="0.9"/>
    <path d="M-28 -12 L-28 0" stroke="#166534" stroke-width="1" opacity="0.9"/>
  </g>

  <!-- MODULE 4: JIRA/SLACK (Remote API) -->
  <g transform="translate(950, 600)">
    <!-- Connection (Dashed Green) -->
    <path d="M 0 -30 L 0 -90" stroke="#22c55e" stroke-width="4" stroke-dasharray="6,6" stroke-linecap="round"/>
    <circle r="4" fill="#22c55e">
       <animateMotion path="M 0 -30 L 0 -100" dur="2s" begin="1s" repeatCount="indefinite" />
    </circle>

    <!-- Isometric block: Remote API -->
    <g filter="url(#shadow-sm)">
      <path d="M0 -30 L44 -8 L0 14 L-44 -8 Z" fill="#dcfce7" stroke="#166534" stroke-width="1"/>
      <path d="M-44 -8 L0 14 L0 54 L-44 32 Z" fill="#bbf7d0" stroke="#166534" stroke-width="1"/>
      <path d="M0 14 L44 -8 L44 32 L0 54 Z" fill="#16a34a" stroke="#166534" stroke-width="1"/>

      <!-- Small API badge -->
      <rect x="-18" y="18" width="36" height="16" rx="6" fill="#0f172a" opacity="0.12"/>
      <text x="0" y="30" fill="#166534" font-size="10" text-anchor="middle" font-weight="800">API</text>
    </g>
    
    <text x="0" y="28" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">JIRA/SLACK</text>
    <text x="0" y="45" fill="#166534" font-size="10" text-anchor="middle" font-weight="800">Remote API</text>
    <text x="0" y="60" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">localhost:8080</text>
  </g>

  <!-- ================= TOOL DEFINITIONS (Floating) ================= -->
  <g transform="translate(300, 150)">
     <text x="0" y="-20" fill="#0f172a" font-size="12" font-weight="800" letter-spacing="0.6">TOOL DEFINITIONS INJECTION</text>
     
     <!-- Stream Path -->
     <path d="M 0 0 L 250 100" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6" stroke-linecap="round"/>
     
     <!-- Floating Blocks (Paper Slips) -->
      <g>
        <g filter="url(#shadow-sm)">
          <polygon points="0,0 100,0 112,10 12,10" fill="#fed7aa" stroke="#c2410c" stroke-width="1"/>
          <polygon points="0,0 12,10 12,40 0,30" fill="#ea580c" stroke="#c2410c" stroke-width="1"/>
          <polygon points="12,10 112,10 112,40 12,40" fill="#fb923c" stroke="#c2410c" stroke-width="1"/>
        </g>
        <text x="18" y="24" fill="#9a3412" font-size="10" font-weight="800">{ "name":</text>
        <text x="18" y="38" fill="#0f172a" font-size="10" font-weight="700">  "read_file" }</text>
         
         <animateMotion path="M -50 -50 L 250 130" dur="4s" repeatCount="indefinite" />
         <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" />
      </g>

      <g>
        <g filter="url(#shadow-sm)">
          <polygon points="0,0 100,0 112,10 12,10" fill="#bfdbfe" stroke="#1e40af" stroke-width="1"/>
          <polygon points="0,0 12,10 12,40 0,30" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
          <polygon points="12,10 112,10 112,40 12,40" fill="#60a5fa" stroke="#1e40af" stroke-width="1"/>
        </g>
        <text x="18" y="24" fill="#1e40af" font-size="10" font-weight="800">{ "name":</text>
        <text x="18" y="38" fill="#0f172a" font-size="10" font-weight="700">  "query_db" }</text>
         
         <animateMotion path="M -50 -50 L 250 130" dur="4s" begin="1.3s" repeatCount="indefinite" />
         <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1.3s" repeatCount="indefinite" />
      </g>
     
      <g>
        <g filter="url(#shadow-sm)">
          <polygon points="0,0 100,0 112,10 12,10" fill="#bbf7d0" stroke="#166534" stroke-width="1"/>
          <polygon points="0,0 12,10 12,40 0,30" fill="#16a34a" stroke="#166534" stroke-width="1"/>
          <polygon points="12,10 112,10 112,40 12,40" fill="#4ade80" stroke="#166534" stroke-width="1"/>
        </g>
        <text x="18" y="24" fill="#166534" font-size="10" font-weight="800">{ "name":</text>
        <text x="18" y="38" fill="#0f172a" font-size="10" font-weight="700">  "jira_get" }</text>
         
         <animateMotion path="M -50 -50 L 250 130" dur="4s" begin="2.6s" repeatCount="indefinite" />
         <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="2.6s" repeatCount="indefinite" />
      </g>
  </g>

  <!-- ================= LLM CONNECTION ================= -->
  <g transform="translate(900, 150)">
    <!-- Isometric remote endpoint block -->
    <g filter="url(#shadow-sm)">
      <path d="M0 -34 L40 -14 L0 6 L-40 -14 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
      <path d="M-40 -14 L0 6 L0 46 L-40 26 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
      <path d="M0 6 L40 -14 L40 26 L0 46 Z" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    </g>
    <text x="0" y="18" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="800">LLM API</text>
    
    <!-- Connection -->
    <path d="M -40 30 L -230 130" stroke="#64748b" stroke-width="2" stroke-dasharray="8,6" stroke-linecap="round"/>
    
    <g transform="translate(0, 60)">
       <text x="0" y="0" fill="#475569" font-size="11" text-anchor="middle" font-style="italic">"It's just a tool_call"</text>
    </g>
  </g>

</svg>
