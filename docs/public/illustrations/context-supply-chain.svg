<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" style="background-color: #0B1120; font-family: 'JetBrains Mono', Consolas, monospace;">
  <!-- DEFINITIONS -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-tube" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrow-head" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B" />
    </marker>
    <marker id="arrow-flow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <!-- BACKGROUND GRID -->
  <pattern id="grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid-pattern)" />
  
  <!-- CONNECTING PIPES (Background) -->
  <!-- Main Pipe: Agent -> LLM -->
  <path d="M 460 250 L 680 250" stroke="url(#grad-flow)" stroke-width="4" stroke-dasharray="10 5" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2s" repeatCount="indefinite" />
  </path>
  <!-- Return Pipe: LLM -> Agent (The Loop) -->
  <path d="M 1080 250 L 1100 250 Q 1150 250 1150 300 L 1150 400 Q 1150 450 1100 450 L 150 450 Q 100 450 100 400 L 100 300 Q 100 250 150 250 L 190 250" 
        fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 4" opacity="0.5" />
  
  <!-- SECTION 1: THE SOURCE (RAW CONTEXT) -->
  <g transform="translate(50, 150)">
    <text x="70" y="-30" fill="#94A3B8" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">RAW MATERIALS</text>
    <rect x="0" y="0" width="140" height="200" fill="#1E293B" stroke="#475569" stroke-width="1" rx="8" />
    
    <!-- File Icons -->
    <g transform="translate(20, 30)">
      <rect x="0" y="0" width="30" height="40" fill="#334155" stroke="#64748B" />
      <text x="15" y="25" fill="#94A3B8" font-size="20" text-anchor="middle">📄</text>
    </g>
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="30" height="40" fill="#334155" stroke="#64748B" />
      <text x="15" y="25" fill="#94A3B8" font-size="20" text-anchor="middle">💾</text>
    </g>
    <g transform="translate(90, 20)">
      <rect x="0" y="0" width="30" height="40" fill="#334155" stroke="#64748B" />
      <text x="15" y="25" fill="#94A3B8" font-size="20" text-anchor="middle">📂</text>
    </g>
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="80" height="30" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
      <text x="40" y="20" fill="#38BDF8" font-size="10" text-anchor="middle">USER PROMPT</text>
    </g>
    <text x="70" y="160" fill="#94A3B8" font-size="10" text-anchor="middle" font-style="italic">Unstructured Noise</text>
  </g>

  <!-- ARROW 1 -->
  <line x1="190" y1="250" x2="290" y2="250" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-head)" />

  <!-- SECTION 2: THE AGENT (ASSEMBLY) -->
  <g transform="translate(300, 120)">
    <text x="80" y="-20" fill="#38BDF8" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">THE AGENT</text>
    <!-- Machine Body -->
    <rect x="0" y="0" width="160" height="260" fill="url(#grad-tube)" stroke="#38BDF8" stroke-width="2" rx="4" filter="url(#neon-glow)" />
    
    <!-- Internal Mechanics -->
    <line x1="20" y1="40" x2="140" y2="40" stroke="#38BDF8" stroke-width="1" />
    <text x="80" y="30" fill="#38BDF8" font-size="10" text-anchor="middle">CONTEXT ASSEMBLER</text>
    
    <!-- Actions -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="100" height="25" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="50" y="17" fill="#E2E8F0" font-size="10" text-anchor="middle">1. FILTER</text>
    </g>
    <g transform="translate(30, 105)">
      <rect x="0" y="0" width="100" height="25" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="50" y="17" fill="#E2E8F0" font-size="10" text-anchor="middle">2. FORMAT</text>
    </g>
    <g transform="translate(30, 140)">
      <rect x="0" y="0" width="100" height="25" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="50" y="17" fill="#E2E8F0" font-size="10" text-anchor="middle">3. COMPRESS</text>
    </g>
    
    <!-- Output Port -->
    <circle cx="160" cy="130" r="8" fill="#38BDF8" />
  </g>

  <!-- TRANSPORT LABELS -->
  <g transform="translate(570, 230)">
    <text x="0" y="0" fill="#8B5CF6" font-size="12" font-weight="bold" text-anchor="middle">HTTP REQUEST</text>
    <text x="0" y="15" fill="#64748B" font-size="10" text-anchor="middle">JSON Payload (Window Limit)</text>
  </g>

  <!-- SECTION 3: THE LLM (PROCESSING) -->
  <g transform="translate(680, 100)">
    <text x="100" y="-20" fill="#EC4899" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">LLM API</text>
    <!-- Brain/Chip Shape -->
    <path d="M 50 0 L 150 0 L 200 80 L 150 160 L 50 160 L 0 80 Z" fill="#1E293B" stroke="#EC4899" stroke-width="2" filter="url(#neon-glow)" />
    
    <!-- Core Glow -->
    <circle cx="100" cy="80" r="40" fill="#EC4899" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <text x="100" y="85" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">INFERENCE</text>
    
    <!-- Stateless Badge -->
    <g transform="translate(60, 190)">
      <rect x="0" y="0" width="80" height="20" fill="#991B1B" rx="10" />
      <text x="40" y="14" fill="#FECACA" font-size="10" font-weight="bold" text-anchor="middle">NO MEMORY</text>
    </g>
  </g>

  <!-- ARROW 2 -->
  <line x1="880" y1="180" x2="920" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-head)" />

  <!-- SECTION 4: THE OUTPUT (ACTION) -->
  <g transform="translate(920, 120)">
    <text x="80" y="-20" fill="#10B981" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">OUTPUT</text>
    <rect x="0" y="0" width="160" height="150" fill="#1E293B" stroke="#10B981" stroke-width="2" rx="4" />
    
    <!-- Code Block -->
    <rect x="10" y="10" width="140" height="130" fill="#0B1120" rx="2" />
    <text x="20" y="30" fill="#10B981" font-size="10" font-family="monospace">&gt; Tool_Call</text>
    <text x="20" y="50" fill="#94A3B8" font-size="10" font-family="monospace">  args: { ... }</text>
    <text x="20" y="80" fill="#10B981" font-size="10" font-family="monospace">&gt; Thought:</text>
    <text x="20" y="100" fill="#94A3B8" font-size="10" font-family="monospace">  "I need to..."</text>
  </g>

  <!-- LOOP BACK -->
  <g transform="translate(625, 430)">
    <text x="0" y="0" fill="#64748B" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">THE RECURSIVE LOOP</text>
    <text x="0" y="15" fill="#475569" font-size="10" text-anchor="middle">Output becomes Input for next turn</text>
  </g>
  
  <!-- Flow Arrows on Loop -->
  <path d="M 600 450 L 590 445 L 590 455 Z" fill="#64748B">
     <animateTransform attributeName="transform" type="translate" from="200 0" to="-200 0" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- TITLE -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="4" height="40" fill="#3B82F6" />
    <text x="15" y="18" fill="#E2E8F0" font-size="20" font-weight="bold">CONTEXT SUPPLY CHAIN</text>
    <text x="15" y="38" fill="#64748B" font-size="12">Everything is Context</text>
  </g>

</svg>