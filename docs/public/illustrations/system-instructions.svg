<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'JetBrains Mono', Consolas, monospace" style="background-color: #0f172a;">
  <!-- Definitions: Grids, Markers, Filters -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow-pink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f472b6" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Gradient for the "Path" -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- TITLE BLOCK -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="340" height="70" fill="none" stroke="#f472b6" stroke-width="2"/>
    <text x="20" y="42" fill="#f472b6" font-size="24" font-weight="bold">SYSTEM INSTRUCTIONS</text>
    <text x="20" y="90" fill="#94a3b8" font-size="14">CONTEXT PRIORITY: HIGHEST</text>
  </g>

  <!-- ZONE 1: ASSET MANAGEMENT (Left) -->
  <g transform="translate(100, 200)">
    <!-- Git Branch Visual -->
    <line x1="20" y1="0" x2="20" y2="300" stroke="#4ade80" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
    <circle cx="20" cy="50" r="6" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <circle cx="20" cy="150" r="6" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <circle cx="20" cy="250" r="6" fill="#4ade80">
       <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
       <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Code Editor Box -->
    <g transform="translate(60, 80)">
        <rect x="0" y="0" width="220" height="160" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
        <!-- Header -->
        <rect x="0" y="0" width="220" height="25" rx="4" fill="#334155"/>
        <circle cx="15" cy="12" r="3" fill="#ef4444"/>
        <circle cx="27" cy="12" r="3" fill="#eab308"/>
        <circle cx="39" cy="12" r="3" fill="#22c55e"/>
        <text x="60" y="17" fill="#cbd5e1" font-size="10">instructions.md</text>
        
        <!-- Code Lines -->
        <g transform="translate(15, 40)">
            <rect x="0" y="0" width="80" height="8" rx="2" fill="#f472b6" opacity="0.8"/>
            <rect x="90" y="0" width="60" height="8" rx="2" fill="#64748b" opacity="0.5"/>
            
            <rect x="0" y="15" width="120" height="8" rx="2" fill="#64748b" opacity="0.5"/>
            <rect x="0" y="30" width="180" height="8" rx="2" fill="#64748b" opacity="0.5"/>
            <rect x="0" y="45" width="100" height="8" rx="2" fill="#64748b" opacity="0.5"/>
            
            <rect x="0" y="70" width="140" height="8" rx="2" fill="#64748b" opacity="0.5"/>
        </g>
        
        <!-- Scanline Animation -->
        <rect x="0" y="25" width="220" height="2" fill="#4ade80" opacity="0.5">
            <animate attributeName="y" values="25;160;25" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
        </rect>
    </g>

    <text x="170" y="270" fill="#4ade80" font-size="12" text-anchor="middle">MAINTAINABLE ASSET</text>
    <text x="170" y="290" fill="#94a3b8" font-size="10" text-anchor="middle">Versioned &amp; Reviewed</text>
  </g>

  <!-- ARROW: Asset -> Injection -->
  <path d="M 380 280 L 440 280" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-pink)" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" from="8" to="0" dur="1s" repeatCount="indefinite" />
  </path>

  <!-- ZONE 2: INJECTION ASSEMBLY (Center) -->
  <g transform="translate(460, 100)">
    <!-- Main Chassis -->
    <rect x="0" y="0" width="300" height="400" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10,5"/>
    
    <!-- Label -->
    <text x="150" y="30" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">CONTEXT INJECTOR</text>

    <!-- 1. System Instruction Slot (Top Priority) -->
    <g transform="translate(50, 60)">
        <rect x="-10" y="0" width="220" height="60" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
        <text x="10" y="25" fill="#f472b6" font-size="12" font-weight="bold">SYSTEM INSTRUCTION</text>
        <text x="10" y="45" fill="#f472b6" font-size="10" opacity="0.7">Role • Rules • Goals</text>
        
        <!-- Pulsing Priority Indicator -->
        <circle cx="190" cy="30" r="4" fill="#f472b6">
            <animate attributeName="r" values="4;6;4" dur="1s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
        </circle>
        
        <!-- The "Block" dropping down animation -->
        <rect x="0" y="0" width="200" height="50" fill="#f472b6" opacity="0.2" transform="translate(0, 0)">
           <animate attributeName="y" values="-50; 0; 0; 250" dur="4s" keyTimes="0; 0.2; 0.6; 1" repeatCount="indefinite" />
           <animate attributeName="opacity" values="0; 1; 1; 0" dur="4s" keyTimes="0; 0.2; 0.6; 1" repeatCount="indefinite" />
        </rect>
    </g>

    <!-- 2. Connection Lines -->
    <path d="M 150 120 L 150 160" stroke="#64748b" stroke-width="2" stroke-dasharray="2,2"/>

    <!-- 3. Dynamic Inputs (User/History) -->
    <g transform="translate(50, 160)">
        <rect x="-10" y="0" width="220" height="120" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
        <text x="10" y="25" fill="#38bdf8" font-size="12">DYNAMIC CONTEXT</text>
        <text x="10" y="45" fill="#94a3b8" font-size="10">History + User Input</text>

        <!-- User Block Animation -->
        <rect x="10" y="60" width="180" height="40" rx="2" fill="#38bdf8" opacity="0.8">
            <animate attributeName="x" values="250; 10; 10" dur="4s" keyTimes="0; 0.4; 1" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0; 1; 1" dur="4s" keyTimes="0; 0.4; 1" repeatCount="indefinite" />
             <!-- Text moves with rect -->
        </rect>
        <text x="100" y="85" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">
             USER MSG
             <animate attributeName="x" values="340; 100; 100" dur="4s" keyTimes="0; 0.4; 1" repeatCount="indefinite" />
             <animate attributeName="opacity" values="0; 1; 1" dur="4s" keyTimes="0; 0.4; 1" repeatCount="indefinite" />
        </text>
    </g>
    
    <!-- 4. Merging Zone (Bottom) -->
    <g transform="translate(50, 320)">
         <!-- Merged Stack: System always on top/first -->
         <rect x="0" y="0" width="200" height="60" fill="#0f172a" stroke="#ffffff" stroke-width="1"/>
         
         <!-- System Layer (Always First) -->
         <rect x="5" y="5" width="190" height="15" fill="#f472b6" opacity="0.9"/>
         <!-- User Layer (After) -->
         <rect x="5" y="25" width="190" height="30" fill="#38bdf8" opacity="0.9"/>
         
         <!-- Moving out animation -->
         <animateTransform attributeName="transform" type="translate" from="50 320" to="50 450" dur="4s" begin="2.4s" repeatCount="indefinite"/>
         <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ARROW: Injector -> Output -->
  <path d="M 760 300 L 840 300" stroke="#f472b6" stroke-width="2" marker-end="url(#arrow-pink)" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" from="8" to="0" dur="0.5s" repeatCount="indefinite" />
  </path>

  <!-- ZONE 3: BEHAVIORAL OUTPUT (Right) -->
  <g transform="translate(860, 150)">
      <!-- The "Road" Metaphor -->
      <path d="M 0 150 L 300 50 L 300 250 Z" fill="url(#beam)" opacity="0.2"/>
      <path d="M 0 150 L 300 50" stroke="#f472b6" stroke-width="2"/>
      <path d="M 0 150 L 300 250" stroke="#f472b6" stroke-width="2"/>
      
      <!-- Guardrails Label -->
      <text x="180" y="40" fill="#f472b6" font-size="12" font-style="italic">Guardrails</text>
      <text x="180" y="270" fill="#f472b6" font-size="12" font-style="italic">Guardrails</text>

      <!-- The Agent/Bot -->
      <circle cx="0" cy="150" r="30" fill="#1e293b" stroke="#ffffff" stroke-width="2">
        <animateMotion path="M 0 0 L 250 0" dur="4s" begin="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="155" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">AGENT
        <animateMotion path="M 0 0 L 250 0" dur="4s" begin="2.5s" repeatCount="indefinite" />
      </text>
      
      <!-- "Behavioral Baseline" Text -->
      <text x="150" y="320" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" filter="url(#glow)">BEHAVIORAL BASELINE</text>
      <text x="150" y="340" fill="#94a3b8" font-size="12" text-anchor="middle">"Paving the Road"</text>
  </g>
  
  <!-- DECORATIVE ELEMENTS -->
  <!-- Status Info -->
  <g transform="translate(950, 40)">
     <text x="0" y="0" fill="#94a3b8" font-size="10" text-anchor="end">SYS_INJECT: ACTIVE</text>
     <text x="0" y="15" fill="#94a3b8" font-size="10" text-anchor="end">OVERRIDE: ENABLED</text>
     <circle cx="10" cy="-5" r="3" fill="#f472b6">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
     </circle>
  </g>

  <!-- Flow Particles background -->
  <circle r="2" fill="#38bdf8" opacity="0.4">
      <animateMotion path="M 100 500 L 1100 500" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle r="2" fill="#38bdf8" opacity="0.4">
      <animateMotion path="M 200 520 L 1000 520" dur="7s" repeatCount="indefinite" />
  </circle>

</svg>