<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Context cost: tool schemas scale with MCP</title>
  <desc id="desc">Two side-by-side profiles compare how tool definitions (static) can crowd out messages (dynamic) in the context window when many MCP servers/tools are enabled.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <style><![CDATA[
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }

    .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .kicker { font-size: 11px; font-weight: 800; letter-spacing: 0.8px; fill: #64748b; }
    .label { font-size: 12px; font-weight: 800; fill: #334155; }
    .small { font-size: 11px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 11px; fill: #334155; }

    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .chip-text { font-size: 11px; font-weight: 700; fill: #0f172a; }

    .bar-bg { fill: #f1f5f9; stroke: #e2e8f0; }
    .seg-instr { fill: #dbeafe; stroke: #bfdbfe; }
    .seg-msg { fill: #e2e8f0; }
    .seg-tools { fill: #ede9fe; stroke: #ddd6fe; }

    .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); stroke-dasharray: 6 6; }
  ]]></style>

  <!-- Background + panel -->
  <rect class="bg" x="0" y="0" width="1200" height="360"/>
  <rect class="panel" x="24" y="24" width="1152" height="312" rx="16" filter="url(#shadow)"/>

  <!-- Header -->
  <text class="title" x="48" y="64">Context Cost of MCP Tools</text>
  <text class="subtitle" x="48" y="88">Tool definitions are <tspan font-weight="700" fill="#0f172a">static</tspan> context injected on every request. More tools → less room for messages.</text>
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Left card: lean profile -->
  <g transform="translate(60, 126)">
    <rect class="card" x="0" y="0" width="520" height="196" rx="14" filter="url(#shadow-sm)"/>
    <text class="kicker" x="16" y="26">PROFILE A</text>
    <text class="label" x="16" y="50">Lean (enable only what you need)</text>

    <text class="small" x="16" y="76">Enabled servers:</text>
    <g transform="translate(16, 86)">
      <rect class="chip" x="0" y="0" width="120" height="26" rx="13"/>
      <text class="chip-text" x="60" y="18" text-anchor="middle">Search</text>
      <rect class="chip" x="132" y="0" width="140" height="26" rx="13"/>
      <text class="chip-text" x="202" y="18" text-anchor="middle">Docs</text>
    </g>

    <text class="small" x="16" y="132">Context window (same total budget):</text>
    <g transform="translate(16, 144)">
      <rect class="bar-bg" x="0" y="0" width="488" height="34" rx="10"/>
      <rect class="seg-instr" x="0" y="0" width="110" height="34" rx="10"/>
      <rect class="seg-msg" x="110" y="0" width="270" height="34"/>
      <rect class="seg-tools" x="380" y="0" width="108" height="34" rx="10"/>
    </g>

    <g transform="translate(16, 190)">
      <rect x="0" y="0" width="10" height="10" fill="#dbeafe" stroke="#bfdbfe"/>
      <text class="small" x="16" y="10">Instructions</text>
      <rect x="132" y="0" width="10" height="10" fill="#e2e8f0"/>
      <text class="small" x="148" y="10">Messages + tool outputs</text>
      <rect x="324" y="0" width="10" height="10" fill="#ede9fe" stroke="#ddd6fe"/>
      <text class="small" x="340" y="10">Tool schemas (built-in + MCP)</text>
    </g>
  </g>

  <!-- Middle: profile switch arrow -->
  <g>
    <path class="arrow" d="M 580 224 L 620 224"/>
    <text class="mono" x="600" y="206" text-anchor="middle">switch per task</text>
  </g>

  <!-- Right card: everything enabled -->
  <g transform="translate(620, 126)">
    <rect class="card" x="0" y="0" width="520" height="196" rx="14" filter="url(#shadow-sm)"/>
    <text class="kicker" x="16" y="26">PROFILE B</text>
    <text class="label" x="16" y="50">Everything enabled ("just in case")</text>

    <text class="small" x="16" y="76">Enabled servers:</text>
    <g transform="translate(16, 86)">
      <rect class="chip" x="0" y="0" width="110" height="26" rx="13"/>
      <text class="chip-text" x="55" y="18" text-anchor="middle">Search</text>
      <rect class="chip" x="122" y="0" width="98" height="26" rx="13"/>
      <text class="chip-text" x="171" y="18" text-anchor="middle">Docs</text>
      <rect class="chip" x="232" y="0" width="104" height="26" rx="13"/>
      <text class="chip-text" x="284" y="18" text-anchor="middle">DB</text>
      <rect class="chip" x="348" y="0" width="140" height="26" rx="13"/>
      <text class="chip-text" x="418" y="18" text-anchor="middle">Internal API</text>
    </g>

    <text class="small" x="16" y="132">Context window (same total budget):</text>
    <g transform="translate(16, 144)">
      <rect class="bar-bg" x="0" y="0" width="488" height="34" rx="10"/>
      <rect class="seg-instr" x="0" y="0" width="110" height="34" rx="10"/>

      <!-- Messages segment shrinks as tools grow -->
      <rect class="seg-msg" x="110" y="0" width="150" height="34">
        <animate attributeName="width" values="150;70;150" dur="3.2s" repeatCount="indefinite"/>
      </rect>

      <!-- Tools segment grows and crowds out messages -->
      <rect class="seg-tools" x="260" y="0" width="228" height="34" rx="10">
        <animate attributeName="x" values="260;180;260" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="width" values="228;308;228" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.92;1" dur="1.6s" repeatCount="indefinite"/>
      </rect>

      <!-- Emphasis label -->
      <text class="mono" x="332" y="22" text-anchor="middle" fill="#6d28d9">tools[]</text>
    </g>

    <text class="small" x="16" y="190">Rule of thumb: keep MCP off by default; enable by profile when needed.</text>
  </g>
</svg>
