<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'JetBrains Mono', Consolas, monospace" style="background-color: #0f172a;">
  <!-- Background Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <!-- Glow Filters -->
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Markers -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f87171" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4ade80" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="grad-gate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#f87171" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="320" height="60" fill="none" stroke="#f472b6" stroke-width="2"/>
    <text x="15" y="38" fill="#f472b6" font-size="24" font-weight="bold" filter="url(#glow-red)">HUMAN-IN-THE-LOOP</text>
    <text x="330" y="38" fill="#94a3b8" font-size="14">DECISION PROTOCOL</text>
  </g>

  <!-- ======================== MAIN COMPONENTS ======================== -->

  <!-- 1. INPUT STATION (Left) - "Define Task" -->
  <g transform="translate(100, 300)">
    <rect x="0" y="-40" width="120" height="80" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="-15" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">USER INTENT</text>
    <text x="60" y="10" fill="#94a3b8" font-size="10" text-anchor="middle">Task Definition</text>
    
    <!-- Pulse Effect -->
    <circle cx="60" cy="0" r="45" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="45; 55; 45" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5; 0; 0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 2. AGENT CORE (Center Left) - "Agent Planning" -->
  <g transform="translate(350, 300)">
    <circle cx="0" cy="0" r="50" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow-blue)"/>
    <text x="0" y="5" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">AGENT</text>
    
    <!-- Spinning Ring -->
    <path d="M -60 0 A 60 60 0 0 1 60 0" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10,10">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M -60 0 A 60 60 0 0 0 60 0" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10,10" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 3. RISK ANALYZER (Splitter) -->
  <g transform="translate(550, 300)">
    <polygon points="0,-30 30,0 0,30 -30,0" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="0" y="5" fill="#94a3b8" font-size="10" text-anchor="middle">RISK?</text>
  </g>

  <!-- 4. HUMAN GATE (Top Center) - "Approval/Review" -->
  <g transform="translate(750, 150)">
    <!-- Gate Box -->
    <rect x="-80" y="-40" width="160" height="80" rx="4" fill="#1e293b" stroke="#f472b6" stroke-width="2" filter="url(#glow-red)"/>
    <text x="0" y="-15" fill="#f472b6" font-size="16" font-weight="bold" text-anchor="middle">HUMAN GATE</text>
    <text x="0" y="10" fill="#f472b6" font-size="10" text-anchor="middle">Review / Modify</text>
    
    <!-- Warning Light Blink -->
    <circle cx="-65" cy="-25" r="4" fill="#f472b6">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 5. OUTPUT (Right) - "Production" -->
  <g transform="translate(1050, 300)">
    <rect x="-50" y="-40" width="100" height="80" fill="#1e293b" stroke="#4ade80" stroke-width="2" filter="url(#glow-green)"/>
    <text x="0" y="5" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">RESULT</text>
  </g>

  <!-- ======================== PATHS & CONNECTIONS ======================== -->

  <!-- Path 1: Input to Agent -->
  <path d="M 160 300 L 290 300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  
  <!-- Path 2: Agent to Risk -->
  <path d="M 410 300 L 510 300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Path 3: Risk -> Low Risk (Direct to Output) -->
  <path d="M 580 300 L 990 300" stroke="#4ade80" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
  <text x="750" y="320" fill="#4ade80" font-size="10" opacity="0.6" text-anchor="middle">LOW RISK (AUTO)</text>

  <!-- Path 4: Risk -> High Risk (To Human Gate) -->
  <path d="M 550 270 L 550 150 L 660 150" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="560" y="210" fill="#f87171" font-size="10" transform="rotate(-90 540 210)">HIGH RISK</text>

  <!-- Path 5: Human -> Approved (To Output) -->
  <path d="M 830 150 L 1050 150 L 1050 250" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="940" y="140" fill="#4ade80" font-size="10" text-anchor="middle">APPROVED</text>

  <!-- Path 6: Human -> Rejected/Modified (Context Injection back to Agent) -->
  <path d="M 750 190 L 750 450 L 350 450 L 350 360" stroke="#f472b6" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="550" y="440" fill="#f472b6" font-size="10" text-anchor="middle">CONTEXT INJECTION (CORRECTION)</text>


  <!-- ======================== ANIMATIONS ======================== -->

  <!-- Animation 1: Initial Task Packets (Input -> Agent) -->
  <circle r="4" fill="#38bdf8">
    <animateMotion path="M 160 300 L 290 300" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Animation 2: Low Risk Flow (Fast Track) -->
  <circle r="3" fill="#4ade80">
    <animateMotion path="M 580 300 L 990 300" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#4ade80">
    <animateMotion path="M 580 300 L 990 300" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Animation 3: High Risk Flow (Up to Gate) -->
  <rect width="8" height="8" fill="#f87171" rx="1">
    <animateMotion path="M 550 270 L 550 150 L 660 150" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Animation 4: Approval Flow (Gate -> Output) -->
  <circle r="4" fill="#4ade80" filter="url(#glow-green)">
    <animateMotion path="M 830 150 L 1050 150 L 1050 250" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Animation 5: Correction Loop (Gate -> Context Injection -> Agent) -->
  <g>
    <text x="0" y="0" fill="#f472b6" font-size="12" font-weight="bold">!</text>
    <animateMotion path="M 750 190 L 750 450 L 350 450 L 350 360" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- Animation 6: Context Absorption (at Agent bottom) -->
  <circle cx="350" cy="360" r="0" fill="none" stroke="#f472b6" stroke-width="2">
     <animate attributeName="r" values="0; 20" dur="1s" begin="0s" repeatCount="indefinite"/>
     <animate attributeName="opacity" values="1; 0" dur="1s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- Decorative: Binary Rain in Background (Subtle) -->
  <g opacity="0.1" font-size="10" fill="#38bdf8">
    <text x="1100" y="50">1</text>
    <text x="1100" y="70">0</text>
    <text x="1100" y="90">1</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 20" dur="1s" repeatCount="indefinite"/>
  </g>
  
  <!-- Legend -->
  <g transform="translate(40, 600)">
     <rect x="0" y="0" width="10" height="10" fill="#38bdf8"/> <text x="20" y="9" fill="#94a3b8" font-size="10">Auto Flow</text>
     <rect x="100" y="0" width="10" height="10" fill="#f87171"/> <text x="120" y="9" fill="#94a3b8" font-size="10">Needs Approval</text>
     <rect x="230" y="0" width="10" height="10" fill="#f472b6"/> <text x="250" y="9" fill="#94a3b8" font-size="10">Context Shift</text>
  </g>

</svg>