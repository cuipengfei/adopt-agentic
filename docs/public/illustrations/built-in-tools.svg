<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" style="background-color: #f8fafc;">
  <!-- Definitions -->
  <defs>
    <!-- Dot Pattern -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.5"/>
    </pattern>
    
    <!-- Shadow Filter -->
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.1"/>
    </filter>
    
    <filter id="shadow-md" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-head-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-head-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#dot-grid)"/>

  <!-- Title -->
  <g transform="translate(40, 40)">
    <text x="0" y="20" fill="#0f172a" font-size="24" font-weight="700">Built-in Tools</text>
    <text x="0" y="45" fill="#64748b" font-size="14">Structural View: Agent Capability Layer</text>
    <line x1="0" y1="60" x2="1120" y2="60" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- ==================== PART 1: CONTEXT LAYER (Left) ==================== -->
  <g transform="translate(60, 120)">
    <!-- Container -->
    <rect x="0" y="0" width="300" height="480" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow-sm)"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="20" r="4" fill="#cbd5e1"/>
    <circle cx="35" cy="20" r="4" fill="#cbd5e1"/>
    <circle cx="50" cy="20" r="4" fill="#cbd5e1"/>
    
    <!-- Header -->
    <text x="20" y="50" fill="#64748b" font-size="12" font-weight="600" letter-spacing="1">CONTEXT BUFFER</text>
    
    <!-- Section 1: System Instructions -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="260" height="80" rx="4" fill="#f1f5f9"/>
      <text x="15" y="25" fill="#475569" font-size="12" font-weight="600">System Instructions</text>
      <!-- Anim: Scanning lines indicating active context -->
      <line x1="15" y1="35" x2="200" y2="35" stroke="#cbd5e1" stroke-width="2">
        <animate attributeName="x2" values="200;100;200" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite" />
      </line>
      <line x1="15" y1="45" x2="180" y2="45" stroke="#cbd5e1" stroke-width="2">
        <animate attributeName="x2" values="180;120;180" dur="4s" begin="1s" repeatCount="indefinite" />
      </line>
      <line x1="15" y1="55" x2="220" y2="55" stroke="#cbd5e1" stroke-width="2">
        <animate attributeName="x2" values="220;140;220" dur="4s" begin="2s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Section 2: Tool Definitions (Key Focus) -->
    <g transform="translate(20, 170)">
      <rect x="0" y="0" width="260" height="180" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <!-- Anim: Subtle glow on active focus -->
      <rect x="0" y="0" width="260" height="180" rx="4" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0">
         <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite" />
      </rect>
      
      <text x="15" y="25" fill="#2563eb" font-size="12" font-weight="600">Tool Definitions (JSON Schema)</text>
      
      <!-- Code Block Simulation -->
      <g transform="translate(15, 40)" font-family="monospace" font-size="10" fill="#3b82f6">
        <text x="0" y="10">tools: [</text>
        <text x="10" y="25">  { name: "read_file",</text>
        <text x="10" y="40">    desc: "Read local file",</text>
        <text x="10" y="55">    args: { path: "str" } },</text>
        <text x="10" y="70">  { name: "ls", ... },</text>
        <text x="10" y="85">  { name: "grep", ... },</text>
        <text x="10" y="100" fill="#ef4444">  { name: "write_file",</text>
        <text x="10" y="115" fill="#ef4444">    desc: "⚠️ Modify FS" }</text>
        <text x="0" y="130">]</text>
      </g>
    </g>

    <!-- Label -->
    <text x="150" y="460" fill="#94a3b8" font-size="11" text-anchor="middle">Occupies Context Window Space</text>
  </g>

  <!-- ==================== PART 2: EXECUTION BRIDGE (Center) ==================== -->
  <g transform="translate(420, 200)">
    
    <!-- Arrow from Context to LLM -->
    <path d="M -60 100 L 0 100" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow-head)"/>
    <!-- Anim: Packet flow to LLM -->
    <circle r="3" fill="#cbd5e1">
      <animateMotion path="M -60 100 L 0 100" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- LLM Logic Unit -->
    <g>
      <rect x="0" y="0" width="160" height="200" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow-md)"/>
      <text x="80" y="30" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">LLM Logic</text>
      <text x="80" y="50" fill="#64748b" font-size="11" text-anchor="middle">Inference Engine</text>
      
      <!-- Animated Pulse Ring (Existing) -->
      <circle cx="80" cy="110" r="40" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.5">
        <animate attributeName="r" values="40;50;40" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="110" r="30" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
      
      <!-- Tool Call Generation -->
      <g transform="translate(20, 160)">
        <rect x="0" y="0" width="120" height="24" rx="12" fill="#6366f1"/>
        <text x="60" y="16" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Gen: tool_calls</text>
        <!-- Anim: Generation Pulse -->
        <rect x="0" y="0" width="120" height="24" rx="12" fill="#818cf8" opacity="0">
             <animate attributeName="opacity" values="0;0.5;0" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
      
      <!-- Anim: Emission from brain to output -->
      <circle r="2" fill="#6366f1" opacity="0">
         <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
         <animateTransform attributeName="transform" type="translate" from="80 110" to="80 160" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Arrow from LLM to Runtime -->
    <path d="M 160 100 L 220 100" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-head-blue)" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <!-- Anim: Intent Packet -->
    <rect x="0" y="-3" width="6" height="6" fill="#6366f1" rx="1">
       <animateMotion path="M 160 100 L 220 100" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ==================== PART 3: AGENT RUNTIME (Right Center) ==================== -->
  <g transform="translate(640, 120)">
    <!-- Container -->
    <rect x="0" y="0" width="220" height="480" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#shadow-md)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="220" height="40" rx="8 8 0 0" fill="#0f172a"/>
    <text x="110" y="26" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">AGENT RUNTIME</text>

    <!-- Tool Palette (Buttons) -->
    <g transform="translate(20, 60)">
      <text x="0" y="15" fill="#64748b" font-size="10" font-weight="600">AVAILABLE EXECUTORS</text>
      
      <!-- Safe Tools -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="180" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <circle cx="20" cy="18" r="8" fill="#22c55e"/> <!-- Green for safe -->
        <text x="40" y="22" fill="#334155" font-size="12" font-family="monospace">read_file()</text>
        <!-- Anim: Selection Indicator -->
        <rect x="0" y="0" width="180" height="36" rx="4" fill="none" stroke="#22c55e" stroke-width="2" opacity="0">
             <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" />
        </rect>
      </g>
      
      <g transform="translate(0, 75)">
        <rect x="0" y="0" width="180" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <circle cx="20" cy="18" r="8" fill="#22c55e"/>
        <text x="40" y="22" fill="#334155" font-size="12" font-family="monospace">ls / grep</text>
      </g>

      <!-- Risky Tool -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="180" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <circle cx="20" cy="18" r="8" fill="#ef4444"> <!-- Red for risky -->
          <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
        </circle>
        <text x="40" y="22" fill="#991b1b" font-size="12" font-family="monospace">write_file()</text>
      </g>
    </g>

    <!-- Trust Boundary Line -->
    <line x1="20" y1="380" x2="200" y2="380" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="110" y="370" fill="#ef4444" font-size="10" font-weight="700" text-anchor="middle">TRUST BOUNDARY</text>

    <!-- Executor Status -->
    <g transform="translate(20, 400)">
      <rect x="0" y="0" width="180" height="60" rx="4" fill="#1e293b"/>
      <text x="10" y="20" fill="#94a3b8" font-size="10" font-family="monospace">> Executing...</text>
      <text x="10" y="40" fill="#22c55e" font-size="10" font-family="monospace">read_file("src/app.ts")</text>
      <!-- Anim: Processing Indicator -->
      <rect x="150" y="10" width="20" height="20" fill="#22c55e" opacity="0">
         <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" />
      </rect>
      <!-- Anim: Status Line Scanner -->
      <line x1="10" y1="45" x2="170" y2="45" stroke="#22c55e" stroke-width="1" opacity="0.3">
         <animate attributeName="x2" values="10;170;10" dur="2s" repeatCount="indefinite" />
      </line>
    </g>
  </g>

  <!-- ==================== PART 4: LOCAL FS (Far Right) ==================== -->
  <g transform="translate(920, 180)">
    <!-- Connection from Runtime -->
    <path d="M -60 250 L 0 250" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow-head)"/>
    <!-- Anim: Execution Packet -->
    <circle r="4" fill="#0f172a">
       <animateMotion path="M -60 250 L 0 250" dur="1s" repeatCount="indefinite" />
    </circle>

    <!-- FS Container -->
    <g>
      <rect x="0" y="0" width="200" height="260" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="2,2"/>
      <text x="100" y="-15" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle">LOCAL FILESYSTEM</text>

      <!-- Folder Structure -->
      <g transform="translate(20, 30)">
        <path d="M0 0 L15 0 L20 5 L60 5 L65 0 L160 0" stroke="#94a3b8" stroke-width="2" fill="none"/>
        
        <!-- File Items -->
        <g transform="translate(0, 20)">
           <rect x="0" y="0" width="14" height="18" fill="#cbd5e1"/>
           <text x="25" y="14" fill="#475569" font-size="12">src/</text>
        </g>
        <g transform="translate(20, 50)">
           <rect x="0" y="0" width="14" height="18" fill="#3b82f6" opacity="0.8"/>
           <text x="25" y="14" fill="#0f172a" font-size="12" font-weight="600">app.ts</text>
           <!-- Selection Box -->
           <rect x="-5" y="-5" width="140" height="28" fill="none" stroke="#2563eb" stroke-width="1" rx="2" stroke-dasharray="2,2"/>
           <!-- Anim: Read Scan -->
           <line x1="-5" y1="-5" x2="135" y2="-5" stroke="#60a5fa" stroke-width="2" opacity="0">
               <animate attributeName="y1" values="-5;23;-5" dur="2s" repeatCount="indefinite" />
               <animate attributeName="y2" values="-5;23;-5" dur="2s" repeatCount="indefinite" />
               <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
           </line>
        </g>
        <g transform="translate(0, 90)">
           <rect x="0" y="0" width="14" height="18" fill="#cbd5e1"/>
           <text x="25" y="14" fill="#475569" font-size="12">package.json</text>
        </g>
        <g transform="translate(0, 120)">
           <rect x="0" y="0" width="14" height="18" fill="#cbd5e1"/>
           <text x="25" y="14" fill="#475569" font-size="12">README.md</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== FEEDBACK LOOP ==================== -->
  <!-- Line back to Context -->
  <path d="M 1020 440 L 1020 620 L 210 620 L 210 600" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#arrow-head)"/>
  
  <g transform="translate(500, 600)">
    <rect x="-60" y="-12" width="120" height="24" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
    <text x="0" y="4" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">OBSERVATION LOOP</text>
  </g>

  <!-- Animated Packet -->
  <circle r="4" fill="#2563eb">
    <animateMotion path="M 1020 440 L 1020 620 L 210 620 L 210 600" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Anim: Second packet -->
  <circle r="4" fill="#2563eb" opacity="0.6">
    <animateMotion path="M 1020 440 L 1020 620 L 210 620 L 210 600" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

</svg>
