<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'JetBrains Mono', Consolas, monospace" style="background-color: #0f172a;">
  <!-- Definitions -->
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    
    <!-- Glow Filters -->
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c084fc" />
    </marker>
    
    <!-- Gradients -->
    <linearGradient id="grad-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <g transform="translate(40, 40)">
    <path d="M 0 0 L 20 0 L 25 5 L 300 5 L 305 0 L 325 0" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7"/>
    <rect x="0" y="10" width="3" height="40" fill="#38bdf8" opacity="0.7"/>
    <text x="15" y="35" fill="#38bdf8" font-size="24" font-weight="bold" letter-spacing="2">BUILT-IN TOOLS</text>
    <text x="15" y="55" fill="#94a3b8" font-size="12">ACTION-PERCEPTION LOOP v2.0</text>
  </g>

  <!-- ==================== LEFT: LLM BRAIN (Intent) ==================== -->
  <g transform="translate(100, 250)">
    <!-- Brain Container -->
    <circle cx="80" cy="80" r="70" fill="#1e293b" stroke="#c084fc" stroke-width="2" opacity="0.8">
       <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
    <!-- Brain Pulse -->
    <circle cx="80" cy="80" r="60" fill="#c084fc" opacity="0.1">
      <animate attributeName="r" values="60;65;60" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <text x="80" y="85" fill="#e879f9" font-size="18" font-weight="bold" text-anchor="middle" filter="url(#glow-purple)">LLM BRAIN</text>
    <text x="80" y="105" fill="#a855f7" font-size="12" text-anchor="middle">Inference Engine</text>
    
    <!-- Code Snippet (JSON Intent) emitting -->
    <g transform="translate(160, 60)" opacity="0">
       <rect x="0" y="0" width="100" height="40" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
       <text x="10" y="18" fill="#e879f9" font-size="10">{ tool_calls }</text>
       <text x="10" y="30" fill="#94a3b8" font-size="8">"read_file"</text>
       
       <animateTransform attributeName="transform" type="translate" from="160 60" to="350 60" dur="3s" repeatCount="indefinite" />
       <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- ==================== CENTER: AGENT EXECUTOR (The Body) ==================== -->
  <g transform="translate(450, 150)">
    <!-- Main Frame -->
    <path d="M 0 20 L 20 0 L 280 0 L 300 20 L 300 330 L 280 350 L 20 350 L 0 330 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="260" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    <text x="150" y="45" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle" filter="url(#glow-blue)">AGENT RUNTIME</text>

    <!-- Tool Registry (Static Context) -->
    <g transform="translate(30, 80)">
        <rect x="0" y="0" width="240" height="100" fill="#0f172a" stroke="#94a3b8" stroke-dasharray="4,4" opacity="0.5"/>
        <text x="10" y="20" fill="#94a3b8" font-size="10">STATIC CONTEXT (Tool Defs)</text>
        
        <!-- Tool Items -->
        <g transform="translate(10, 35)">
            <rect x="0" y="0" width="70" height="20" rx="2" fill="#334155"/>
            <text x="35" y="14" fill="#4ade80" font-size="10" text-anchor="middle">read_file</text>
        </g>
        <g transform="translate(85, 35)">
            <rect x="0" y="0" width="70" height="20" rx="2" fill="#334155"/>
            <text x="35" y="14" fill="#4ade80" font-size="10" text-anchor="middle">ls</text>
        </g>
        <g transform="translate(160, 35)">
            <rect x="0" y="0" width="70" height="20" rx="2" fill="#334155"/>
            <text x="35" y="14" fill="#4ade80" font-size="10" text-anchor="middle">grep</text>
        </g>
        <!-- Dangerous Tool -->
        <g transform="translate(10, 65)">
            <rect x="0" y="0" width="70" height="20" rx="2" fill="#451a1a" stroke="#f87171" stroke-width="1"/>
            <text x="35" y="14" fill="#f87171" font-size="10" text-anchor="middle">write_file</text>
            <!-- Warning Blink -->
            <circle cx="65" cy="5" r="2" fill="#f87171">
                <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite" />
            </circle>
        </g>
        <g transform="translate(85, 65)">
            <rect x="0" y="0" width="70" height="20" rx="2" fill="#451a1a" stroke="#f87171" stroke-width="1"/>
            <text x="35" y="14" fill="#f87171" font-size="10" text-anchor="middle">bash</text>
        </g>
    </g>

    <!-- Execution Core -->
    <g transform="translate(30, 200)">
        <rect x="0" y="0" width="240" height="120" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="120" y="25" fill="#38bdf8" font-size="12" text-anchor="middle">NATIVE EXECUTOR</text>
        
        <!-- Processing Bar -->
        <rect x="40" y="50" width="160" height="10" fill="#1e293b" rx="5"/>
        <rect x="40" y="50" width="40" height="10" fill="#38bdf8" rx="5">
            <animate attributeName="width" values="0;160;0" dur="2s" repeatCount="indefinite" />
            <animate attributeName="x" values="40;40;200" dur="2s" repeatCount="indefinite" />
        </rect>
        
        <text x="120" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">Executing: read_file('src/app.ts')</text>
    </g>
  </g>

  <!-- ==================== RIGHT: LOCAL ENV (World) ==================== -->
  <g transform="translate(900, 200)">
    <!-- Monitor Shape -->
    <rect x="0" y="0" width="240" height="180" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <rect x="10" y="10" width="220" height="140" fill="#0f172a"/>
    
    <!-- Base -->
    <path d="M 60 180 L 40 210 L 200 210 L 180 180 Z" fill="#1e293b"/>
    
    <text x="120" y="-15" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" filter="url(#glow-green)">LOCAL OS / FILESYSTEM</text>
    
    <!-- File Content Animation -->
    <g transform="translate(20, 30)">
        <rect x="0" y="0" width="100" height="6" fill="#334155" rx="2" opacity="0.5"/>
        <rect x="0" y="15" width="160" height="6" fill="#334155" rx="2" opacity="0.5"/>
        <rect x="0" y="30" width="130" height="6" fill="#334155" rx="2" opacity="0.5"/>
        <rect x="0" y="45" width="180" height="6" fill="#334155" rx="2" opacity="0.5"/>
        <rect x="0" y="60" width="90" height="6" fill="#334155" rx="2" opacity="0.5"/>
        
        <!-- Scanning Line -->
        <line x1="0" y1="0" x2="200" y2="0" stroke="#4ade80" stroke-width="2" opacity="0.8">
            <animate attributeName="y1" values="0;100;0" dur="3s" repeatCount="indefinite" />
            <animate attributeName="y2" values="0;100;0" dur="3s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
        </line>
    </g>
  </g>

  <!-- ==================== CONNECTIONS & FLOW ==================== -->
  
  <!-- 1. Intent: LLM -> Agent -->
  <path d="M 250 330 L 450 330" stroke="#c084fc" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" marker-end="url(#arrow-purple)"/>
  
  <!-- 2. Action: Agent -> OS -->
  <path d="M 750 300 L 900 300" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <circle r="4" fill="#38bdf8">
      <animateMotion path="M 750 300 L 900 300" dur="1s" repeatCount="indefinite" />
  </circle>

  <!-- 3. Result Loop: OS -> Agent -> LLM -->
  <!-- OS out -->
  <path d="M 900 350 L 850 350 L 850 550 L 600 550" stroke="#4ade80" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Agent pass through (Context) -->
  <path d="M 600 550 L 250 550 L 180 400" stroke="#4ade80" stroke-width="2" fill="none" opacity="0.6" marker-end="url(#arrow-blue)"/>
  
  <!-- Data Packets Flowing Back -->
  <rect x="0" y="0" width="10" height="10" fill="#4ade80" rx="2">
     <animateMotion path="M 900 350 L 850 350 L 850 550 L 250 550 L 180 400" dur="3s" repeatCount="indefinite" />
  </rect>
  <rect x="0" y="0" width="10" height="10" fill="#4ade80" rx="2">
     <animateMotion path="M 900 350 L 850 350 L 850 550 L 250 550 L 180 400" dur="3s" begin="1.5s" repeatCount="indefinite" />
  </rect>

  <!-- Labels for Flow -->
  <g>
    <rect x="780" y="275" width="80" height="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="820" y="289" fill="#38bdf8" font-size="10" text-anchor="middle">EXECUTE</text>
  </g>
  
  <g>
    <rect x="400" y="530" width="140" height="20" fill="#0f172a" stroke="#4ade80" stroke-width="1"/>
    <text x="470" y="544" fill="#4ade80" font-size="10" text-anchor="middle">OBSERVATION (Result)</text>
  </g>

  <!-- Trust Boundary Indicator -->
  <g transform="translate(680, 100)">
    <line x1="0" y1="0" x2="0" y2="400" stroke="#f87171" stroke-width="1" stroke-dasharray="10,10" opacity="0.3"/>
    <rect x="-60" y="-15" width="120" height="30" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
    <text x="0" y="5" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle">TRUST BOUNDARY</text>
    <text x="0" y="420" fill="#94a3b8" font-size="10" text-anchor="middle">Local Machine</text>
  </g>

</svg>