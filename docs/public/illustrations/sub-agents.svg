<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'JetBrains Mono', Consolas, monospace" style="background-color: #0f172a;">
  <!-- Definitions -->
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrow-main" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-sub" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f472b6" />
    </marker>
    <marker id="arrow-return" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4ade80" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="grad-sub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <g transform="translate(40, 40)">
    <path d="M 0 0 L 20 0 L 20 20 L 0 20 Z" fill="#f472b6"/>
    <text x="30" y="16" fill="#f472b6" font-size="20" font-weight="bold" letter-spacing="2">SUB AGENT</text>
    <text x="30" y="38" fill="#94a3b8" font-size="12">CONTEXT ISOLATION PROTOCOL</text>
  </g>

  <!-- ========================================= -->
  <!-- LEFT: MAIN AGENT (The Noisy Stream)       -->
  <!-- ========================================= -->
  <g transform="translate(100, 150)">
    <!-- Main Context Container -->
    <rect x="0" y="0" width="220" height="400" rx="8" fill="url(#grad-main)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
    
    <!-- Header -->
    <rect x="0" y="-30" width="220" height="30" fill="#38bdf8" opacity="0.2"/>
    <text x="110" y="-10" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">MAIN AGENT</text>
    <text x="110" y="380" fill="#64748b" font-size="12" text-anchor="middle" font-style="italic">High Noise Level</text>

    <!-- Message Blocks (Static History) -->
    <g opacity="0.6">
      <rect x="20" y="30" width="180" height="20" rx="2" fill="#38bdf8" opacity="0.3"/>
      <rect x="20" y="60" width="180" height="40" rx="2" fill="#38bdf8" opacity="0.2"/>
      <rect x="20" y="110" width="180" height="25" rx="2" fill="#38bdf8" opacity="0.4"/>
      <rect x="20" y="145" width="180" height="35" rx="2" fill="#38bdf8" opacity="0.2"/>
      <rect x="20" y="190" width="180" height="20" rx="2" fill="#38bdf8" opacity="0.3"/>
    </g>

    <!-- Active Task Block (The trigger) -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="180" height="50" rx="4" fill="#38bdf8" stroke="#ffffff" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="90" y="20" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">Complex Task</text>
      <text x="90" y="35" fill="#0f172a" font-size="10" text-anchor="middle">Detected</text>
    </g>

    <!-- Future Context (Placeholder) -->
    <rect x="20" y="300" width="180" height="60" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="4,4" opacity="0.5"/>
  </g>


  <!-- ========================================= -->
  <!-- MIDDLE: THE HANDOFF (Memo Extraction)     -->
  <!-- ========================================= -->
  
  <!-- Path Line -->
  <path d="M 320 255 L 480 255 L 480 300 L 580 300" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="6,6">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- The Memo Object (Animated) -->
  <g>
    <!-- Container -->
    <g id="memo-packet">
      <rect x="-60" y="-40" width="120" height="80" rx="5" fill="#0f172a" stroke="#f472b6" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="-20" fill="#f472b6" font-size="12" font-weight="bold" text-anchor="middle">HANDOFF MEMO</text>
      
      <!-- 3 Elements Icons -->
      <g transform="translate(-35, 10)">
        <circle r="3" fill="#f472b6"/>
        <text x="10" y="4" fill="#cbd5e1" font-size="10">Goal</text>
      </g>
      <g transform="translate(-35, 25)">
        <rect x="-3" y="-3" width="6" height="6" fill="#f472b6"/>
        <text x="10" y="4" fill="#cbd5e1" font-size="10">Constraints</text>
      </g>
      <g transform="translate(-35, 40)">
        <path d="M -3 3 L 0 -3 L 3 3 Z" fill="#f472b6"/>
        <text x="10" y="4" fill="#cbd5e1" font-size="10">Context</text>
      </g>
    </g>

    <!-- Animation Path for Memo -->
    <animateMotion dur="4s" repeatCount="indefinite" path="M 320 255 L 480 255 L 480 300 L 650 300" keyPoints="0;0.4;0.5;1" keyTimes="0;0.3;0.3;1" calcMode="linear"/>
    <!-- Fade in/out to simulate transfer -->
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </g>


  <!-- ========================================= -->
  <!-- RIGHT: SUB AGENT (The Clean Room)         -->
  <!-- ========================================= -->
  <g transform="translate(650, 100)">
    
    <!-- Sub Context Container -->
    <rect x="0" y="0" width="280" height="400" rx="8" fill="url(#grad-sub)" stroke="#f472b6" stroke-width="2" stroke-opacity="0.5"/>
    
    <!-- Header -->
    <rect x="0" y="-30" width="280" height="30" fill="#f472b6" opacity="0.2"/>
    <text x="140" y="-10" fill="#f472b6" font-size="14" font-weight="bold" text-anchor="middle">SUB AGENT</text>
    <text x="140" y="380" fill="#f472b6" font-size="12" text-anchor="middle" font-style="italic">Clean Context (Zero History)</text>

    <!-- 1. System Instructions (Inherited) -->
    <g transform="translate(40, 30)">
      <rect x="0" y="0" width="200" height="40" rx="2" fill="#1e293b" stroke="#f472b6" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="100" y="18" fill="#f472b6" font-size="10" text-anchor="middle">INHERITED SYSTEM INSTRUCTIONS</text>
      <text x="100" y="32" fill="#64748b" font-size="8" text-anchor="middle">(Project Rules &amp; Safety)</text>
      
      <!-- Arrow from top -->
      <path d="M 100 -25 L 100 -5" stroke="#f472b6" stroke-width="1" marker-end="url(#arrow-sub)"/>
    </g>

    <!-- 2. The Task (From Memo) -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="200" height="50" rx="2" fill="#f472b6" opacity="0.2">
        <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="20" fill="#ffe4e6" font-size="12" font-weight="bold" text-anchor="middle">Task Scope</text>
      <text x="100" y="35" fill="#f472b6" font-size="10" text-anchor="middle">Goal + Constraints</text>
    </g>

    <!-- 3. Execution Loop (Animated) -->
    <g transform="translate(60, 150)">
       <!-- Tool Call -->
       <g>
         <rect x="0" y="0" width="160" height="25" rx="2" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
         <text x="10" y="17" fill="#94a3b8" font-size="10">&gt; tool_call: read_file</text>
         <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="3s" repeatCount="indefinite" begin="0s"/>
       </g>
       <!-- Tool Result -->
       <g transform="translate(0, 35)">
         <rect x="0" y="0" width="160" height="25" rx="2" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
         <text x="10" y="17" fill="#94a3b8" font-size="10">&lt; tool_result: schema.json</text>
         <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.5;1" dur="3s" repeatCount="indefinite" begin="0s"/>
       </g>
       <!-- Thinking -->
       <g transform="translate(0, 70)">
         <rect x="0" y="0" width="160" height="25" rx="2" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
         <text x="10" y="17" fill="#f472b6" font-size="10">Thinking...</text>
         <rect x="130" y="10" width="5" height="5" fill="#f472b6">
            <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite"/>
         </rect>
         <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.5;0.7;1" dur="3s" repeatCount="indefinite" begin="0s"/>
       </g>
    </g>

    <!-- 4. Result Summary -->
    <g transform="translate(40, 280)">
      <rect x="0" y="0" width="200" height="40" rx="4" fill="#4ade80" stroke="#ffffff" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-width" values="1;3;1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="100" y="25" fill="#064e3b" font-size="14" font-weight="bold" text-anchor="middle">SUMMARY RESULT</text>
    </g>

  </g>

  <!-- ========================================= -->
  <!-- RETURN FLOW (The Merge)                   -->
  <!-- ========================================= -->
  
  <path d="M 690 400 L 690 450 L 300 450 L 300 420" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="6,6"/>

  <circle cx="0" cy="0" r="4" fill="#4ade80">
    <animateMotion path="M 690 400 L 690 450 L 300 450 L 300 420" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <g>
     <rect x="-40" y="-15" width="80" height="30" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
     <text x="0" y="5" fill="#4ade80" font-size="10" text-anchor="middle" font-weight="bold">RESULT</text>
     <animateMotion path="M 690 400 L 690 450 L 300 450 L 300 420" dur="2s" repeatCount="indefinite" rotate="0"/>
  </g>

  <!-- Final Merge into Main -->
  <g transform="translate(120, 420)">
      <text x="90" y="30" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" opacity="0">
        + MERGED
        <animate attributeName="opacity" values="0;1;0" dur="2s" delay="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;10" dur="2s" delay="1.8s" repeatCount="indefinite"/>
      </text>
  </g>

  <!-- Labels / Explanations -->
  <g font-size="12" fill="#94a3b8">
      <text x="400" y="230">1. Handoff (Goal/Constraints/Context)</text>
      <text x="400" y="500">3. Return Summary (No History)</text>
      <text x="800" y="80">2. Independent Execution</text>
  </g>

</svg>