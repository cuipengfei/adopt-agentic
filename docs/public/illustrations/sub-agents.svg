<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif" style="background-color: #FFF8F0;">
  <!-- Definitions -->
  <defs>
    <!-- Paper Texture Pattern -->
    <filter id="paper-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting lighting-color="#fff8f0" surfaceScale="2" result="light">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite operator="in" in="light" in2="SourceGraphic" result="composite"/>
      <feBlend mode="multiply" in="composite" in2="SourceGraphic"/>
    </filter>

    <!-- Hand-drawn Stroke Filter (Wobble) -->
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
    </filter>

    <!-- Cutout Shadow -->
    <filter id="cutout-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrow-drawn" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 L4,6 Z" fill="#4A4A4A" stroke="none"/>
    </marker>
  </defs>

  <!-- Background Texture -->
  <rect width="100%" height="100%" fill="#FFF8F0" filter="url(#paper-texture)" opacity="0.6"/>

  <!-- Title -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" font-size="36" fill="#4A4A4A" font-weight="bold" letter-spacing="1">SUB AGENT</text>
    <text x="0" y="30" font-size="20" fill="#888888" font-style="italic">Context Isolation Protocol</text>
    <path d="M 0 45 Q 150 55 350 45" stroke="#4A4A4A" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ========================================= -->
  <!-- MAIN AGENT (The Trunk)                    -->
  <!-- ========================================= -->
  <g transform="translate(100, 150)">
    <!-- Trunk Shape -->
    <path d="M 60 500 L 60 50 C 60 20 90 0 130 0 L 210 0 C 250 0 280 20 280 50 L 280 500" fill="#E6D5B8" stroke="#8B5E3C" stroke-width="4" stroke-linejoin="round" filter="url(#cutout-shadow)"/>
    
    <!-- Trunk Label -->
    <g transform="translate(170, 40)">
      <text text-anchor="middle" font-size="22" font-weight="bold" fill="#8B5E3C">MAIN AGENT</text>
      <text text-anchor="middle" y="25" font-size="14" fill="#A08060">(High Noise Level)</text>
    </g>

    <!-- Context Layers (Paper Strips) -->
    <g transform="translate(85, 90)" opacity="0.9">
      <path d="M 0 0 L 170 0 L 165 30 L 5 30 Z" fill="#FFF" stroke="#D4A373" stroke-width="2" transform="rotate(-1)"/>
      <text x="85" y="20" text-anchor="middle" font-size="12" fill="#D4A373">Chat History...</text>
      
      <path d="M 5 40 L 165 40 L 170 70 L 0 70 Z" fill="#FFF" stroke="#D4A373" stroke-width="2" transform="translate(0, 10) rotate(1)"/>
      <text x="85" y="65" text-anchor="middle" font-size="12" fill="#D4A373">System Prompts...</text>

      <path d="M 0 80 L 170 80 L 165 110 L 5 110 Z" fill="#FFF" stroke="#D4A373" stroke-width="2" transform="translate(0, 20) rotate(-0.5)"/>
      
      <!-- Highlighted Task (The Trigger) -->
      <g transform="translate(-15, 160) rotate(-2)">
         <rect width="200" height="70" rx="5" fill="#FFD166" stroke="#4A4A4A" stroke-width="3" filter="url(#cutout-shadow)">
           <animateTransform attributeName="transform" type="rotate" values="-1 100 35; 1 100 35; -1 100 35" dur="3s" repeatCount="indefinite"/>
         </rect>
         <text x="100" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4A4A">Complex Task</text>
         <text x="100" y="50" text-anchor="middle" font-size="14" fill="#4A4A4A">Needs Isolation</text>
      </g>
    </g>
  </g>

  <!-- ========================================= -->
  <!-- HANDOFF BRANCH (The Connection)           -->
  <!-- ========================================= -->
  <g transform="translate(380, 320)">
    <!-- Branch Path Line -->
    <path d="M 0 0 Q 150 0 200 -50 T 350 -100" fill="none" stroke="#4A4A4A" stroke-width="4" stroke-dasharray="10,10" marker-end="url(#arrow-drawn)">
       <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/>
    </path>
    
    <!-- The Leaf Packet (Carrying the memo) -->
    <g>
      <circle r="45" fill="#EF476F" stroke="#4A4A4A" stroke-width="2" filter="url(#cutout-shadow)"/>
      <text x="0" y="-15" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFF">HANDOFF</text>
      <text x="0" y="5" text-anchor="middle" font-size="11" fill="#FFF">1. Goal</text>
      <text x="0" y="18" text-anchor="middle" font-size="11" fill="#FFF">2. Constraints</text>
      <text x="0" y="31" text-anchor="middle" font-size="11" fill="#FFF">3. Context</text>
      
      <animateMotion path="M 0 0 Q 150 0 200 -50 T 350 -100" dur="4s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.1;0.8;0.9;1" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ========================================= -->
  <!-- SUB AGENT (The Branch/Canopy)             -->
  <!-- ========================================= -->
  <g transform="translate(730, 80)">
    <!-- Canopy Shape (Cloud/Tree top) -->
    <path d="M 0 100 Q -20 50 30 20 Q 80 -20 150 20 Q 220 -20 270 20 Q 320 50 300 100 Q 320 150 270 250 Q 220 300 150 280 Q 80 300 30 250 Q -20 150 0 100 Z" 
          fill="#06D6A0" stroke="#4A4A4A" stroke-width="4" filter="url(#cutout-shadow)" opacity="0.15"/>
    
    <!-- Solid Frame for Content -->
    <path d="M 30 100 Q 10 50 60 30 L 260 30 Q 310 50 290 100 L 290 350 Q 310 400 260 420 L 60 420 Q 10 400 30 350 Z" 
          fill="none" stroke="#06D6A0" stroke-width="3" stroke-dasharray="12,6" opacity="0.8"/>

    <!-- Label -->
    <g transform="translate(160, 0)">
       <rect x="-90" y="-25" width="180" height="50" rx="25" fill="#06D6A0" stroke="#4A4A4A" stroke-width="3" filter="url(#cutout-shadow)"/>
       <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFF">SUB AGENT</text>
    </g>

    <!-- Content: Clean Context -->
    <g transform="translate(60, 70)">
       <text x="100" y="0" text-anchor="middle" font-size="16" fill="#06D6A0" font-weight="bold">Zero History Zone</text>
       
       <!-- 1. Inherited Rules -->
       <g transform="translate(0, 30)">
          <path d="M 0 0 L 200 0 L 200 35 L 0 35 Z" fill="#FFF" stroke="#4A4A4A" stroke-width="2" rx="5"/>
          <text x="100" y="22" text-anchor="middle" font-size="13" fill="#4A4A4A">Inherited System Instructions</text>
       </g>

       <!-- 2. Execution Loop (Gears/Process) -->
       <g transform="translate(20, 90)">
          <!-- Thinking bubble -->
          <path d="M 0 0 L 160 0 L 160 60 L 100 60 L 80 80 L 60 60 L 0 60 Z" fill="#FFF" stroke="#4A4A4A" stroke-width="2" filter="url(#cutout-shadow)">
             <!-- ADDED: Subtle breathing effect for thinking bubble -->
             <animateTransform attributeName="transform" type="scale" values="1;1.02;1" dur="2s" repeatCount="indefinite" additive="sum"/>
          </path>
          <text x="80" y="25" text-anchor="middle" font-size="14" fill="#4A4A4A" font-weight="bold">Thinking...</text>
          
          <!-- Animated dots -->
          <circle cx="50" cy="45" r="4" fill="#118AB2">
            <animate attributeName="cy" values="45;38;45" dur="1s" repeatCount="indefinite" begin="0s"/>
            <animate attributeName="fill" values="#118AB2;#EF476F;#118AB2" dur="3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="80" cy="45" r="4" fill="#118AB2">
            <animate attributeName="cy" values="45;38;45" dur="1s" repeatCount="indefinite" begin="0.2s"/>
            <animate attributeName="fill" values="#118AB2;#EF476F;#118AB2" dur="3s" repeatCount="indefinite" begin="0.2s"/>
          </circle>
          <circle cx="110" cy="45" r="4" fill="#118AB2">
            <animate attributeName="cy" values="45;38;45" dur="1s" repeatCount="indefinite" begin="0.4s"/>
            <animate attributeName="fill" values="#118AB2;#EF476F;#118AB2" dur="3s" repeatCount="indefinite" begin="0.4s"/>
          </circle>
          
          <!-- ADDED: Tool Execution Simulation (Text appearing) -->
          <text x="80" y="75" text-anchor="middle" font-size="10" fill="#4A4A4A" opacity="0">
            &gt; tool_call: search
            <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.4;0.5" dur="4s" repeatCount="indefinite" begin="0s"/>
            <animate attributeName="y" values="75;70;75" keyTimes="0;0.2;0.5" dur="4s" repeatCount="indefinite" begin="0s"/>
          </text>
          <text x="80" y="75" text-anchor="middle" font-size="10" fill="#118AB2" opacity="0">
            &lt; tool_result: found
            <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.4;0.5" dur="4s" repeatCount="indefinite" begin="2s"/>
            <animate attributeName="y" values="75;70;75" keyTimes="0;0.2;0.5" dur="4s" repeatCount="indefinite" begin="2s"/>
          </text>
       </g>

       <!-- 3. Summary Result -->
       <g transform="translate(10, 210)">
          <rect width="180" height="70" rx="5" fill="#118AB2" stroke="#4A4A4A" stroke-width="3" filter="url(#cutout-shadow)">
             <!-- ADDED: Pulse effect on result completion -->
             <animate attributeName="stroke-width" values="3;5;3" dur="2s" repeatCount="indefinite"/>
             <animate attributeName="stroke" values="#4A4A4A;#06D6A0;#4A4A4A" dur="2s" repeatCount="indefinite"/>
          </rect>
          <text x="90" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFF">SUMMARY</text>
          <text x="90" y="50" text-anchor="middle" font-size="12" fill="#E0F7FA">Compressed Insight</text>
       </g>
    </g>
  </g>

  <!-- ========================================= -->
  <!-- RETURN FLOW (Falling Fruit)               -->
  <!-- ========================================= -->
  <g>
    <!-- Path Line -->
    <path d="M 800 550 Q 650 650 380 550" fill="none" stroke="#118AB2" stroke-width="4" stroke-dasharray="8,8" marker-end="url(#arrow-drawn)"/>
    
    <!-- The Fruit (Result) -->
    <g>
       <circle r="18" fill="#118AB2" stroke="#4A4A4A" stroke-width="2"/>
       <text x="0" y="6" text-anchor="middle" font-size="20" fill="#FFF" font-weight="bold">+</text>
       
       <animateMotion path="M 800 550 Q 650 650 360 550" dur="3s" repeatCount="indefinite" rotate="auto" calcMode="linear"/>
       <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.1;0.8;0.9;1" dur="3s" repeatCount="indefinite"/>
    </g>

    <text x="600" y="630" text-anchor="middle" font-size="16" fill="#118AB2" font-weight="bold">Merge Back</text>
    
    <!-- ADDED: Explicit MERGED success indicator at the end -->
    <g transform="translate(130, 480)">
       <text x="0" y="0" font-size="14" font-weight="bold" fill="#06D6A0" opacity="0" transform="rotate(-5)">
          + MERGED
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="3s" repeatCount="indefinite" begin="2.5s"/>
          <animate attributeName="font-size" values="14;18;14" dur="3s" repeatCount="indefinite" begin="2.5s"/>
       </text>
    </g>
  </g>

  <!-- Legend / Decorations -->
  <g transform="translate(1000, 550) rotate(-5)">
     <rect width="160" height="90" rx="5" fill="#FFF" stroke="#4A4A4A" stroke-width="2" filter="url(#cutout-shadow)"/>
     <text x="80" y="25" text-anchor="middle" font-size="16" fill="#4A4A4A" font-weight="bold" text-decoration="underline">LEGEND</text>
     
     <g transform="translate(20, 45)">
       <circle r="6" fill="#EF476F" stroke="#4A4A4A" stroke-width="1"/>
       <text x="15" y="5" font-size="12" fill="#4A4A4A">Task Handoff</text>
     </g>
     
     <g transform="translate(20, 70)">
       <circle r="6" fill="#118AB2" stroke="#4A4A4A" stroke-width="1"/>
       <text x="15" y="5" font-size="12" fill="#4A4A4A">Summary Result</text>
     </g>
  </g>

</svg>
