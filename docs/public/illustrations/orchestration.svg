<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'JetBrains Mono', Consolas, monospace" style="background-color: #0f172a;">
  <!-- Definitions -->
  <defs>
    <!-- Dark Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee" />
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f472b6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4ade80" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fb923c" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Main Title Block -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="340" height="60" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="10" height="60" fill="#38bdf8" opacity="0.5"/>
    <text x="25" y="38" fill="#38bdf8" font-size="24" font-weight="bold">ORCHESTRATION PATTERNS</text>
    <text x="25" y="80" fill="#94a3b8" font-size="14">CONTEXT FLOW &amp; CONTROL LOGIC</text>
  </g>

  <!-- Status Indicators -->
  <g transform="translate(950, 40)">
     <text x="0" y="10" fill="#94a3b8" font-size="12" text-anchor="end">SYSTEM: ONLINE</text>
     <text x="0" y="30" fill="#94a3b8" font-size="12" text-anchor="end">SYNC: ACTIVE</text>
     <circle cx="15" cy="5" r="4" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
     </circle>
  </g>

  <!-- ========================================== -->
  <!-- MODULE 1: SEQUENTIAL (Linear Flow) -->
  <!-- Top Left -->
  <!-- ========================================== -->
  <g transform="translate(100, 150)">
    <!-- Frame -->
    <rect x="0" y="0" width="450" height="200" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="20" y="30" fill="#22d3ee" font-size="16" font-weight="bold" filter="url(#glow)">01 SEQUENTIAL</text>
    <line x1="20" y1="45" x2="430" y2="45" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>

    <!-- Nodes -->
    <g transform="translate(50, 100)">
      <!-- Step 1 -->
      <rect x="0" y="-25" width="80" height="50" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
      <text x="40" y="5" fill="#22d3ee" font-size="12" text-anchor="middle">STEP 1</text>
      
      <!-- Step 2 -->
      <rect x="130" y="-25" width="80" height="50" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
      <text x="170" y="5" fill="#22d3ee" font-size="12" text-anchor="middle">STEP 2</text>
      
      <!-- Step 3 -->
      <rect x="260" y="-25" width="80" height="50" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
      <text x="300" y="5" fill="#22d3ee" font-size="12" text-anchor="middle">STEP 3</text>

      <!-- Connections -->
      <line x1="80" y1="0" x2="130" y2="0" stroke="#22d3ee" stroke-width="2"/>
      <line x1="210" y1="0" x2="260" y2="0" stroke="#22d3ee" stroke-width="2"/>

      <!-- Animation: Pulse moving through -->
      <circle r="4" fill="#ffffff" filter="url(#glow)">
        <animateMotion path="M 40 0 L 300 0" dur="3s" repeatCount="indefinite" keyPoints="0;0.33;0.33;0.66;0.66;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="linear"/>
      </circle>
      
      <!-- Highlight Nodes Animation -->
      <rect x="0" y="-25" width="80" height="50" rx="4" fill="#22d3ee" opacity="0">
         <animate attributeName="opacity" values="0;0.3;0;0;0;0" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="130" y="-25" width="80" height="50" rx="4" fill="#22d3ee" opacity="0">
         <animate attributeName="opacity" values="0;0;0.3;0;0;0" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="260" y="-25" width="80" height="50" rx="4" fill="#22d3ee" opacity="0">
         <animate attributeName="opacity" values="0;0;0;0;0.3;0" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="430" y="180" fill="#94a3b8" font-size="10" text-anchor="end">Linear Accumulation</text>
  </g>

  <!-- ========================================== -->
  <!-- MODULE 2: PARALLEL (Split & Merge) -->
  <!-- Top Right -->
  <!-- ========================================== -->
  <g transform="translate(650, 150)">
    <!-- Frame -->
    <rect x="0" y="0" width="450" height="200" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="20" y="30" fill="#f472b6" font-size="16" font-weight="bold" filter="url(#glow)">02 PARALLEL</text>
    <line x1="20" y1="45" x2="430" y2="45" stroke="#f472b6" stroke-width="1" opacity="0.3"/>

    <g transform="translate(50, 100)">
      <!-- Start Node -->
      <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
      
      <!-- Paths -->
      <path d="M 10 0 L 50 0 L 80 -40 L 250 -40 L 280 0 L 320 0" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.5"/>
      <path d="M 10 0 L 320 0" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.5"/>
      <path d="M 10 0 L 50 0 L 80 40 L 250 40 L 280 0 L 320 0" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.5"/>
      
      <!-- Sub Agent Blocks -->
      <rect x="120" y="-55" width="80" height="30" rx="2" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
      <text x="160" y="-35" fill="#f472b6" font-size="10" text-anchor="middle">SUB A</text>
      
      <rect x="120" y="-15" width="80" height="30" rx="2" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
      <text x="160" y="5" fill="#f472b6" font-size="10" text-anchor="middle">SUB B</text>
      
      <rect x="120" y="25" width="80" height="30" rx="2" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
      <text x="160" y="45" fill="#f472b6" font-size="10" text-anchor="middle">SUB C</text>

      <!-- End Node -->
      <circle cx="330" cy="0" r="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>

      <!-- Animations: Particles splitting and merging -->
      <circle r="3" fill="#f472b6" filter="url(#glow)">
        <animateMotion path="M 10 0 L 50 0 L 80 -40 L 250 -40 L 280 0 L 320 0" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle r="3" fill="#f472b6" filter="url(#glow)">
        <animateMotion path="M 10 0 L 320 0" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle r="3" fill="#f472b6" filter="url(#glow)">
        <animateMotion path="M 10 0 L 50 0 L 80 40 L 250 40 L 280 0 L 320 0" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>
    <text x="430" y="180" fill="#94a3b8" font-size="10" text-anchor="end">Split Context / Merge Result</text>
  </g>

  <!-- ========================================== -->
  <!-- MODULE 3: PLAN-EXECUTE (Draft to Final) -->
  <!-- Bottom Left -->
  <!-- ========================================== -->
  <g transform="translate(100, 400)">
    <!-- Frame -->
    <rect x="0" y="0" width="450" height="200" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="20" y="30" fill="#4ade80" font-size="16" font-weight="bold" filter="url(#glow)">03 PLAN &amp; EXECUTE</text>
    <line x1="20" y1="45" x2="430" y2="45" stroke="#4ade80" stroke-width="1" opacity="0.3"/>

    <g transform="translate(60, 80)">
      <!-- Phase 1: Planning (Dotted) -->
      <path d="M 0 0 L 80 0" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4"/>
      <rect x="80" y="-30" width="100" height="60" rx="2" fill="#1e293b" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4"/>
      <text x="130" y="5" fill="#4ade80" font-size="12" text-anchor="middle" opacity="0.8">PLAN</text>
      
      <!-- Human Checkpoint -->
      <path d="M 180 0 L 220 0" stroke="#4ade80" stroke-width="2"/>
      <circle cx="220" cy="0" r="12" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
      <text x="220" y="4" fill="#4ade80" font-size="10" text-anchor="middle">✓</text>
      
      <!-- Phase 2: Execute (Solid) -->
      <path d="M 232 0 L 270 0" stroke="#4ade80" stroke-width="2"/>
      <rect x="270" y="-30" width="100" height="60" rx="2" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
      <text x="320" y="5" fill="#4ade80" font-size="12" text-anchor="middle" font-weight="bold">EXECUTE</text>

      <!-- Scanning Animation on Plan -->
      <line x1="85" y1="-25" x2="175" y2="-25" stroke="#4ade80" stroke-width="2" opacity="0.5">
         <animate attributeName="y1" values="-25;25;-25" dur="3s" repeatCount="indefinite"/>
         <animate attributeName="y2" values="-25;25;-25" dur="3s" repeatCount="indefinite"/>
      </line>
      
      <!-- Pulse moving to Execute -->
      <circle r="4" fill="#ffffff" filter="url(#glow)">
         <animateMotion path="M 190 0 L 370 0" dur="3s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="430" y="180" fill="#94a3b8" font-size="10" text-anchor="end">Human-in-the-loop Approval</text>
  </g>

  <!-- ========================================== -->
  <!-- MODULE 4: ITERATIVE (Loop) -->
  <!-- Bottom Right -->
  <!-- ========================================== -->
  <g transform="translate(650, 400)">
    <!-- Frame -->
    <rect x="0" y="0" width="450" height="200" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="20" y="30" fill="#fb923c" font-size="16" font-weight="bold" filter="url(#glow)">04 ITERATIVE LOOP</text>
    <line x1="20" y1="45" x2="430" y2="45" stroke="#fb923c" stroke-width="1" opacity="0.3"/>

    <g transform="translate(225, 100)">
      <!-- Central Core -->
      <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
      <text x="0" y="5" fill="#fb923c" font-size="12" text-anchor="middle" font-weight="bold">EVAL</text>

      <!-- Orbit Path -->
      <circle cx="0" cy="0" r="60" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
      
      <!-- Orbital Nodes -->
      <g>
        <rect x="-15" y="-75" width="30" height="20" rx="2" fill="#1e293b" stroke="#fb923c" stroke-width="1"/>
        <text x="0" y="-60" fill="#fb923c" font-size="8" text-anchor="middle">ACT</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      </g>

      <!-- Feedback Loop Arrows -->
      <path d="M 0 -60 A 60 60 0 1 1 -1 -60" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)" stroke-opacity="0.8">
         <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      </path>

      <!-- Spiral Upward Indication (Right side) -->
      <path d="M 100 40 L 100 -40" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
      <text x="110" y="0" fill="#fb923c" font-size="10" transform="rotate(-90 110 0)">Context Refinement</text>
      
      <!-- Spiral Pulse -->
      <circle cx="100" cy="40" r="3" fill="#ffffff">
        <animate attributeName="cy" values="40;-40" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
      </circle>

    </g>
    <text x="430" y="180" fill="#94a3b8" font-size="10" text-anchor="end">Reflect &amp; Refine</text>
  </g>

</svg>
