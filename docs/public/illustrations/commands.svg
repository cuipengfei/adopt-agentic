<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Courier New', Courier, monospace" style="background-color: #2d2d2d;">
  <!-- 
    THEME: Pixel Art / Retro Game
    LAYOUT: Comic Strip (3 Panels)
    CONCEPT: Slash Commands (Trigger -> Expand -> Inject & Forget)
  -->

  <defs>
    <!-- PIXEL PATTERN for background -->
    <pattern id="pixel-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="19" y="19" width="1" height="1" fill="#444" />
    </pattern>

    <!-- PIXEL AVATAR (User) -->
    <g id="avatar">
      <rect x="10" y="0" width="20" height="10" fill="#facc15" /> <!-- Hair -->
      <rect x="5" y="10" width="30" height="20" fill="#fca5a5" /> <!-- Face -->
      <rect x="10" y="15" width="5" height="5" fill="#000" />    <!-- Eye L -->
      <rect x="25" y="15" width="5" height="5" fill="#000" />    <!-- Eye R -->
      <rect x="0" y="30" width="40" height="30" fill="#3b82f6" /> <!-- Shirt -->
    </g>

    <!-- PIXEL FLOPPY DISK (Context/Files) -->
    <g id="floppy">
      <rect x="0" y="0" width="40" height="40" fill="#6366f1" />
      <rect x="10" y="0" width="20" height="15" fill="#e0e7ff" /> <!-- Metal slider -->
      <rect x="5" y="25" width="30" height="10" fill="#fff" />    <!-- Label -->
    </g>

    <!-- PIXEL SCROLL (Template) -->
    <g id="scroll">
      <rect x="5" y="0" width="30" height="40" fill="#fde047" />
      <rect x="10" y="5" width="20" height="2" fill="#b45309" />
      <rect x="10" y="10" width="20" height="2" fill="#b45309" />
      <rect x="10" y="15" width="15" height="2" fill="#b45309" />
    </g>

    <!-- PIXEL TERMINAL (Shell) -->
    <g id="terminal-icon">
      <rect x="0" y="0" width="40" height="30" fill="#10b981" />
      <rect x="5" y="5" width="30" height="20" fill="#000" />
      <text x="8" y="20" fill="#10b981" font-size="12">&gt;_</text>
    </g>

    <!-- PIXEL BRAIN (LLM) -->
    <g id="brain">
      <rect x="10" y="0" width="60" height="50" fill="#ec4899" rx="2" />
      <path d="M 20 10 h 10 v 5 h -10 z" fill="#be185d" />
      <path d="M 50 10 h 10 v 5 h -10 z" fill="#be185d" />
      <path d="M 20 25 h 40 v 5 h -40 z" fill="#be185d" />
      <!-- Electronic nodes -->
      <rect x="5" y="20" width="5" height="5" fill="#fff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite" />
      </rect>
      <rect x="70" y="20" width="5" height="5" fill="#fff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" begin="0.2s" repeatCount="indefinite" />
      </rect>
      <rect x="35" y="50" width="10" height="10" fill="#fff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" begin="0.4s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- ARROW MARKER -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fff" />
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="url(#pixel-grid)" />

  <!-- TITLE HEADER -->
  <rect x="0" y="0" width="1200" height="80" fill="#000" />
  <text x="600" y="50" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold" letter-spacing="4">SLASH COMMANDS // GAMEPLAY</text>
  
  <!-- ================================================================================== -->
  <!-- PANEL 1: THE TRIGGER (User inputs command) -->
  <!-- ================================================================================== -->
  <g transform="translate(50, 120)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="350" height="500" fill="#1e1e1e" stroke="#fff" stroke-width="4" />
    <rect x="0" y="0" width="350" height="40" fill="#fff" />
    <text x="175" y="28" text-anchor="middle" fill="#000" font-weight="bold" font-size="20">1. TRIGGER</text>

    <!-- Scene -->
    <g transform="translate(130, 200) scale(4)">
      <use href="#avatar" />
    </g>
    
    <!-- Speech Bubble -->
    <path d="M 180 180 L 250 120 L 320 120 L 320 60 L 140 60 L 140 120 L 180 180" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="230" y="100" text-anchor="middle" font-size="18" font-weight="bold">I need a fix!</text>

    <!-- Terminal Prompt -->
    <rect x="40" y="380" width="270" height="60" fill="#000" stroke="#10b981" stroke-width="2" />
    <text x="60" y="420" fill="#10b981" font-size="24" font-weight="bold">&gt; <tspan fill="#fff">/fix_bug</tspan></text>
    
    <!-- Cursor Blink -->
    <rect x="210" y="400" width="15" height="24" fill="#10b981">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
    </rect>

    <!-- Trigger Pulse -->
    <circle cx="218" cy="412" r="6" fill="none" stroke="#10b981" stroke-width="3" opacity="0.8">
      <animate attributeName="r" values="6;18;6" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.6s" repeatCount="indefinite" />
    </circle>

    <!-- Caption -->
    <text x="175" y="480" text-anchor="middle" fill="#aaa" font-size="14">Short alias for complex intent</text>
  </g>

  <!-- ARROW 1-2 -->
  <path d="M 410 370 L 440 370" stroke="#fff" stroke-width="4" marker-end="url(#arrow)" />

  <!-- Packet Flow 1-2 -->
  <rect x="-4" y="-4" width="8" height="8" fill="#facc15">
    <animateMotion path="M 410 370 L 440 370" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite" />
  </rect>

  <!-- ================================================================================== -->
  <!-- PANEL 2: THE EXPANSION (Unpacking the prompt) -->
  <!-- ================================================================================== -->
  <g transform="translate(450, 120)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="300" height="500" fill="#1e1e1e" stroke="#fff" stroke-width="4" />
    <rect x="0" y="0" width="300" height="40" fill="#fff" />
    <text x="150" y="28" text-anchor="middle" fill="#000" font-weight="bold" font-size="20">2. EXPANSION</text>

    <!-- Central Command expanding -->
    <text x="150" y="150" text-anchor="middle" fill="#fff" font-size="28" font-weight="bold">/fix_bug
      <animate attributeName="fill" values="#fff;#facc15;#fff" dur="1.4s" repeatCount="indefinite" />
    </text>
    
    <!-- Explosion Lines -->
    <line x1="150" y1="170" x2="80" y2="250" stroke="#facc15" stroke-width="4" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="150" y1="170" x2="150" y2="250" stroke="#6366f1" stroke-width="4" stroke-dasharray="8,4">
       <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1s" begin="0.2s" repeatCount="indefinite" />
    </line>
    <line x1="150" y1="170" x2="220" y2="250" stroke="#10b981" stroke-width="4" stroke-dasharray="8,4">
       <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1s" begin="0.4s" repeatCount="indefinite" />
    </line>

    <!-- Ingredients -->
    <g transform="translate(50, 260) scale(1.5)">
      <use href="#scroll" />
      <text x="20" y="55" text-anchor="middle" fill="#facc15" font-size="10" font-weight="bold">Template</text>
    </g>
    
    <g transform="translate(120, 260) scale(1.5)">
      <use href="#floppy" />
      <text x="20" y="55" text-anchor="middle" fill="#6366f1" font-size="10" font-weight="bold">Context</text>
    </g>

    <g transform="translate(190, 265) scale(1.5)">
      <use href="#terminal-icon" />
      <text x="20" y="50" text-anchor="middle" fill="#10b981" font-size="10" font-weight="bold">Shell</text>
    </g>

    <!-- Combined Output Packet -->
    <rect x="50" y="380" width="200" height="80" rx="4" fill="#333" stroke="#fff" stroke-width="2" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite" />
    </rect>
    <text x="150" y="410" text-anchor="middle" fill="#fff" font-size="14">FULL PROMPT</text>
    <text x="150" y="435" text-anchor="middle" fill="#aaa" font-size="10">&lt;system&gt;...&lt;/system&gt;</text>
    <text x="150" y="450" text-anchor="middle" fill="#aaa" font-size="10">&lt;file&gt;...&lt;/file&gt;</text>

  </g>

  <!-- ARROW 2-3 -->
  <path d="M 760 370 L 785 370" stroke="#fff" stroke-width="4" marker-end="url(#arrow)" />

  <!-- Packet Flow 2-3 -->
  <rect x="-4" y="-4" width="8" height="8" fill="#ec4899">
    <animateMotion path="M 760 370 L 785 370" dur="1.2s" begin="0.3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.3s" repeatCount="indefinite" />
  </rect>

  <!-- ================================================================================== -->
  <!-- PANEL 3: EXECUTION (Fire & Forget) -->
  <!-- ================================================================================== -->
  <g transform="translate(790, 120)">
    <!-- Panel Box -->
    <rect x="0" y="0" width="350" height="500" fill="#1e1e1e" stroke="#fff" stroke-width="4" />
    <rect x="0" y="0" width="350" height="40" fill="#fff" />
    <text x="175" y="28" text-anchor="middle" fill="#000" font-weight="bold" font-size="20">3. INJECTION</text>

    <!-- The Brain (LLM) -->
    <g transform="translate(115, 80) scale(2)">
      <use href="#brain" />
    </g>
    <text x="175" y="200" text-anchor="middle" fill="#ec4899" font-weight="bold">AI AGENT</text>

    <!-- Injected Prompt disappearing -->
    <rect x="100" y="230" width="150" height="60" rx="4" fill="#333" stroke="#fff" stroke-width="2" opacity="0.5">
       <animate attributeName="opacity" values="1;0" dur="2s" fill="freeze" repeatCount="indefinite" />
       <animate attributeName="y" values="230;180" dur="2s" fill="freeze" repeatCount="indefinite" />
    </rect>

    <!-- Scan Line -->
    <rect x="100" y="230" width="150" height="4" fill="#fff" opacity="0">
      <animate attributeName="y" values="230;286;230" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.35;0" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="175" y="310" text-anchor="middle" fill="#aaa" font-size="12">Prompt used once &amp; discarded</text>

    <!-- The Result -->
    <g transform="translate(125, 350)">
       <circle cx="50" cy="50" r="40" fill="#10b981" />
       <path d="M 30 50 L 45 65 L 70 35" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="stroke-dasharray" values="0,100;60,100" dur="1s" fill="freeze" />
       </path>
    </g>
    <text x="175" y="460" text-anchor="middle" fill="#fff" font-weight="bold" font-size="18">TASK DONE</text>

  </g>

</svg>
