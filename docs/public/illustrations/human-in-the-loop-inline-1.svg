<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" style="background-color: #0F172A; width: 100%; height: auto;">
  <defs>
    <!-- Line Gradients -->
    <linearGradient id="agent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="human-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    
    <!-- Area Fill Gradient -->
    <linearGradient id="debt-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.05" />
    </linearGradient>
    
    <!-- Clean Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip Path for the sweeping animation -->
    <clipPath id="sweep-clip">
      <rect x="575" y="0" height="600" class="anim-sweep-rect" />
    </clipPath>
  </defs>

  <style>
    /* Typography */
    .font-sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Core Styles */
    .grid-line { stroke: #1E293B; stroke-width: 1; }
    .grid-line-dash { stroke: #1E293B; stroke-width: 1; stroke-dasharray: 4, 4; }
    .axis-line { stroke: #475569; stroke-width: 2; stroke-linecap: round; }
    
    .text-title { fill: #F8FAFC; font-size: 28px; font-weight: 700; }
    .text-subtitle { fill: #94A3B8; font-size: 16px; font-weight: 400; }
    .text-axis { fill: #64748B; font-size: 14px; font-weight: 500; letter-spacing: 0.05em; }
    .text-label { fill: #E2E8F0; font-size: 14px; font-weight: 600; }
    .text-symptom { fill: #FECDD3; font-size: 14px; font-weight: 500; }
    
    /* Animation Assignment */
    .anim-grid { animation: reveal-grid 1.5s ease-out forwards; }
    .anim-axis { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw-axes 1.5s ease-out 0.5s forwards; }
    
    .anim-pop-title { opacity: 0; animation: pop-text 0.8s ease-out 0.2s forwards; }
    .anim-pop-axes { opacity: 0; animation: pop-text 0.8s ease-out 0.8s forwards; }
    
    .anim-line-agent { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw-agent-line 2s cubic-bezier(0.4, 0, 0.2, 1) 1s forwards; }
    .anim-line-human { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw-human-line 2s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards; }
    
    .anim-threshold { stroke-dasharray: 10, 8; stroke-dashoffset: 500; opacity: 0; animation: drop-marker 1s cubic-bezier(0.34, 1.56, 0.64, 1) 2.5s forwards; }
    .anim-pop-marker { opacity: 0; animation: pop-text 0.8s ease-out 2.8s forwards; }
    
    .anim-sweep-rect { width: 0; animation: sweep-rect 1.5s ease-in-out 2.5s forwards; }
    .anim-debt-group { animation: pulse-debt 4s ease-in-out 4s infinite alternate; }
    
    .anim-pop-debt { opacity: 0; animation: pop-text 1s ease-out 3s forwards; }
    .anim-pop-s1 { opacity: 0; animation: pop-text 0.8s ease-out 3.2s forwards; }
    .anim-pop-s2 { opacity: 0; animation: pop-text 0.8s ease-out 3.4s forwards; }
    .anim-pop-s3 { opacity: 0; animation: pop-text 0.8s ease-out 3.6s forwards; }

    /* Continuous Animations (Inner Wrappers) */
    .anim-float-1 { animation: float-symptom 4s ease-in-out infinite; }
    .anim-float-2 { animation: float-symptom 4.5s ease-in-out 1s infinite; }
    .anim-float-3 { animation: float-symptom 5s ease-in-out 2s infinite; }
    .anim-blip { animation: alert-blip 2s ease-in-out infinite; transform-origin: 16px 18px; }

    /* 10 Independent Keyframes */
    @keyframes reveal-grid { 
      0% { opacity: 0; } 
      100% { opacity: 1; } 
    }
    @keyframes draw-axes { 
      0% { stroke-dashoffset: 1200; } 
      100% { stroke-dashoffset: 0; } 
    }
    @keyframes draw-agent-line { 
      0% { stroke-dashoffset: 1200; } 
      100% { stroke-dashoffset: 0; } 
    }
    @keyframes draw-human-line { 
      0% { stroke-dashoffset: 1200; } 
      100% { stroke-dashoffset: 0; } 
    }
    @keyframes sweep-rect { 
      0% { width: 0; } 
      100% { width: 625px; } 
    }
    @keyframes pulse-debt { 
      0% { opacity: 1; } 
      100% { opacity: 0.6; } 
    }
    @keyframes drop-marker { 
      0% { stroke-dashoffset: 500; opacity: 0; } 
      100% { stroke-dashoffset: 0; opacity: 1; } 
    }
    @keyframes pop-text { 
      0% { opacity: 0; transform: translateY(15px); } 
      100% { opacity: 1; transform: translateY(0); } 
    }
    @keyframes alert-blip { 
      0%, 100% { transform: scale(1); fill-opacity: 0.3; } 
      50% { transform: scale(1.4); fill-opacity: 1; } 
    }
    @keyframes float-symptom { 
      0%, 100% { transform: translateY(0px); } 
      50% { transform: translateY(-5px); } 
    }
  </style>

  <!-- Background Grid -->
  <g class="anim-grid" opacity="0">
    <path d="M 150,150 L 1050,150 M 150,250 L 1050,250 M 150,350 L 1050,350 M 150,450 L 1050,450" class="grid-line" />
    <path d="M 150,150 L 150,450 M 375,150 L 375,450 M 600,150 L 600,450 M 825,150 L 825,450 M 1050,150 L 1050,450" class="grid-line-dash" />
  </g>

  <!-- Title & Subtitle -->
  <g class="font-sans anim-pop-title">
    <text x="80" y="60" class="text-title">Cognitive Debt Accumulation</text>
    <text x="80" y="90" class="text-subtitle">As task delegation increases, the gap between agent output and human understanding deepens.</text>
  </g>

  <!-- Debt Area (Bounded by clip-path to animate sweep from X=575 to X=1200) -->
  <g clip-path="url(#sweep-clip)">
    <g class="anim-debt-group">
      <path d="M 150,450 C 450,450 700,150 1000,150 L 1000,450 C 700,450 450,150 150,150 Z" fill="url(#debt-fill)" />
    </g>
  </g>

  <!-- Axes & Labels -->
  <g class="anim-axis">
    <path d="M 150,100 L 150,480" class="axis-line" />
    <path d="M 120,450 L 1080,450" class="axis-line" />
  </g>
  <g class="font-sans anim-pop-axes">
    <text x="1080" y="440" class="text-axis" text-anchor="end">Time &amp; Delegation Volume →</text>
    <text x="140" y="110" class="text-axis" text-anchor="end">Volume /</text>
    <text x="140" y="130" class="text-axis" text-anchor="end">Depth</text>

    <!-- Agent Label -->
    <g transform="translate(850, 115)">
      <rect x="0" y="0" width="120" height="28" rx="14" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
      <text x="60" y="19" class="text-label" fill="#BAE6FD" text-anchor="middle">Agent Output</text>
    </g>
    <!-- Human Label -->
    <g transform="translate(820, 465)">
      <rect x="0" y="0" width="170" height="28" rx="14" fill="#D97706" fill-opacity="0.2" stroke="#FBBF24" stroke-width="1" />
      <text x="85" y="19" class="text-label" fill="#FDE68A" text-anchor="middle">Human Understanding</text>
    </g>
  </g>

  <!-- Main Data Lines -->
  <!-- Agent Output Line -->
  <path d="M 150,450 C 450,450 700,150 1000,150" fill="none" stroke="url(#agent-grad)" stroke-width="4" stroke-linecap="round" class="anim-line-agent" filter="url(#glow)" />
  <!-- Human Understanding Line -->
  <path d="M 150,150 C 450,150 700,450 1000,450" fill="none" stroke="url(#human-grad)" stroke-width="4" stroke-linecap="round" class="anim-line-human" filter="url(#glow)" />

  <!-- Tipping Point Marker -->
  <g>
    <path d="M 575,100 L 575,480" stroke="#EF4444" stroke-width="2" stroke-linecap="round" class="anim-threshold" />
    <g class="font-sans anim-pop-marker">
      <rect x="500" y="70" width="150" height="26" rx="4" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
      <text x="575" y="88" fill="#FCA5A5" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.05em">CRITICAL THRESHOLD</text>
      <circle cx="575" cy="300" r="5" fill="#0F172A" stroke="#EF4444" stroke-width="2.5" />
    </g>
  </g>

  <!-- Debt Text & Symptoms -->
  <g class="font-sans">
    <g class="anim-pop-debt">
      <text x="780" y="295" fill="#E11D48" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0.05em" opacity="0.8">COGNITIVE DEBT</text>
    </g>

    <!-- Symptom 1: Mindless Approvals -->
    <g class="anim-pop-s1" transform="translate(680, 180)">
      <path d="M 80,36 L 80,60" stroke="#BE123C" stroke-width="1" stroke-dasharray="2,2" />
      <g class="anim-float-1">
        <rect x="0" y="0" width="170" height="36" rx="6" fill="#1E293B" stroke="#BE123C" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))" />
        <circle cx="16" cy="18" r="4" fill="#FDA4AF" class="anim-blip" />
        <text x="32" y="23" class="text-symptom">Mindless Approvals</text>
      </g>
    </g>

    <!-- Symptom 2: Skip Diff Reviews -->
    <g class="anim-pop-s2" transform="translate(860, 230)">
      <path d="M 75,36 L 75,70" stroke="#BE123C" stroke-width="1" stroke-dasharray="2,2" />
      <g class="anim-float-2">
        <rect x="0" y="0" width="160" height="36" rx="6" fill="#1E293B" stroke="#BE123C" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))" />
        <circle cx="16" cy="18" r="4" fill="#FDA4AF" class="anim-blip" />
        <text x="32" y="23" class="text-symptom">Skip Diff Reviews</text>
      </g>
    </g>

    <!-- Symptom 3: Ignore Logs -->
    <g class="anim-pop-s3" transform="translate(730, 360)">
      <path d="M 60,-20 L 60,0" stroke="#BE123C" stroke-width="1" stroke-dasharray="2,2" />
      <g class="anim-float-3">
        <rect x="0" y="0" width="120" height="36" rx="6" fill="#1E293B" stroke="#BE123C" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))" />
        <circle cx="16" cy="18" r="4" fill="#FDA4AF" class="anim-blip" />
        <text x="32" y="23" class="text-symptom">Ignore Logs</text>
      </g>
    </g>
  </g>
</svg>
