<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'JetBrains Mono', Consolas, monospace" style="background-color: #0f172a;">
  <!-- Background Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Block -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="300" height="60" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="15" y="38" fill="#38bdf8" font-size="24" font-weight="bold">KNOWLEDGE FEEDING</text>
    <text x="15" y="80" fill="#94a3b8" font-size="14">CONTEXT ARCHITECTURE v1.0</text>
  </g>

  <!-- Central Context Window (The Target) -->
  <g transform="translate(600, 380)">
    <!-- Container -->
    <path d="M -150 -100 L 150 -100 L 150 150 L -150 150 Z" fill="#1e293b" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <!-- Liquid/Content Level -->
    <rect x="-140" y="0" width="280" height="140" fill="#38bdf8" opacity="0.2">
      <animate attributeName="y" values="140; 0; 50; 20" dur="4s" repeatCount="indefinite" />
      <animate attributeName="height" values="0; 140; 90; 120" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="180" fill="#ffffff" font-size="16" text-anchor="middle" font-weight="bold">AGENT CONTEXT WINDOW</text>
    <text x="0" y="205" fill="#94a3b8" font-size="12" text-anchor="middle">Processing Unit</text>
  </g>

  <!-- Layer 1: Rule Layer (Top) -->
  <g transform="translate(600, 100)">
    <!-- Pipe -->
    <path d="M -60 0 L 60 0 L 40 160 L -40 160 Z" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="5,5"/>
    <!-- Flow Animation -->
    <circle r="4" fill="#f472b6">
        <animateMotion path="M 0 0 L 0 160" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#f472b6">
        <animateMotion path="M 0 0 L 0 160" dur="1s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Label Box -->
    <rect x="-140" y="-40" width="280" height="50" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <text x="0" y="-10" fill="#f472b6" font-size="18" text-anchor="middle" font-weight="bold" filter="url(#glow)">RULE LAYER</text>
    <text x="0" y="25" fill="#f472b6" font-size="12" text-anchor="middle">System Instructions (Always On)</text>
  </g>

  <!-- Layer 2: Capability Layer (Left Side) -->
  <g transform="translate(200, 300)">
    <!-- Connection Pipe -->
    <path d="M 160 0 L 250 0 L 250 30" fill="none" stroke="#22d3ee" stroke-width="2"/>
    
    <!-- Module Rack -->
    <rect x="0" y="-60" width="160" height="180" rx="5" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    
    <!-- Skills Modules -->
    <rect x="10" y="-40" width="140" height="30" fill="#0e7490" stroke="none" opacity="0.8"/>
    <text x="80" y="-20" fill="#cffafe" font-size="12" text-anchor="middle">Git Skill</text>
    
    <rect x="10" y="10" width="140" height="30" fill="#1e293b" stroke="#22d3ee" stroke-dasharray="2,2"/>
    <text x="80" y="30" fill="#67e8f9" font-size="12" text-anchor="middle">Design Skill</text>
    
    <rect x="10" y="60" width="140" height="30" fill="#0e7490" stroke="none" opacity="0.8"/>
    <text x="80" y="80" fill="#cffafe" font-size="12" text-anchor="middle">Search Skill</text>

    <!-- Header -->
    <rect x="0" y="-90" width="160" height="30" fill="#22d3ee"/>
    <text x="80" y="-70" fill="#0f172a" font-size="14" text-anchor="middle" font-weight="bold">CAPABILITY LAYER</text>
    
    <text x="80" y="145" fill="#22d3ee" font-size="12" text-anchor="middle" font-style="italic">On-Demand Injection</text>
  </g>

  <!-- Layer 3: Project Layer (Right Side/Bottom) -->
  <g transform="translate(900, 450)">
    <!-- Conveyor Belt Path -->
    <path d="M 0 0 L -150 0 L -150 -80" fill="none" stroke="#4ade80" stroke-width="2"/>
    
    <!-- Files on belt -->
    <g>
        <rect x="-20" y="-15" width="24" height="30" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
        <line x1="-15" y1="-8" x2="-5" y2="-8" stroke="#4ade80"/>
        <line x1="-15" y1="0" x2="-5" y2="0" stroke="#4ade80"/>
        <animateMotion path="M 100 0 L -150 0" dur="3s" repeatCount="indefinite" />
    </g>
    <g>
        <rect x="-20" y="-15" width="24" height="30" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
        <line x1="-15" y1="-8" x2="-5" y2="-8" stroke="#4ade80"/>
        <line x1="-15" y1="0" x2="-5" y2="0" stroke="#4ade80"/>
        <animateMotion path="M 100 0 L -150 0" dur="3s" begin="1.5s" repeatCount="indefinite" />
    </g>

    <!-- Scanner -->
    <path d="M -130 -20 L -170 -20 L -170 20 L -130 20 Z" fill="#1e293b" stroke="#4ade80"/>
    <line x1="-150" y1="-20" x2="-150" y2="20" stroke="#4ade80" stroke-width="2" opacity="0.5">
        <animate attributeName="opacity" values="0.2; 1; 0.2" dur="0.5s" repeatCount="indefinite"/>
    </line>

    <!-- Base -->
    <rect x="0" y="20" width="180" height="80" rx="5" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="90" y="50" fill="#4ade80" font-size="14" text-anchor="middle" font-weight="bold" filter="url(#glow)">PROJECT LAYER</text>
    <text x="90" y="75" fill="#4ade80" font-size="12" text-anchor="middle">Docs / Code / Config</text>
    <text x="90" y="90" fill="#86efac" font-size="10" text-anchor="middle">(Pull on Read)</text>
  </g>

  <!-- Flow Arrows -->
  <g opacity="0.6">
    <!-- From Rule -->
    <path d="M 600 210 L 600 270" stroke="#f472b6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
    <!-- From Cap -->
    <path d="M 450 330 L 520 330" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
    <!-- From Project -->
    <path d="M 750 370 L 680 370" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
  </g>

  <!-- Legend/Info -->
  <g transform="translate(950, 40)">
     <text x="0" y="0" fill="#94a3b8" font-size="10" text-anchor="end">Status: ACTIVE</text>
     <text x="0" y="15" fill="#94a3b8" font-size="10" text-anchor="end">Mode: AGENTIC</text>
     <circle cx="10" cy="-5" r="3" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
     </circle>
  </g>

</svg>