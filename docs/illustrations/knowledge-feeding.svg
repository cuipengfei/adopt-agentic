<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Times New Roman', Georgia, serif" style="background-color: #fdf6e3;">
  <!-- Definitions for Textures and Filters -->
  <defs>
    <!-- Old Paper Texture Filter -->
    <filter id="paper-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#fdf6e3" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feBlend mode="multiply" in="SourceGraphic"/>
    </filter>

    <!-- Hatching Patterns -->
    <pattern id="hatch-water" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#a4c2d6" stroke-width="1" opacity="0.5"/>
    </pattern>
    <pattern id="hatch-ice" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8b9bb4" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Iceberg tip gradient (cold blue-white, not flat white) -->
    <linearGradient id="ice-tip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#c5dde8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a4c2d6;stop-opacity:0.8"/>
    </linearGradient>
    <!-- Ice surface hatching for tip -->
    <pattern id="hatch-tip" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8bafc4" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Marker Arrow (Red) -->
    <marker id="arrow-end" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
    <!-- Marker Arrow (Dark) -->
    <marker id="arrow-end-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#433422"/>
    </marker>
    <!-- Marker Arrow (Blue) -->
    <marker id="arrow-end-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#268bd2"/>
    </marker>

    <!-- Milk Bottle Assets -->
    <path id="bottle-path" d="M 10 0 L 30 0 L 35 15 L 35 50 L 5 50 L 5 15 Z" />
    <clipPath id="bottle-clip">
      <use href="#bottle-path"/>
    </clipPath>
  </defs>

  <!-- Background Paper Texture -->
  <rect width="100%" height="100%" fill="#fdf6e3" filter="url(#paper-texture)"/>
  
  <!-- Frame / Border -->
  <rect x="20" y="20" width="1160" height="635" fill="none" stroke="#433422" stroke-width="2"/>
  <rect x="25" y="25" width="1150" height="625" fill="none" stroke="#433422" stroke-width="1"/>

  <!-- Main Title Block (Top Left) -->
  <g transform="translate(60, 80)">
    <text x="0" y="0" font-size="42" fill="#433422" font-weight="bold" letter-spacing="2">KNOWLEDGE FEEDING</text>
    <text x="0" y="30" font-size="24" fill="#665c54" font-style="italic">The Architecture of Context Management</text>
    <line x1="0" y1="45" x2="400" y2="45" stroke="#c0392b" stroke-width="2"/>
  </g>

  <!-- Water Surface Line — animated wave -->
  <path d="M 20 280 Q 300 290 600 280 T 1180 280" fill="none" stroke="#586e75" stroke-width="2" stroke-dasharray="10,5">
    <animate attributeName="d" values="M 20 280 Q 300 290 600 280 T 1180 280;M 20 282 Q 300 275 600 282 T 1180 278;M 20 280 Q 300 290 600 280 T 1180 280" dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="1100" y="270" font-size="16" fill="#586e75" font-style="italic">Waterline (Context Limit)</text>

  <!-- The Iceberg Structure (Bobbing Animation Added) -->
  <g transform="translate(600, 300)">
    <animateTransform attributeName="transform" type="translate" values="600,300; 600,305; 600,300" dur="6s" repeatCount="indefinite" />
    
    <!-- Underwater Mass (Hidden Knowledge) -->
    <path d="M -250 -20 L 250 -20 L 200 300 Q 0 350 -200 300 Z" fill="url(#hatch-ice)" stroke="#433422" stroke-width="2" opacity="0.8"/>
    
    <!-- Above Water Tip — irregular, natural iceberg shape (not a perfect triangle) -->
    <path d="M -130 -20 Q -120 -50 -80 -80 L -30 -140 Q 0 -155 20 -130 L 60 -90 Q 90 -55 120 -20 Z" fill="url(#ice-tip)" stroke="#433422" stroke-width="2"/>
    <path d="M -130 -20 Q -120 -50 -80 -80 L -30 -140 Q 0 -155 20 -130 L 60 -90 Q 90 -55 120 -20 Z" fill="url(#hatch-tip)" opacity="0.4"/>
    
    <!-- Crack lines on ice (hand-drawn detail) -->
    <path d="M -20 -120 L -10 -80 L 15 -60" fill="none" stroke="#8bafc4" stroke-width="1" opacity="0.5"/>
    <path d="M 40 -80 L 50 -50 L 35 -30" fill="none" stroke="#8bafc4" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Shimmer on ice -->
    <path d="M -40 -90 Q 0 -145 30 -100 L 10 -60 Z" fill="#ffffff" opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.2;0.05" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Divider Line (Waterline on Iceberg) -->
    <line x1="-250" y1="-20" x2="250" y2="-20" stroke="#433422" stroke-width="2"/>
  </g>

  <!-- Labels & Illustrations -->

  <!-- TIP: Context Window -->
  <g transform="translate(600, 180)">
    <line x1="80" y1="-30" x2="150" y2="-60" stroke="#433422" stroke-width="1"/>
    <text x="160" y="-60" font-size="20" fill="#c0392b" font-weight="bold">THE CONTEXT WINDOW</text>
    <text x="160" y="-40" font-size="14" fill="#665c54" font-style="italic">(Visible &amp; Active)</text>
    
    <!-- Milk Bottle Icon (Animated Filling/Consuming) -->
    <g transform="translate(160, -20) scale(0.8)">
      <!-- Animated Milk Level -->
      <rect x="0" y="50" width="40" height="0" fill="#ffffff" clip-path="url(#bottle-clip)">
        <animate attributeName="y" values="50; 15; 50" dur="8s" repeatCount="indefinite" />
        <animate attributeName="height" values="0; 35; 0" dur="8s" repeatCount="indefinite" />
      </rect>
      <!-- Bottle Frame -->
      <use href="#bottle-path" fill="none" stroke="#433422" stroke-width="2"/>
      
      <text x="20" y="35" font-size="10" text-anchor="middle" fill="#433422">MILK</text>
      <text x="20" y="-10" font-size="14" fill="#c0392b" font-style="italic" text-anchor="middle">"Perishable"</text>
    </g>
  </g>

  <!-- UNDERWATER: Three Layers -->
  
  <!-- 1. Rules (Global Instructions) -->
  <g transform="translate(600, 350)">
    <rect x="-180" y="0" width="360" height="40" fill="none" stroke="#433422" stroke-dasharray="4,4">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="25" font-size="18" fill="#433422" text-anchor="middle" font-weight="bold">LAYER I: GLOBAL RULES</text>
  </g>

  <!-- 2. Skills (Capabilities) -->
  <g transform="translate(600, 420)">
    <rect x="-160" y="0" width="320" height="40" fill="none" stroke="#433422" stroke-dasharray="4,4">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="25" font-size="18" fill="#433422" text-anchor="middle" font-weight="bold">LAYER II: SKILLS</text>
  </g>

  <!-- 3. Project (Codebase) - Added Scanner Animation -->
  <g transform="translate(600, 490)">
    <rect x="-200" y="0" width="400" height="60" fill="none" stroke="#433422" stroke-dasharray="4,4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="7s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <!-- Scanner Line -->
    <line x1="-190" y1="5" x2="-190" y2="55" stroke="#c0392b" stroke-width="2" opacity="0.4">
      <animate attributeName="x1" values="-190; 190; -190" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="-190; 190; -190" dur="6s" repeatCount="indefinite" />
    </line>
    <text x="0" y="35" font-size="18" fill="#433422" text-anchor="middle" font-weight="bold">LAYER III: PROJECT KNOWLEDGE</text>
    <text x="0" y="50" font-size="12" fill="#665c54" text-anchor="middle" font-style="italic">(Code, Docs, Materials)</text>
  </g>

  <!-- Feeding Mechanisms (Pipes/Flows) Labels - Added Flow Animation -->
  <g fill="none" stroke="#433422" stroke-width="1.5">
    <!-- Path from Rules -->
    <path d="M 420 370 C 350 370 350 150 500 160" marker-end="url(#arrow-end-dark)" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="360" y="260" font-size="14" fill="#433422" font-style="italic">Always Active</text>
    
    <!-- Path from Skills -->
    <path d="M 760 440 C 850 440 850 200 700 160" marker-end="url(#arrow-end-blue)" stroke="#268bd2" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="8;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="820" y="300" font-size="14" fill="#433422" font-style="italic">On Demand</text>
    
    <!-- Path from Project -->
    <path d="M 600 490 L 600 280" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="630" y="565" font-size="14" fill="#433422" font-style="italic" text-anchor="middle">Deep Retrieval</text>
  </g>
  
  <!-- Flow Animations (SVG Native) - Particles kept on top -->
  <!-- Rules Flow -->
  <circle r="4" fill="#433422" opacity="0.8">
    <animateMotion path="M 420 370 C 350 370 350 150 500 160" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Skills Flow -->
  <circle r="4" fill="#268bd2" opacity="0.8">
    <animateMotion path="M 760 440 C 850 440 850 200 700 160" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Deep Retrieval Flow (vertical pipe) -->
  <circle r="3" fill="#433422" opacity="0.6">
    <animateMotion path="M 600 490 L 600 280" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.8;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Annotation Notes (Bottom Left) -->
  <g transform="translate(60, 580)">
    <text x="0" y="0" font-size="14" fill="#433422" font-weight="bold">NOTE A: FEEDING STRATEGY</text>
    <text x="0" y="20" font-size="14" fill="#665c54">Do not force-feed. Select relevant</text>
    <text x="0" y="40" font-size="14" fill="#665c54">fragments to maintain freshness.</text>
  </g>



</svg>
