<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Common anti-patterns and observability: false completion, stuck loops, and speed traps mapped to observable signals and fixes">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081022" />
      <stop offset="1" stop-color="#091a2e" />
    </linearGradient>

    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.22" />
      <stop offset="1" stop-color="#34d399" stop-opacity="0.18" />
    </linearGradient>

    <style>
      .frame { fill: url(#bg2); stroke: rgba(148,163,184,0.35); stroke-width: 1; }
      .title { font: 700 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #f8fafc; }
      .subtitle { font: 500 13.5px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(226,232,240,0.86); }

      .section { font: 700 13.5px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(226,232,240,0.9); letter-spacing: 0.25px; }
      .chip { fill: url(#chip); stroke: rgba(96,165,250,0.35); stroke-width: 1; }
      .chipText { font: 600 12.5px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(226,232,240,0.92); }

      .hdr { font: 700 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(148,163,184,0.95); letter-spacing: 0.35px; }
      .row { fill: rgba(255,255,255,0.06); stroke: rgba(148,163,184,0.35); stroke-width: 1; }
      .sep { stroke: rgba(148,163,184,0.20); }

      .k { font: 700 15px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #e5e7eb; }
      .t { font: 500 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(226,232,240,0.86); }
      .muted { fill: rgba(148,163,184,0.92); }

      .danger { fill: rgba(248,113,113,0.95); }
      .info { fill: rgba(96,165,250,0.95); }
      .warn { fill: rgba(251,191,36,0.95); }
      .ok { fill: rgba(52,211,153,0.95); }

      .blink { animation: blink 1.7s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .blink { animation: none; opacity: 0.85; }
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect class="frame" x="20" y="20" width="1160" height="480" rx="22" />
  <rect x="20" y="20" width="1160" height="480" rx="22" fill="none" stroke="rgba(96,165,250,0.18)" />

  <!-- Header -->
  <text class="title" x="52" y="66">Anti-Patterns, Signals, Fixes</text>
  <text class="subtitle" x="52" y="92">Observability is not fancy dashboards. It is seeing real signals (evidence) and reacting before the system drifts.</text>
  <path d="M52 106 H1148" stroke="rgba(148,163,184,0.22)" />

  <!-- Chips -->
  <text class="section" x="52" y="132">Signals you can inject into context</text>
  <g>
    <rect class="chip" x="52" y="144" width="102" height="28" rx="14" />
    <text class="chipText" x="66" y="162">exit code</text>
    <circle class="blink" cx="140" cy="158" r="3.4" fill="#34d399" />

    <rect class="chip" x="164" y="144" width="116" height="28" rx="14" />
    <text class="chipText" x="178" y="162">test report</text>

    <rect class="chip" x="290" y="144" width="132" height="28" rx="14" />
    <text class="chipText" x="304" y="162">lint warnings</text>

    <rect class="chip" x="432" y="144" width="66" height="28" rx="14" />
    <text class="chipText" x="446" y="162">diff</text>

    <rect class="chip" x="508" y="144" width="118" height="28" rx="14" />
    <text class="chipText" x="522" y="162">tool rounds</text>

    <rect class="chip" x="636" y="144" width="104" height="28" rx="14" />
    <text class="chipText" x="650" y="162">token cost</text>
  </g>

  <!-- Left: anti-pattern rows -->
  <g>
    <text class="hdr" x="70" y="194">ANTI-PATTERN</text>
    <text class="hdr" x="330" y="194">OBSERVABLE SIGNALS</text>
    <text class="hdr" x="610" y="194">RECOVERY / FIX</text>

    <!-- Row 1 -->
    <rect class="row" x="52" y="208" width="780" height="80" rx="16" />
    <path class="sep" d="M310 216 V280" />
    <path class="sep" d="M590 216 V280" />

    <!-- Icon: warning triangle -->
    <path d="M82 232 L96 258 L68 258 Z" fill="rgba(248,113,113,0.22)" stroke="rgba(248,113,113,0.80)" />
    <path d="M82 240 V250" stroke="#f87171" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="82" cy="254" r="1.8" fill="#f87171" />

    <text class="k" x="110" y="240">False Completion</text>
    <text class="t" x="110" y="262">“Done!” with no proof</text>

    <circle class="blink" cx="326" cy="232" r="4" fill="#60a5fa" />
    <text class="t" x="340" y="238">No tests/build ran</text>
    <text class="t" x="340" y="258">No artifacts / exit code attached</text>

    <text class="t" x="610" y="238">Make verification mandatory</text>
    <text class="t" x="610" y="258">Require evidence in context</text>

    <!-- Row 2 -->
    <rect class="row" x="52" y="300" width="780" height="80" rx="16" />
    <path class="sep" d="M310 308 V372" />
    <path class="sep" d="M590 308 V372" />

    <!-- Icon: loop -->
    <circle cx="82" cy="332" r="12" fill="rgba(96,165,250,0.18)" stroke="rgba(96,165,250,0.75)" />
    <path d="M78 332 a6 6 0 1 0 10 -4" fill="none" stroke="#60a5fa" stroke-width="2.4" stroke-linecap="round" />
    <path d="M92 326 L96 333 L88 332" fill="none" stroke="#60a5fa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

    <text class="k" x="110" y="332">Stuck Loop</text>
    <text class="t" x="110" y="354">Same fix, same failure</text>

    <circle class="blink" cx="326" cy="324" r="4" fill="#60a5fa" />
    <text class="t" x="340" y="330">The same error repeats</text>
    <text class="t" x="340" y="350">No new evidence per attempt</text>

    <text class="t" x="610" y="330">Set a retry threshold</text>
    <text class="t" x="610" y="350">Switch strategy or escalate</text>

    <!-- Row 3 -->
    <rect class="row" x="52" y="392" width="780" height="80" rx="16" />
    <path class="sep" d="M310 400 V464" />
    <path class="sep" d="M590 400 V464" />

    <!-- Icon: lightning -->
    <path d="M82 412 L74 436 H86 L78 460 L98 432 H86 Z" fill="rgba(251,191,36,0.22)" stroke="rgba(251,191,36,0.80)" />

    <text class="k" x="110" y="424">Speed Trap</text>
    <text class="t" x="110" y="446">Fast output, drifting quality</text>

    <circle class="blink" cx="326" cy="416" r="4" fill="#60a5fa" />
    <text class="t" x="340" y="422">Warnings ignored</text>
    <text class="t" x="340" y="442">Edge cases regress / style drifts</text>

    <text class="t" x="610" y="422">Increase verification density</text>
    <text class="t" x="610" y="442">Add spot-check checkpoints</text>
  </g>

  <!-- Right: system-level observability -->
  <g>
    <rect class="row" x="848" y="208" width="300" height="264" rx="16" />
    <text class="k" x="870" y="240">System-level observability</text>
    <text class="t" x="870" y="262">Track trends, not anecdotes:</text>

    <!-- Metric bars -->
    <g>
      <text class="t muted" x="870" y="292">Completion rate</text>
      <rect x="870" y="302" width="250" height="10" rx="5" fill="rgba(148,163,184,0.18)" />
      <rect x="870" y="302" width="180" height="10" rx="5" fill="rgba(52,211,153,0.55)" />

      <text class="t muted" x="870" y="332">Avg tool rounds</text>
      <rect x="870" y="342" width="250" height="10" rx="5" fill="rgba(148,163,184,0.18)" />
      <rect x="870" y="342" width="120" height="10" rx="5" fill="rgba(96,165,250,0.55)" />

      <text class="t muted" x="870" y="372">Token burn</text>
      <rect x="870" y="382" width="250" height="10" rx="5" fill="rgba(148,163,184,0.18)" />
      <rect x="870" y="382" width="160" height="10" rx="5" fill="rgba(251,191,36,0.55)" />

      <text class="t muted" x="870" y="412">Flip-flops (oscillation)</text>
      <rect x="870" y="422" width="250" height="10" rx="5" fill="rgba(148,163,184,0.18)" />
      <rect x="870" y="422" width="90" height="10" rx="5" fill="rgba(248,113,113,0.50)" />
    </g>

    <path d="M870 452 H1126" stroke="rgba(148,163,184,0.18)" />
    <text class="subtitle" x="870" y="472">If you can’t see signals, you can’t correct behavior.</text>
  </g>

  <!-- Footer note -->
  <text class="subtitle" x="52" y="492">Rule of thumb: evidence &gt; narrative. Capture outputs, then decide.</text>
</svg>
