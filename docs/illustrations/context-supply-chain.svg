<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" style="background-color: #0A2540; font-family: 'Courier New', Courier, ui-monospace, monospace;">
  <!-- DEFINITIONS -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EAF6FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#BFE8FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EAF6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-tube" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#123A5E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0A2540;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#082238;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrow-head" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#EAF6FF" opacity="0.85" />
    </marker>
    <marker id="arrow-flow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#BFE8FF" opacity="0.9" />
    </marker>

    <!-- Blueprint dimension tick (for measurement lines) -->
    <marker id="dim-tick" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M2,2 L8,8" stroke="#EAF6FF" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />
    </marker>
  </defs>

  <!-- BACKGROUND GRID (Blueprint Paper) -->
  <pattern id="grid-pattern" width="100" height="100" patternUnits="userSpaceOnUse">
    <!-- Minor grid -->
    <path d="M 20 0 V 100 M 40 0 V 100 M 60 0 V 100 M 80 0 V 100 M 0 20 H 100 M 0 40 H 100 M 0 60 H 100 M 0 80 H 100"
          fill="none" stroke="#1F5A84" stroke-width="0.6" opacity="0.35" />
    <!-- Major grid -->
    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#2A6FA5" stroke-width="1" opacity="0.45" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid-pattern)" />

  <!-- Blueprint scan line (subtle) -->
  <line x1="30" y1="0" x2="1170" y2="0" stroke="#BFE8FF" stroke-width="2" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0 70;0 430;0 70" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.12;0" dur="10s" repeatCount="indefinite" />
  </line>
   
  <!-- CONNECTING PIPES (Background) -->
  <!-- Main Pipe: Agent -> LLM -->
  <path d="M 460 250 L 680 250" stroke="url(#grad-flow)" stroke-width="3.2" stroke-dasharray="14 7" opacity="0.95" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Blueprint dimension annotation for request path -->
  <g opacity="0.85">
    <line x1="460" y1="215" x2="680" y2="215" stroke="#EAF6FF" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.75" marker-start="url(#dim-tick)" marker-end="url(#dim-tick)" />
    <text x="570" y="208" fill="#BFE8FF" font-size="10" text-anchor="middle" opacity="0.85">REQUEST SPAN</text>
  </g>
  <!-- Return Pipe: LLM -> Agent (The Loop) -->
  <path d="M 1080 250 L 1100 250 Q 1150 250 1150 300 L 1150 400 Q 1150 450 1100 450 L 150 450 Q 100 450 100 400 L 100 300 Q 100 250 150 250 L 190 250" 
        fill="none" stroke="#BFE8FF" stroke-width="1.6" stroke-dasharray="10 6" opacity="0.55" stroke-linecap="round" />
  
  <!-- SECTION 1: THE SOURCE (RAW CONTEXT) -->
  <g transform="translate(50, 150)">
    <text x="70" y="-30" fill="#EAF6FF" font-size="12" font-weight="bold" letter-spacing="1.6" text-anchor="middle" opacity="0.9">RAW MATERIALS</text>
    <rect x="0" y="0" width="140" height="200" fill="#0E3558" fill-opacity="0.28" stroke="#EAF6FF" stroke-opacity="0.85" stroke-width="1.6" rx="6" />
    
    <!-- File Icons -->
    <g transform="translate(20, 30)" opacity="0.95">
      <rect x="0" y="0" width="30" height="40" fill="none" stroke="#EAF6FF" stroke-width="1.3" rx="2" />
      <path d="M6 12 H24 M6 20 H24 M6 28 H18" fill="none" stroke="#BFE8FF" stroke-width="1.1" stroke-linecap="round" opacity="0.85" />
    </g>
    <g transform="translate(60, 40)" opacity="0.95">
      <rect x="0" y="0" width="30" height="40" fill="none" stroke="#EAF6FF" stroke-width="1.3" rx="2" />
      <rect x="6" y="6" width="18" height="14" fill="none" stroke="#BFE8FF" stroke-width="1.1" opacity="0.85" />
      <rect x="9" y="26" width="12" height="10" fill="none" stroke="#BFE8FF" stroke-width="1.1" opacity="0.85" />
      <line x1="9" y1="30" x2="21" y2="30" stroke="#BFE8FF" stroke-width="1.1" opacity="0.85" />
    </g>
    <g transform="translate(90, 20)" opacity="0.95">
      <path d="M3 12 H12 L15 8 H27 Q29 8 29 10 V34 Q29 36 27 36 H3 Q1 36 1 34 V14 Q1 12 3 12 Z" fill="none" stroke="#EAF6FF" stroke-width="1.3" stroke-linejoin="round" />
      <path d="M1 16 H29" fill="none" stroke="#BFE8FF" stroke-width="1.1" opacity="0.85" />
    </g>
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="80" height="30" fill="none" stroke="#EAF6FF" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.9" />
      <text x="40" y="20" fill="#EAF6FF" font-size="10" text-anchor="middle" letter-spacing="0.6">USER PROMPT</text>
    </g>
    <text x="70" y="160" fill="#BFE8FF" font-size="10" text-anchor="middle" font-style="italic" opacity="0.9">Unstructured Noise</text>
  </g>

  <!-- ARROW 1 -->
  <line x1="190" y1="250" x2="290" y2="250" stroke="#EAF6FF" stroke-width="1.8" opacity="0.75" marker-end="url(#arrow-head)" />

  <!-- SECTION 2: THE AGENT (ASSEMBLY) -->
  <g transform="translate(300, 120)">
    <text x="80" y="-20" fill="#EAF6FF" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle" opacity="0.95">THE AGENT</text>
    <!-- Machine Body -->
    <rect x="0" y="0" width="160" height="260" fill="url(#grad-tube)" stroke="#EAF6FF" stroke-width="1.8" stroke-opacity="0.9" rx="4" />
    
    <!-- Internal Mechanics -->
    <line x1="20" y1="40" x2="140" y2="40" stroke="#EAF6FF" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
    <text x="80" y="30" fill="#BFE8FF" font-size="10" text-anchor="middle" letter-spacing="0.8" opacity="0.95">CONTEXT ASSEMBLER</text>
    
    <!-- Actions -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="100" height="25" fill="none" stroke="#EAF6FF" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.9" />
      <text x="50" y="17" fill="#EAF6FF" font-size="10" text-anchor="middle" letter-spacing="0.6">1. FILTER</text>
    </g>
    <g transform="translate(30, 105)">
      <rect x="0" y="0" width="100" height="25" fill="none" stroke="#EAF6FF" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.9" />
      <text x="50" y="17" fill="#EAF6FF" font-size="10" text-anchor="middle" letter-spacing="0.6">2. FORMAT</text>
    </g>
    <g transform="translate(30, 140)">
      <rect x="0" y="0" width="100" height="25" fill="none" stroke="#EAF6FF" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.9" />
      <text x="50" y="17" fill="#EAF6FF" font-size="10" text-anchor="middle" letter-spacing="0.6">3. COMPRESS</text>
    </g>
    
    <!-- Output Port -->
    <circle cx="160" cy="130" r="8" fill="none" stroke="#EAF6FF" stroke-width="1.6" opacity="0.9" />
  </g>

  <!-- TRANSPORT LABELS -->
  <g transform="translate(570, 230)">
    <rect x="-90" y="-20" width="180" height="40" fill="#0A2540" fill-opacity="0.35" stroke="#EAF6FF" stroke-width="1.2" stroke-dasharray="6 4" rx="4" opacity="0.9" />
    <circle cx="0" cy="20" r="2" fill="#EAF6FF" opacity="0.75" />
    <text x="0" y="0" fill="#EAF6FF" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.2" opacity="0.95">HTTP REQUEST</text>
    <text x="0" y="15" fill="#BFE8FF" font-size="10" text-anchor="middle" opacity="0.85">JSON Payload (Window Limit)</text>
  </g>

  <!-- SECTION 3: THE LLM (PROCESSING) -->
  <g transform="translate(680, 100)">
    <text x="100" y="-20" fill="#EAF6FF" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle" opacity="0.95">LLM API</text>
    <!-- Brain/Chip Shape -->
    <path d="M 50 0 L 150 0 L 200 80 L 150 160 L 50 160 L 0 80 Z" fill="#0E3558" fill-opacity="0.22" stroke="#EAF6FF" stroke-width="1.8" stroke-opacity="0.9" />
    
    <!-- Core Glow -->
    <circle cx="100" cy="80" r="40" fill="#EAF6FF" opacity="0.08">
      <animate attributeName="opacity" values="0.08;0.18;0.08" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <text x="100" y="85" fill="#EAF6FF" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">INFERENCE</text>
    
    <!-- Stateless Badge -->
    <g transform="translate(60, 190)">
      <rect x="0" y="0" width="80" height="20" fill="none" stroke="#EAF6FF" stroke-width="1.2" stroke-dasharray="4 3" rx="10" opacity="0.9" />
      <text x="40" y="14" fill="#EAF6FF" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="0.8">NO MEMORY</text>
    </g>
  </g>

  <!-- ARROW 2 -->
  <line x1="880" y1="180" x2="920" y2="180" stroke="#EAF6FF" stroke-width="1.8" opacity="0.75" marker-end="url(#arrow-head)" />

  <!-- SECTION 4: THE OUTPUT (ACTION) -->
  <g transform="translate(920, 120)">
    <text x="80" y="-20" fill="#EAF6FF" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle" opacity="0.95">OUTPUT</text>
    <rect x="0" y="0" width="160" height="150" fill="#0E3558" fill-opacity="0.22" stroke="#EAF6FF" stroke-width="1.8" stroke-opacity="0.9" rx="4" />
    
    <!-- Code Block -->
    <rect x="10" y="10" width="140" height="130" fill="#061D33" fill-opacity="0.9" rx="2" />
    <text x="20" y="30" fill="#EAF6FF" font-size="10" font-family="monospace" opacity="0.95">&gt; Tool_Call</text>
    <text x="20" y="50" fill="#BFE8FF" font-size="10" font-family="monospace" opacity="0.85">  args: { ... }</text>
    <text x="20" y="80" fill="#EAF6FF" font-size="10" font-family="monospace" opacity="0.95">&gt; Thought:</text>
    <text x="20" y="100" fill="#BFE8FF" font-size="10" font-family="monospace" opacity="0.85">  "I need to..."</text>
  </g>

  <!-- LOOP BACK -->
  <g transform="translate(625, 430)">
    <text x="0" y="0" fill="#EAF6FF" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2" opacity="0.85">THE RECURSIVE LOOP</text>
    <text x="0" y="15" fill="#BFE8FF" font-size="10" text-anchor="middle" opacity="0.75">Output becomes Input for next turn</text>
  </g>
  
  <!-- Flow Arrows on Loop (pointing left ← matching right-to-left flow) -->
  <path d="M 590 450 L 600 445 L 600 455 Z" fill="#EAF6FF" opacity="0.7">
     <animateTransform attributeName="transform" type="translate" from="200 0" to="-200 0" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- TITLE -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="4" height="40" fill="#EAF6FF" opacity="0.9" />
    <text x="15" y="18" fill="#EAF6FF" font-size="20" font-weight="bold" letter-spacing="1">CONTEXT SUPPLY CHAIN</text>
    <text x="15" y="38" fill="#BFE8FF" font-size="12" opacity="0.85">Everything is Context</text>
    <text x="15" y="58" fill="#BFE8FF" font-size="10" opacity="0.75">VIBE CODING → CONTEXT ENGINEERING</text>
  </g>

  <!-- BLUEPRINT FRAME / TITLE BLOCK -->
  <g>
    <!-- Outer frame -->
    <rect x="20" y="20" width="1160" height="460" fill="none" stroke="#EAF6FF" stroke-width="1.2" opacity="0.35" />
    <path d="M20 60 V20 H60 M1140 20 H1180 V60 M1180 440 V480 H1140 M60 480 H20 V440"
          fill="none" stroke="#BFE8FF" stroke-width="1.4" opacity="0.55" stroke-linecap="round" />

    <!-- Center registration mark -->
    <g opacity="0.22">
      <circle cx="600" cy="250" r="18" fill="none" stroke="#EAF6FF" stroke-width="1" stroke-dasharray="2 6" />
      <line x1="600" y1="228" x2="600" y2="272" stroke="#EAF6FF" stroke-width="1" />
      <line x1="578" y1="250" x2="622" y2="250" stroke="#EAF6FF" stroke-width="1" />
    </g>

    <!-- Title block (bottom-right) -->
    <g opacity="0.85">
      <rect x="820" y="400" width="360" height="80" fill="#0A2540" fill-opacity="0.35" stroke="#EAF6FF" stroke-width="1.2" />
      <line x1="820" y1="430" x2="1180" y2="430" stroke="#EAF6FF" stroke-width="1" opacity="0.7" />
      <line x1="820" y1="455" x2="1180" y2="455" stroke="#EAF6FF" stroke-width="1" opacity="0.7" />
      <line x1="1040" y1="400" x2="1040" y2="480" stroke="#EAF6FF" stroke-width="1" opacity="0.7" />

      <text x="830" y="414" fill="#BFE8FF" font-size="9" letter-spacing="1" opacity="0.9">DRAWING</text>
      <text x="830" y="426" fill="#EAF6FF" font-size="11" font-weight="bold" letter-spacing="0.8">CONTEXT SUPPLY CHAIN</text>
      <text x="830" y="447" fill="#BFE8FF" font-size="9" opacity="0.9">SUBJECT: CONTEXT FLOW</text>
      <text x="830" y="472" fill="#BFE8FF" font-size="9" opacity="0.9">STATUS: DRAFT</text>

      <text x="1050" y="418" fill="#EAF6FF" font-size="10" letter-spacing="0.6" opacity="0.95">SHEET: 01/01</text>
      <text x="1050" y="447" fill="#EAF6FF" font-size="10" letter-spacing="0.6" opacity="0.95">REV: B</text>
      <text x="1050" y="472" fill="#EAF6FF" font-size="10" letter-spacing="0.6" opacity="0.95">SCALE: NTS</text>
    </g>

    <!-- Scale ruler (bottom-left) -->
    <g opacity="0.7">
      <text x="40" y="452" fill="#BFE8FF" font-size="9" letter-spacing="1">SCALE</text>
      <g transform="translate(40, 458)">
        <rect x="0" y="0" width="200" height="10" fill="none" stroke="#EAF6FF" stroke-width="1" opacity="0.55" />
        <rect x="0" y="0" width="20" height="10" fill="#EAF6FF" opacity="0.2" />
        <rect x="40" y="0" width="20" height="10" fill="#EAF6FF" opacity="0.2" />
        <rect x="80" y="0" width="20" height="10" fill="#EAF6FF" opacity="0.2" />
        <rect x="120" y="0" width="20" height="10" fill="#EAF6FF" opacity="0.2" />
        <rect x="160" y="0" width="20" height="10" fill="#EAF6FF" opacity="0.2" />
        <line x1="20" y1="0" x2="20" y2="10" stroke="#EAF6FF" stroke-width="1" opacity="0.35" />
        <line x1="40" y1="0" x2="40" y2="10" stroke="#EAF6FF" stroke-width="1" opacity="0.35" />
        <line x1="60" y1="0" x2="60" y2="10" stroke="#EAF6FF" stroke-width="1" opacity="0.35" />
        <line x1="80" y1="0" x2="80" y2="10" stroke="#EAF6FF" stroke-width="1" opacity="0.35" />
        <line x1="100" y1="0" x2="100" y2="10" stroke="#EAF6FF" stroke-width="1" opacity="0.35" />
        <line x1="120" y1="0" x2="120" y2="10" stroke="#EAF6FF" stroke-width="1" opacity="0.35" />
        <line x1="140" y1="0" x2="140" y2="10" stroke="#EAF6FF" stroke-width="1" opacity="0.35" />
        <line x1="160" y1="0" x2="160" y2="10" stroke="#EAF6FF" stroke-width="1" opacity="0.35" />
        <line x1="180" y1="0" x2="180" y2="10" stroke="#EAF6FF" stroke-width="1" opacity="0.35" />
      </g>
      <text x="248" y="452" fill="#BFE8FF" font-size="9" opacity="0.85">NTS</text>
    </g>
  </g>

</svg>
