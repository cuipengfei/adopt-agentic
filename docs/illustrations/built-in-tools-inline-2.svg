<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Trust Boundary Levels</title>
  <desc id="desc">A risk-based view of built-in tools: allow read-only exploration, review low-risk writes, and confirm high-risk write or execute operations.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <style><![CDATA[
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }

    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; fill: #64748b; }
    .label { font-size: 13px; font-weight: 800; fill: #0f172a; }
    .small { font-size: 11px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 11px; fill: #334155; }

    .card { stroke-width: 1; }
    .card-green { fill: #f0fdf4; stroke: #bbf7d0; }
    .card-amber { fill: #fffbeb; stroke: #fde68a; }
    .card-red { fill: #fef2f2; stroke: #fecaca; }

    .badge { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .badge-text { font-size: 10px; font-weight: 800; letter-spacing: 0.6px; }

    .riskline { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
  ]]></style>

  <rect class="bg" x="0" y="0" width="1200" height="360" />
  <rect class="panel" x="24" y="24" width="1152" height="312" rx="16" filter="url(#shadow)" />

  <text class="title" x="48" y="64">Trust Boundary Levels</text>
  <text class="subtitle" x="48" y="88">Handle tools differently by risk: allow observation, review writes, confirm high-risk ops.</text>
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#e2e8f0" stroke-width="2" />

  <!-- Risk arrow -->
  <g>
    <text class="kicker" x="60" y="128">RISK &amp; PERMISSIONS →</text>
    <path class="riskline" d="M 220 124 L 1140 124" />
    <circle r="4" fill="#64748b" opacity="0.55">
      <animateMotion path="M 220 124 L 1140 124" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Cards -->
  <g transform="translate(60, 142)">
    <!-- Card 1: Read-only -->
    <g>
      <rect class="card card-green" x="0" y="0" width="340" height="164" rx="14" filter="url(#shadow-sm)" />
      <text class="label" x="18" y="34" fill="#166534">Read-only tools</text>

      <g transform="translate(220, 16)">
        <rect class="badge" x="0" y="0" width="98" height="26" rx="13" />
        <text class="badge-text" x="49" y="17" text-anchor="middle" fill="#166534">ALLOW</text>
      </g>

      <text class="small" x="18" y="56">Examples</text>
      <text class="mono" x="18" y="76">ls, read_file, grep</text>

      <text class="small" x="18" y="104">Recommended handling</text>
      <text class="mono" x="18" y="124">Let it explore and observe.</text>
      <text class="mono" x="18" y="142">Builds navigation context.</text>
    </g>

    <!-- Card 2: Low-risk write -->
    <g transform="translate(370, 0)">
      <rect class="card card-amber" x="0" y="0" width="340" height="164" rx="14" filter="url(#shadow-sm)" />
      <text class="label" x="18" y="34" fill="#92400e">Low-risk write</text>

      <g transform="translate(210, 16)">
        <rect class="badge" x="0" y="0" width="108" height="26" rx="13" />
        <text class="badge-text" x="54" y="17" text-anchor="middle" fill="#92400e">REVIEW</text>
      </g>

      <text class="small" x="18" y="56">Examples</text>
      <text class="mono" x="18" y="76">write_file, edit_file</text>

      <text class="small" x="18" y="104">Recommended handling</text>
      <text class="mono" x="18" y="124">Review a diff. Keep changes small.</text>
      <text class="mono" x="18" y="142">Prefer reversible edits.</text>
    </g>

    <!-- Card 3: High-risk ops -->
    <g transform="translate(740, 0)">
      <rect class="card card-red" x="0" y="0" width="340" height="164" rx="14" filter="url(#shadow-sm)" />
      <rect x="0" y="0" width="340" height="164" rx="14" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.0">
        <animate attributeName="opacity" values="0;0.55;0" dur="2.2s" repeatCount="indefinite" />
      </rect>
      <text class="label" x="18" y="34" fill="#991b1b">High-risk write/execute</text>

      <g transform="translate(200, 16)">
        <rect class="badge" x="0" y="0" width="118" height="26" rx="13" />
        <text class="badge-text" x="59" y="17" text-anchor="middle" fill="#991b1b">CONFIRM</text>
      </g>

      <text class="small" x="18" y="56">Examples</text>
      <text class="mono" x="18" y="76">bash, rm -rf, deploy</text>

      <text class="small" x="18" y="104">Recommended handling</text>
      <text class="mono" x="18" y="124">Explicit approval + guardrails.</text>
      <text class="mono" x="18" y="142">Add sandboxing when possible.</text>
    </g>
  </g>

  <!-- Bottom rule banner -->
  <g transform="translate(48, 318)">
    <rect x="0" y="0" width="1104" height="34" rx="10" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="16" y="22" class="mono" fill="#1d4ed8">Rule: read before write</text>
    <text x="255" y="22" class="mono">• stop if a write happens without a prior read</text>
    <text x="820" y="22" class="mono">• audit trail: tool_calls + tool results</text>
  </g>
</svg>
