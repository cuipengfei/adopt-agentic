<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Comic Sans MS', 'Chalkboard SE', sans-serif">
  <!-- 
    Style: Claymation / Plasticine
    Layout: Isometric Map
    Concept: Peer-to-Peer Agents as friendly clay figures collaborating on a shared surface
    Animations: Restored ~20 animations (Blinking, Shadows, Reverse Traffic, Floating Labels, Grid Flow)
  -->

  <defs>
    <!-- Soft Clay Material Filter -->
    <filter id="clay-material" x="-50%" y="-50%" width="200%" height="200%">
      <!-- 1. Soft Blur for the base shape to round edges -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      
      <!-- 2. Lighting for 3D effect -->
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.8" specularExponent="15" result="specular" lighting-color="#ffffff">
        <fePointLight x="-500" y="-1000" z="2000"/>
      </feSpecularLighting>
      
      <!-- 3. Inner Shadow/Ambient Occlusion -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blurAlpha"/>
      <feOffset dx="2" dy="4" in="blurAlpha" result="offsetBlur"/>
      <feComposite in="offsetBlur" in2="SourceAlpha" operator="out" result="inverseShadow"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="inverseShadow" operator="in" result="innerShadow"/>
      
      <!-- 4. Drop Shadow -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="dropBlur"/>
      <feOffset dx="0" dy="15" in="dropBlur" result="dropShadow"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="dropShadow" operator="in" result="coloredDropShadow"/>

      <!-- Combine -->
      <feMerge>
        <feMergeNode in="coloredDropShadow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="innerShadow"/>
        <feMergeNode in="specular"/>
      </feMerge>
    </filter>

    <!-- Clay Connection Rope Filter (rougher) -->
    <filter id="clay-rope">
      <feGaussianBlur stdDeviation="0.5"/>
      <feSpecularLighting surfaceScale="2" specularConstant="0.5" specularExponent="10" lighting-color="#ffffff">
        <fePointLight x="-200" y="-500" z="800"/>
      </feSpecularLighting>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode/>
      </feMerge>
    </filter>

    <!-- Isometric Grid Pattern -->
    <pattern id="iso-grid" width="60" height="35" patternUnits="userSpaceOnUse" patternTransform="scale(2)">
       <path d="M 0 17.5 L 30 0 L 60 17.5 L 30 35 Z" fill="none" stroke="#e2e8f0" stroke-width="1"/>
       <!-- ANIMATION: Grid Flow -->
       <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 35" dur="4s" repeatCount="indefinite" additive="sum"/>
    </pattern>

    <!-- Gradient for Background -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Animations -->
    <!-- Breathing/Squashing animation for agents -->
    <animateTransform id="breathe" attributeName="transform" type="scale" values="1 1; 1.02 0.98; 1 1" dur="3s" repeatCount="indefinite" additive="sum"/>
  </defs>

  <!-- Background Surface -->
  <rect width="100%" height="100%" fill="url(#bg-gradient)"/>
  <rect width="100%" height="100%" fill="url(#iso-grid)" opacity="0.6"/>

  <!-- Main Scene Group: Centered and Isometric-ish projection -->
  <g transform="translate(600, 300)">

    <!-- CONNECTIONS (Ropes on the floor) -->
    <!-- Triangle formation connections -->
    <g stroke="#cbd5e1" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#clay-rope)">
       <!-- Top to Right -->
       <path d="M 0 -100 Q 150 0 200 100" />
       <!-- Right to Left -->
       <path d="M 200 100 Q 0 200 -200 100" />
       <!-- Left to Top -->
       <path d="M -200 100 Q -150 0 0 -100" />
    </g>

    <!-- TRAFFIC (Rolling Clay Balls) -->
    <!-- EXISTING: Clockwise Flow -->
    <!-- Ball 1: Top -> Right -->
    <circle r="8" fill="#facc15" filter="url(#clay-material)">
        <animateMotion dur="3s" repeatCount="indefinite" path="M 0 -100 Q 150 0 200 100" keyPoints="0.1;0.9" keyTimes="0;1" calcMode="linear"/>
    </circle>
    <!-- Ball 2: Right -> Left -->
    <circle r="8" fill="#facc15" filter="url(#clay-material)">
        <animateMotion dur="4s" repeatCount="indefinite" path="M 200 100 Q 0 200 -200 100" keyPoints="0.1;0.9" keyTimes="0;1" calcMode="linear"/>
    </circle>
    <!-- Ball 3: Left -> Top -->
    <circle r="8" fill="#facc15" filter="url(#clay-material)">
        <animateMotion dur="3.5s" repeatCount="indefinite" path="M -200 100 Q -150 0 0 -100" keyPoints="0.1;0.9" keyTimes="0;1" calcMode="linear"/>
    </circle>

    <!-- NEW: Counter-Clockwise Flow (Agent Responses) -->
    <!-- Ball 4: Right -> Top (Orange response from B) -->
    <circle r="6" fill="#f97316" filter="url(#clay-material)">
        <animateMotion dur="4.5s" repeatCount="indefinite" path="M 0 -100 Q 150 0 200 100" keyPoints="0.9;0.1" keyTimes="0;1" calcMode="linear"/>
    </circle>
    <!-- Ball 5: Left -> Right (Green response from C) -->
    <circle r="6" fill="#22c55e" filter="url(#clay-material)">
        <animateMotion dur="5s" repeatCount="indefinite" path="M 200 100 Q 0 200 -200 100" keyPoints="0.9;0.1" keyTimes="0;1" calcMode="linear"/>
    </circle>
    <!-- Ball 6: Top -> Left (Blue response from A) -->
    <circle r="6" fill="#3b82f6" filter="url(#clay-material)">
        <animateMotion dur="3.8s" repeatCount="indefinite" path="M -200 100 Q -150 0 0 -100" keyPoints="0.9;0.1" keyTimes="0;1" calcMode="linear"/>
    </circle>


    <!-- AGENT 1: TOP (The "Architect" - Blue) -->
    <g transform="translate(0, -100)">
       <!-- Shadow base -->
       <ellipse cx="0" cy="50" rx="60" ry="20" fill="#000000" opacity="0.1">
           <!-- ANIMATION: Shadow Pulse -->
           <animate attributeName="rx" values="60;55;60" dur="4s" repeatCount="indefinite"/>
           <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
       </ellipse>
       
       <!-- Body Group (Bouncing) -->
       <g>
         <animateTransform attributeName="transform" type="scale" values="1 1; 1.05 0.95; 1 1" dur="4s" repeatCount="indefinite" />
         <!-- Clay Body -->
         <path d="M -40 0 C -40 -50 40 -50 40 0 C 40 40 -40 40 -40 0" fill="#3b82f6" filter="url(#clay-material)" transform="translate(0, -10)"/>
         <!-- Eyes -->
         <g transform="translate(0, -15)">
            <circle cx="-12" cy="0" r="8" fill="#ffffff">
                <!-- ANIMATION: Blink Left -->
                <animate attributeName="ry" values="8;1;8" dur="4.5s" keyTimes="0;0.05;0.1" repeatCount="indefinite"/>
            </circle>
            <circle cx="-12" cy="0" r="3" fill="#1e3a8a">
                <animate attributeName="ry" values="3;0.5;3" dur="4.5s" keyTimes="0;0.05;0.1" repeatCount="indefinite"/>
            </circle>
            <circle cx="12" cy="0" r="8" fill="#ffffff">
                <!-- ANIMATION: Blink Right -->
                <animate attributeName="ry" values="8;1;8" dur="4.5s" keyTimes="0;0.05;0.1" repeatCount="indefinite"/>
            </circle>
            <circle cx="12" cy="0" r="3" fill="#1e3a8a">
                <animate attributeName="ry" values="3;0.5;3" dur="4.5s" keyTimes="0;0.05;0.1" repeatCount="indefinite"/>
            </circle>
         </g>
         <!-- Label -->
         <g transform="translate(90, -30)">
            <!-- ANIMATION: Float -->
            <animateTransform attributeName="transform" type="translate" values="90 -30; 90 -35; 90 -30" dur="6s" repeatCount="indefinite" additive="replace"/>
            <rect x="-10" y="-20" width="140" height="40" rx="10" fill="#ffffff" filter="url(#clay-material)"/>
            <text x="60" y="5" text-anchor="middle" font-size="16" fill="#1e3a8a" font-weight="bold">Agent A</text>
            <text x="60" y="25" text-anchor="middle" font-size="12" fill="#64748b">Frontend</text>
         </g>
       </g>
    </g>

    <!-- AGENT 2: RIGHT (The "Builder" - Orange) -->
    <g transform="translate(200, 100)">
       <!-- Shadow base -->
       <ellipse cx="0" cy="50" rx="60" ry="20" fill="#000000" opacity="0.1">
           <!-- ANIMATION: Shadow Pulse -->
           <animate attributeName="rx" values="60;55;60" dur="4s" begin="1s" repeatCount="indefinite"/>
           <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" begin="1s" repeatCount="indefinite"/>
       </ellipse>
       
       <!-- Body Group -->
       <g>
         <animateTransform attributeName="transform" type="scale" values="1 1; 1.05 0.95; 1 1" dur="4s" begin="1s" repeatCount="indefinite" />
         <!-- Clay Body (Cube-ish) -->
         <path d="M -35 -30 L 35 -30 L 35 30 L -35 30 Z" fill="#f97316" filter="url(#clay-material)" stroke-linejoin="round" stroke-width="20" stroke="#f97316"/>
         <!-- Eyes -->
         <g transform="translate(0, -5)">
            <circle cx="-12" cy="0" r="8" fill="#ffffff">
                <!-- ANIMATION: Blink Left -->
                <animate attributeName="ry" values="8;1;8" dur="5s" begin="2s" keyTimes="0;0.05;0.1" repeatCount="indefinite"/>
            </circle>
            <circle cx="-12" cy="0" r="3" fill="#7c2d12">
                <animate attributeName="ry" values="3;0.5;3" dur="5s" begin="2s" keyTimes="0;0.05;0.1" repeatCount="indefinite"/>
            </circle>
            <circle cx="12" cy="0" r="8" fill="#ffffff">
                <!-- ANIMATION: Blink Right -->
                <animate attributeName="ry" values="8;1;8" dur="5s" begin="2s" keyTimes="0;0.05;0.1" repeatCount="indefinite"/>
            </circle>
            <circle cx="12" cy="0" r="3" fill="#7c2d12">
                <animate attributeName="ry" values="3;0.5;3" dur="5s" begin="2s" keyTimes="0;0.05;0.1" repeatCount="indefinite"/>
            </circle>
         </g>
         <!-- Label -->
         <g transform="translate(90, -10)">
            <!-- ANIMATION: Float -->
            <animateTransform attributeName="transform" type="translate" values="90 -10; 90 -15; 90 -10" dur="5.5s" begin="1s" repeatCount="indefinite" additive="replace"/>
            <rect x="-10" y="-20" width="140" height="40" rx="10" fill="#ffffff" filter="url(#clay-material)"/>
            <text x="60" y="5" text-anchor="middle" font-size="16" fill="#9a3412" font-weight="bold">Agent B</text>
            <text x="60" y="25" text-anchor="middle" font-size="12" fill="#64748b">Backend</text>
         </g>
       </g>
    </g>

    <!-- AGENT 3: LEFT (The "Inspector" - Green) -->
    <g transform="translate(-200, 100)">
       <!-- Shadow base -->
       <ellipse cx="0" cy="50" rx="60" ry="20" fill="#000000" opacity="0.1">
           <!-- ANIMATION: Shadow Pulse -->
           <animate attributeName="rx" values="60;55;60" dur="4s" begin="2s" repeatCount="indefinite"/>
           <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" begin="2s" repeatCount="indefinite"/>
       </ellipse>
       
       <!-- Body Group -->
       <g>
         <animateTransform attributeName="transform" type="scale" values="1 1; 1.05 0.95; 1 1" dur="4s" begin="2s" repeatCount="indefinite" />
         <!-- Clay Body (Triangle-ish) -->
         <path d="M 0 -50 L 40 20 L -40 20 Z" fill="#22c55e" filter="url(#clay-material)" stroke-linejoin="round" stroke-width="20" stroke="#22c55e"/>
         <!-- One Eye (Cyclops) -->
         <g transform="translate(0, -10)">
            <circle cx="0" cy="0" r="14" fill="#ffffff">
                 <!-- ANIMATION: Blink -->
                 <animate attributeName="ry" values="14;2;14" dur="4.2s" begin="1s" keyTimes="0;0.05;0.1" repeatCount="indefinite"/>
            </circle>
            <circle cx="0" cy="0" r="5" fill="#14532d">
                 <animate attributeName="ry" values="5;1;5" dur="4.2s" begin="1s" keyTimes="0;0.05;0.1" repeatCount="indefinite"/>
            </circle>
         </g>
         <!-- Label -->
         <g transform="translate(-160, -10)">
            <!-- ANIMATION: Float -->
            <animateTransform attributeName="transform" type="translate" values="-160 -10; -160 -15; -160 -10" dur="6.5s" begin="0.5s" repeatCount="indefinite" additive="replace"/>
            <rect x="-10" y="-20" width="140" height="40" rx="10" fill="#ffffff" filter="url(#clay-material)"/>
            <text x="60" y="5" text-anchor="middle" font-size="16" fill="#14532d" font-weight="bold">Agent C</text>
            <text x="60" y="25" text-anchor="middle" font-size="12" fill="#64748b">QA / Test</text>
         </g>
       </g>
    </g>

  </g>

  <!-- Title & Info Overlay -->
  <g transform="translate(50, 50)">
    <!-- ANIMATION: Float -->
    <animateTransform attributeName="transform" type="translate" values="50 50; 50 55; 50 50" dur="8s" repeatCount="indefinite" additive="replace"/>
    <!-- Title Card -->
    <g filter="url(#clay-material)">
        <rect x="0" y="0" width="380" height="100" rx="15" fill="#ffffff" />
        <text x="30" y="45" font-family="sans-serif" font-weight="900" font-size="32" fill="#334155">PEER-TO-PEER</text>
        <text x="30" y="75" font-family="sans-serif" font-size="18" fill="#64748b">Decentralized Collaboration</text>
    </g>
  </g>

  <!-- Info Box: Coordination Cost -->
  <g transform="translate(820, 50)">
     <!-- ANIMATION: Float -->
     <animateTransform attributeName="transform" type="translate" values="820 50; 820 45; 820 50" dur="7s" begin="1s" repeatCount="indefinite" additive="replace"/>
     <g filter="url(#clay-material)">
        <rect x="0" y="0" width="330" height="120" rx="15" fill="#fef08a" />
        
        <text x="25" y="35" font-family="sans-serif" font-weight="bold" font-size="14" fill="#854d0e">COORDINATION COST</text>
        
        <!-- Formula Visualization -->
        <text x="25" y="75" font-family="serif" font-style="italic" font-size="40" fill="#a16207">
            O(n²)
            <!-- ANIMATION: Color Pulse -->
            <animate attributeName="fill" values="#a16207;#dc2626;#a16207" dur="2s" repeatCount="indefinite"/>
        </text>
        
        <text x="140" y="65" font-family="sans-serif" font-size="12" fill="#854d0e">
           <tspan x="140" dy="0">Costs grow rapidly</tspan>
           <tspan x="140" dy="16">as you add agents.</tspan>
        </text>
     </g>
  </g>
  
  <!-- Subtitle / Hint at bottom -->
  <text x="600" y="640" text-anchor="middle" font-size="16" fill="#94a3b8" font-style="italic">"Like a flat team meeting—everyone talks to everyone."</text>

</svg>