<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">How Tools Shape Context</title>
  <desc id="desc">Tool definitions are static context sent on every request. Tool return values are dynamic context appended to messages and can grow quickly.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
  </defs>

  <style><![CDATA[
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }

    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; fill: #64748b; }

    .label { font-size: 12px; font-weight: 700; fill: #334155; }
    .small { font-size: 11px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 11px; fill: #334155; }

    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .box-static { fill: #eff6ff; stroke: #bfdbfe; }
    .box-dynamic { fill: #f1f5f9; stroke: #cbd5e1; }
    .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .pill-blue { fill: #eff6ff; stroke: #bfdbfe; }
    .pill-red { fill: #fef2f2; stroke: #fecaca; }

    .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.2; stroke-dasharray: 7 7; marker-end: url(#arrow-blue); animation: dash 1.6s linear infinite; }
    .arrow-muted { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }

    @keyframes dash { to { stroke-dashoffset: -28; } }
  ]]></style>

  <!-- Background + panel -->
  <rect class="bg" x="0" y="0" width="1200" height="420" />
  <rect class="panel" x="24" y="24" width="1152" height="372" rx="16" filter="url(#shadow)" />

  <!-- Header -->
  <text class="title" x="48" y="64">How Tools Shape Context</text>
  <text class="subtitle" x="48" y="88">Definitions are static (always sent). Results are dynamic (appended, can bloat fast).</text>
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#e2e8f0" stroke-width="2" />

  <!-- Left: Request envelope -->
  <g transform="translate(60, 126)">
    <rect class="box" x="0" y="0" width="360" height="178" rx="12" filter="url(#shadow-sm)" />
    <text class="kicker" x="16" y="26">→ REQUEST (EVERY ROUND)</text>

    <!-- Static context block -->
    <g transform="translate(16, 40)">
      <rect class="box-static" x="0" y="0" width="328" height="64" rx="10" />
      <text class="label" x="14" y="22" fill="#2563eb">Static: tool definitions</text>
      <text class="mono" x="14" y="42">tools[]: read_file, write_file, bash, ...</text>
      <text class="small" x="14" y="58">Sent on every API call</text>
    </g>

    <!-- Dynamic context block -->
    <g transform="translate(16, 112)">
      <rect class="box-dynamic" x="0" y="0" width="328" height="50" rx="10" />
      <text class="label" x="14" y="22">Dynamic: messages + tool results</text>
      <text class="mono" x="14" y="42">messages[] + tool: "..."</text>
    </g>
  </g>

  <!-- Middle: LLM -->
  <g>
    <circle cx="600" cy="215" r="74" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow-sm)" />
    <text x="600" y="206" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">LLM</text>
    <text x="600" y="226" text-anchor="middle" class="small">Plans + emits tool_calls</text>
    <circle cx="600" cy="215" r="52" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.45">
      <animate attributeName="r" values="52;60;52" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.45;0.10;0.45" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Right: Agent runtime -->
  <g transform="translate(780, 126)">
    <rect class="box" x="0" y="0" width="360" height="178" rx="12" filter="url(#shadow-sm)" />
    <text class="kicker" x="16" y="26">AGENT RUNTIME (LOCAL)</text>
    <text class="small" x="16" y="48">Executes tools on your machine and returns results as context.</text>

    <g transform="translate(16, 66)">
      <rect class="pill-blue" x="0" y="0" width="120" height="30" rx="15" />
      <text x="60" y="20" text-anchor="middle" class="mono" fill="#2563eb">read_file()</text>
    </g>
    <g transform="translate(146, 66)">
      <rect class="pill" x="0" y="0" width="88" height="30" rx="15" />
      <text x="44" y="20" text-anchor="middle" class="mono">grep</text>
    </g>
    <g transform="translate(244, 66)">
      <rect class="pill" x="0" y="0" width="88" height="30" rx="15" />
      <text x="44" y="20" text-anchor="middle" class="mono">ls</text>
    </g>

    <g transform="translate(16, 106)">
      <rect class="pill-red" x="0" y="0" width="136" height="30" rx="15" />
      <text x="68" y="20" text-anchor="middle" class="mono" fill="#b91c1c">write_file()</text>
    </g>
    <g transform="translate(162, 106)">
      <rect class="pill-red" x="0" y="0" width="80" height="30" rx="15" />
      <text x="40" y="20" text-anchor="middle" class="mono" fill="#b91c1c">bash</text>
    </g>
    <g transform="translate(252, 106)">
      <text class="small" x="0" y="20">(mutating ops)</text>
    </g>
  </g>

  <!-- Arrows: request -> LLM -> agent -> request -->
  <path class="arrow" d="M 420 215 L 526 215" />
  <text x="472" y="201" text-anchor="middle" class="small">system + messages</text>

  <path class="arrow-blue" d="M 674 215 L 780 215" />
  <text x="727" y="201" text-anchor="middle" class="small" fill="#2563eb">tool_calls JSON</text>

  <!-- Return path (tool results appended) -->
  <path id="returnPath" class="arrow-muted" d="M 960 304 C 960 364 240 364 240 304" />
  <text x="600" y="374" text-anchor="middle" class="small">tool result → appended to messages[] (next round)</text>

  <!-- Animated packets -->
  <circle r="4" fill="#2563eb" opacity="0.85">
    <animateMotion path="M 674 215 L 780 215" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#64748b" opacity="0.65">
    <animateMotion path="M 420 215 L 526 215" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#94a3b8" opacity="0.75">
    <animateMotion path="M 960 304 C 960 364 240 364 240 304" dur="3.2s" repeatCount="indefinite" />
  </circle>

  <!-- Context window budget bar -->
  <g transform="translate(60, 320)">
    <text class="kicker" x="0" y="0">CONTEXT WINDOW BUDGET</text>
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="1080" height="34" rx="10" fill="#f1f5f9" stroke="#e2e8f0" />
      <rect x="0" y="0" width="330" height="34" rx="10" fill="#dbeafe" stroke="#bfdbfe" />
      <rect x="330" y="0" width="250" height="34" rx="0" fill="#e2e8f0" opacity="0.9">
        <animate attributeName="width" values="220;600;220" dur="3.2s" repeatCount="indefinite" />
      </rect>
      <line x1="330" y1="6" x2="330" y2="28" stroke="#94a3b8" stroke-width="2" opacity="0.7" />

      <text x="14" y="22" class="small" fill="#2563eb">Static baseline</text>
      <text x="360" y="22" class="small">Dynamic grows fastest</text>
    </g>
    <text class="small" x="0" y="64">Trim at tool layer: limit lines • paginate long lists • prefer structured output</text>
  </g>
</svg>
