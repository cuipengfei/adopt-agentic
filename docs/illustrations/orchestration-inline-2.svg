<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Parallel session governance playbook</title>
  <desc id="desc">A decision on file overlap, followed by a four-step governance flow: partition, sync via filesystem, converge conflicts, and accept after merge.</desc>

  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#64748B" flood-opacity="0.14"/>
    </filter>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#14B8A6"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#4338CA"/>
    </marker>
    <marker id="arrow-pink" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#F472B6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#FBBF24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="24" fill="#F8FAFC"/>

  <!-- Header -->
  <g transform="translate(40, 34)">
    <text x="0" y="0" font-size="26" font-weight="900" fill="#1E293B">PARALLEL SESSION GOVERNANCE</text>
    <text x="0" y="32" font-size="14" font-weight="600" fill="#64748B">When multiple sessions touch the same repo, governance beats raw parallelism.</text>
  </g>

  <!-- Decision Card: Overlap -->
  <g transform="translate(40, 90)">
    <rect width="1120" height="140" rx="16" fill="#FFFFFF" filter="url(#card-shadow)"/>
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 1104 0 A 16 16 0 0 1 1120 16 L 1120 52 L 0 52 Z" fill="#F1F5F9"/>
    <text x="24" y="34" font-size="14" font-weight="900" fill="#334155">Decision: file overlap?</text>
    <text x="214" y="34" font-size="12" fill="#64748B">Treat “overlap” as a red flag for parallel sessions.</text>

    <!-- NO OVERLAP -->
    <g transform="translate(24, 70)">
      <text x="0" y="0" font-size="12" font-weight="900" fill="#0F766E">NO OVERLAP</text>
      <text x="92" y="0" font-size="12" fill="#64748B">(disjoint file sets)</text>

      <!-- two file icons -->
      <g transform="translate(0, 14)">
        <path d="M 10 0 H 54 L 66 12 V 64 H 10 Z" fill="#ECFDF5" stroke="#14B8A6" stroke-width="2"/>
        <path d="M 54 0 V 12 H 66" fill="none" stroke="#14B8A6" stroke-width="2"/>
        <text x="38" y="42" font-size="12" font-weight="900" fill="#0F766E" text-anchor="middle">A</text>
      </g>
      <g transform="translate(86, 14)">
        <path d="M 10 0 H 54 L 66 12 V 64 H 10 Z" fill="#ECFDF5" stroke="#14B8A6" stroke-width="2"/>
        <path d="M 54 0 V 12 H 66" fill="none" stroke="#14B8A6" stroke-width="2"/>
        <text x="38" y="42" font-size="12" font-weight="900" fill="#0F766E" text-anchor="middle">B</text>
      </g>

      <path d="M 176 46 L 270 46" stroke="#14B8A6" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" marker-end="url(#arrow-teal)">
        <animate attributeName="stroke-dashoffset" values="0;18" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <rect x="286" y="26" width="150" height="40" rx="20" fill="#14B8A6"/>
      <text x="361" y="51" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">PARALLELIZE</text>
    </g>

    <!-- OVERLAP -->
    <g transform="translate(560, 70)">
      <text x="0" y="0" font-size="12" font-weight="900" fill="#BE185D">OVERLAP</text>
      <text x="64" y="0" font-size="12" fill="#64748B">(same files/functions)</text>

      <!-- overlap venn (as file sets) -->
      <g transform="translate(0, 24)">
        <circle cx="46" cy="32" r="28" fill="#FDF2F8" stroke="#F472B6" stroke-width="2"/>
        <circle cx="78" cy="32" r="28" fill="#FDF2F8" stroke="#F472B6" stroke-width="2"/>
        <text x="46" y="37" font-size="12" font-weight="900" fill="#BE185D" text-anchor="middle">A</text>
        <text x="78" y="37" font-size="12" font-weight="900" fill="#BE185D" text-anchor="middle">B</text>
      </g>

      <path d="M 130 46 L 224 46" stroke="#F472B6" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" marker-end="url(#arrow-pink)">
        <animate attributeName="stroke-dashoffset" values="0;18" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <rect x="240" y="26" width="260" height="40" rx="20" fill="#F472B6"/>
      <text x="370" y="44" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">SERIALIZE / EXTRACT SHARED PART</text>
    </g>
  </g>

  <!-- Flow: governance steps -->
  <g transform="translate(40, 250)">
    <text x="0" y="-12" font-size="14" font-weight="900" fill="#334155">Playbook (4 steps)</text>

    <!-- Step cards (4 across) -->
    <g transform="translate(0, 0)">
      <!-- STEP 1 -->
      <g>
        <rect width="265" height="230" rx="16" fill="#FFFFFF" filter="url(#card-shadow)"/>
        <path d="M 0 16 A 16 16 0 0 1 16 0 L 249 0 A 16 16 0 0 1 265 16 L 265 54 L 0 54 Z" fill="#F0FDFA"/>
        <circle cx="28" cy="30" r="14" fill="#14B8A6"/>
        <text x="28" y="35" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
        <text x="52" y="35" font-size="14" font-weight="900" fill="#0F766E">Partition work</text>

        <text x="18" y="84" font-size="12" font-weight="800" fill="#1E293B">Goal</text>
        <text x="18" y="104" font-size="12" fill="#64748B">Disjoint ownership by file/module.</text>

        <text x="18" y="136" font-size="12" font-weight="800" fill="#1E293B">Heuristic</text>
        <text x="18" y="156" font-size="12" fill="#64748B">If overlap exists, do it sequentially.</text>

        <!-- icon: split grid -->
        <g transform="translate(190, 96)">
          <rect x="0" y="0" width="18" height="18" rx="4" fill="#14B8A6" opacity="0.25"/>
          <rect x="22" y="0" width="18" height="18" rx="4" fill="#14B8A6" opacity="0.6"/>
          <rect x="0" y="22" width="18" height="18" rx="4" fill="#14B8A6" opacity="0.6"/>
          <rect x="22" y="22" width="18" height="18" rx="4" fill="#14B8A6" opacity="0.25"/>
        </g>
      </g>

      <!-- Arrow 1 -->
      <path d="M 275 115 L 310 115" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" marker-end="url(#arrow)">
        <animate attributeName="stroke-dashoffset" values="0;18" dur="1.2s" repeatCount="indefinite"/>
      </path>

      <!-- STEP 2 -->
      <g transform="translate(285, 0)">
        <rect width="265" height="230" rx="16" fill="#FFFFFF" filter="url(#card-shadow)"/>
        <path d="M 0 16 A 16 16 0 0 1 16 0 L 249 0 A 16 16 0 0 1 265 16 L 265 54 L 0 54 Z" fill="#EEF2FF"/>
        <circle cx="28" cy="30" r="14" fill="#4338CA"/>
        <text x="28" y="35" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="52" y="35" font-size="14" font-weight="900" fill="#4338CA">Sync state</text>

        <text x="18" y="84" font-size="12" font-weight="800" fill="#1E293B">Shared bus</text>
        <text x="18" y="104" font-size="12" fill="#64748B">Filesystem (files land on disk).</text>

        <text x="18" y="136" font-size="12" font-weight="800" fill="#1E293B">Non-obvious</text>
        <text x="18" y="156" font-size="12" fill="#64748B">Context does not auto-sync. Relay manually.</text>

        <!-- icon: bus line (animated) -->
        <g transform="translate(18, 182)">
          <path d="M 0 0 L 226 0" stroke="#4338CA" stroke-width="6" stroke-linecap="round" opacity="0.15"/>
          <path d="M 0 0 L 226 0" stroke="#4338CA" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 14" stroke-dashoffset="0" opacity="0.7">
            <animate attributeName="stroke-dashoffset" values="0;32" dur="1.4s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>

      <!-- Arrow 2 -->
      <path d="M 560 115 L 595 115" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" marker-end="url(#arrow)">
        <animate attributeName="stroke-dashoffset" values="0;18" dur="1.2s" begin="0.1s" repeatCount="indefinite"/>
      </path>

      <!-- STEP 3 -->
      <g transform="translate(570, 0)">
        <rect width="265" height="230" rx="16" fill="#FFFFFF" filter="url(#card-shadow)"/>
        <path d="M 0 16 A 16 16 0 0 1 16 0 L 249 0 A 16 16 0 0 1 265 16 L 265 54 L 0 54 Z" fill="#FDF2F8"/>
        <circle cx="28" cy="30" r="14" fill="#F472B6"/>
        <text x="28" y="35" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
        <text x="52" y="35" font-size="14" font-weight="900" fill="#BE185D">Converge conflicts</text>

        <text x="18" y="84" font-size="12" font-weight="800" fill="#1E293B">Options</text>
        <text x="18" y="104" font-size="12" fill="#64748B">First-come wins, or human arbitration.</text>

        <text x="18" y="136" font-size="12" font-weight="800" fill="#1E293B">Signal</text>
        <text x="18" y="156" font-size="12" fill="#64748B">Frequent conflicts = bad partitioning.</text>

        <!-- icon: merge forks -->
        <g transform="translate(190, 92)" fill="none" stroke="#F472B6" stroke-width="4" stroke-linecap="round">
          <path d="M 0 0 V 38"/>
          <path d="M -14 0 V 18 C -14 28 -6 34 0 38"/>
          <path d="M 14 0 V 18 C 14 28 6 34 0 38"/>
          <circle cx="-14" cy="0" r="6" fill="#FDF2F8" stroke="#F472B6"/>
          <circle cx="14" cy="0" r="6" fill="#FDF2F8" stroke="#F472B6"/>
          <circle cx="0" cy="38" r="6" fill="#FDF2F8" stroke="#F472B6"/>
        </g>
      </g>

      <!-- Arrow 3 -->
      <path d="M 845 115 L 880 115" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" marker-end="url(#arrow)">
        <animate attributeName="stroke-dashoffset" values="0;18" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      </path>

      <!-- STEP 4 -->
      <g transform="translate(855, 0)">
        <rect width="265" height="230" rx="16" fill="#FFFFFF" filter="url(#card-shadow)"/>
        <path d="M 0 16 A 16 16 0 0 1 16 0 L 249 0 A 16 16 0 0 1 265 16 L 265 54 L 0 54 Z" fill="#FFFBEB"/>
        <circle cx="28" cy="30" r="14" fill="#FBBF24"/>
        <text x="28" y="35" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text>
        <text x="52" y="35" font-size="14" font-weight="900" fill="#D97706">Unified acceptance</text>

        <text x="18" y="84" font-size="12" font-weight="800" fill="#1E293B">Rule</text>
        <text x="18" y="104" font-size="12" fill="#64748B">Tests per branch are not enough.</text>

        <text x="18" y="136" font-size="12" font-weight="800" fill="#1E293B">After merge</text>
        <text x="18" y="156" font-size="12" fill="#64748B">Full build + full test suite.</text>

        <!-- icon: check badge (pulse) -->
        <g transform="translate(202, 108)">
          <circle cx="0" cy="0" r="18" fill="#FBBF24"/>
          <path d="M -8 0 L -2 6 L 10 -6" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="0" cy="0" r="22" fill="none" stroke="#FBBF24" stroke-width="2" opacity="0.6">
            <animate attributeName="r" values="18;30" dur="1.6s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
    </g>
  </g>
</svg>
