<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">MCP in one picture: client, server, transport</title>
  <desc id="desc">A diagram showing an agent-side MCP Client connecting to either a local MCP Server via stdio or a remote MCP Server via Streamable HTTP. Both expose tools that reach external systems.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#14b8a6"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <style><![CDATA[
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }

    .title { font-size: 20px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .kicker { font-size: 11px; font-weight: 800; letter-spacing: 0.8px; fill: #64748b; }
    .label { font-size: 12px; font-weight: 800; fill: #334155; }
    .small { font-size: 11px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 11px; fill: #334155; }

    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .card-agent { fill: #eef2ff; stroke: #a5b4fc; }
    .card-local { fill: #f0fdfa; stroke: #5eead4; }
    .card-remote { fill: #eff6ff; stroke: #93c5fd; }
    .card-ext { fill: #f1f5f9; stroke: #cbd5e1; }

    .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .pill-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 11px; font-weight: 700; fill: #0f172a; }

    .arrow-teal { fill: none; stroke: #14b8a6; stroke-width: 2.4; stroke-dasharray: 7 7; marker-end: url(#arrow-teal); animation: dash 1.6s linear infinite; }
    .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.4; stroke-dasharray: 7 7; marker-end: url(#arrow-blue); animation: dash 1.6s linear infinite; }
    .arrow-muted { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow-muted); }

    @keyframes dash { to { stroke-dashoffset: -28; } }
  ]]></style>

  <!-- Background + panel -->
  <rect class="bg" x="0" y="0" width="1200" height="420"/>
  <rect class="panel" x="24" y="24" width="1152" height="372" rx="16" filter="url(#shadow)"/>

  <!-- Header -->
  <text class="title" x="48" y="64">MCP in One Picture</text>
  <text class="subtitle" x="48" y="88">Same protocol, two transports: <tspan font-weight="700" fill="#0f172a">stdio</tspan> (local) and <tspan font-weight="700" fill="#0f172a">Streamable HTTP</tspan> (remote)</text>
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Agent card -->
  <g transform="translate(60, 136)">
    <rect class="card card-agent" x="0" y="0" width="340" height="228" rx="14" filter="url(#shadow-sm)"/>
    <text class="kicker" x="16" y="26">INSIDE THE AGENT</text>
    <text class="label" x="16" y="52">MCP Client</text>
    <text class="small" x="16" y="74">Discovers servers, negotiates capabilities, calls tools.</text>
    <text class="small" x="16" y="94">Wraps results as <tspan class="mono">role: "tool"</tspan> messages.</text>

    <g transform="translate(16, 120)">
      <rect class="pill" x="0" y="0" width="150" height="30" rx="15"/>
      <text class="pill-mono" x="75" y="20" text-anchor="middle">tools[] schema</text>
    </g>
    <g transform="translate(180, 120)">
      <rect class="pill" x="0" y="0" width="144" height="30" rx="15"/>
      <text class="pill-mono" x="72" y="20" text-anchor="middle">tool_calls</text>
    </g>
    <text class="small" x="16" y="178">LLM sees a single tool interface</text>
    <text class="small" x="16" y="198">(built-in and MCP tools look the same).</text>
  </g>

  <!-- Local server card -->
  <g transform="translate(440, 140)">
    <rect class="card card-local" x="0" y="0" width="340" height="112" rx="14" filter="url(#shadow-sm)"/>
    <text class="kicker" x="16" y="26">MCP SERVER (LOCAL PROCESS)</text>
    <text class="label" x="16" y="50">Transport: stdio</text>
    <text class="small" x="16" y="72">Agent spawns and manages the process lifecycle.</text>

    <g transform="translate(16, 80)">
      <rect class="pill" x="0" y="0" width="132" height="26" rx="13"/>
      <text class="pill-mono" x="66" y="18" text-anchor="middle">docs_search()</text>
    </g>
    <g transform="translate(158, 80)">
      <rect class="pill" x="0" y="0" width="152" height="26" rx="13"/>
      <text class="pill-mono" x="76" y="18" text-anchor="middle">postgres_query()</text>
    </g>
  </g>

  <!-- Remote server card -->
  <g transform="translate(440, 270)">
    <rect class="card card-remote" x="0" y="0" width="340" height="112" rx="14" filter="url(#shadow-sm)"/>
    <text class="kicker" x="16" y="26">MCP SERVER (REMOTE SERVICE)</text>
    <text class="label" x="16" y="50">Transport: Streamable HTTP</text>
    <text class="small" x="16" y="72">Suited for shared access and long-running services.</text>

    <g transform="translate(16, 80)">
      <rect class="pill" x="0" y="0" width="132" height="26" rx="13"/>
      <text class="pill-mono" x="66" y="18" text-anchor="middle">search_jira()</text>
    </g>
    <g transform="translate(158, 80)">
      <rect class="pill" x="0" y="0" width="140" height="26" rx="13"/>
      <text class="pill-mono" x="70" y="18" text-anchor="middle">query_slack()</text>
    </g>
  </g>

  <!-- External systems card -->
  <g transform="translate(820, 160)">
    <rect class="card card-ext" x="0" y="0" width="320" height="204" rx="14" filter="url(#shadow-sm)"/>
    <text class="kicker" x="16" y="26">EXTERNAL SYSTEMS</text>
    <text class="small" x="16" y="48">SaaS, internal APIs, databases, web…</text>

    <g transform="translate(16, 70)">
      <circle cx="18" cy="18" r="14" fill="#ffffff" stroke="#94a3b8"/>
      <text x="18" y="22" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">J</text>
      <text class="label" x="44" y="23">Jira</text>
    </g>
    <g transform="translate(16, 112)">
      <circle cx="18" cy="18" r="14" fill="#ffffff" stroke="#94a3b8"/>
      <text x="18" y="22" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">S</text>
      <text class="label" x="44" y="23">Slack</text>
    </g>
    <g transform="translate(16, 154)">
      <circle cx="18" cy="18" r="14" fill="#ffffff" stroke="#94a3b8"/>
      <text x="18" y="22" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a">API</text>
      <text class="label" x="44" y="23">Internal API</text>
    </g>
  </g>

  <!-- Transport arrows: Agent → Servers -->
  <path class="arrow-teal" d="M 400 196 C 418 196 422 196 440 196"/>
  <path class="arrow-blue" d="M 400 326 C 418 326 422 326 440 326"/>

  <text class="mono" x="415" y="178" fill="#0f766e">stdio</text>
  <text class="mono" x="415" y="308" fill="#2563eb">Streamable HTTP</text>

  <!-- Servers → External systems -->
  <path class="arrow-muted" d="M 780 196 C 802 196 806 214 820 214"/>
  <path class="arrow-muted" d="M 780 326 C 802 326 806 300 820 300"/>

  <!-- Animated packets -->
  <circle r="4" fill="#14b8a6" opacity="0.9">
    <animateMotion path="M 400 196 C 418 196 422 196 440 196" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#2563eb" opacity="0.9">
    <animateMotion path="M 400 326 C 418 326 422 326 440 326" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#64748b" opacity="0.65">
    <animateMotion path="M 780 196 C 802 196 806 214 820 214" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#64748b" opacity="0.65">
    <animateMotion path="M 780 326 C 802 326 806 300 820 300" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
  </circle>

  <!-- Callout: server can be local or remote -->
  <g transform="translate(444, 118)">
    <rect x="0" y="0" width="332" height="18" rx="9" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="166" y="13" text-anchor="middle" font-size="11" font-weight="800" fill="#c2410c">A “Server” can be a local process or a remote service</text>
  </g>
</svg>
