<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'JetBrains Mono', 'Roboto Mono', monospace">
  <!-- 
    Style: Knolling (Flat-lay, organized, high contrast, physical depth)
    Layout: Bento Grid (Distinct functional zones)
  -->

  <defs>
    <!-- Soft realistic drop shadow for "lifting" objects off the surface -->
    <filter id="shadow-lift" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="8" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Harder shadow for "grounded" objects -->
    <filter id="shadow-ground" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Paper texture pattern for background -->
    <pattern id="grid-paper" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background: Clean Workbench Surface -->
  <rect width="100%" height="100%" fill="#F9FAFB"/>
  <rect width="100%" height="100%" fill="url(#grid-paper)"/>

  <!-- TITLE BLOCK (Top Left) -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="300" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow-ground)"/>
    <rect x="0" y="0" width="8" height="80" fill="#3B82F6">
      <!-- 1. Pulsing Accent Bar -->
      <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
    </rect> <!-- Blue Accent -->
    <text x="30" y="35" font-size="24" font-weight="bold" fill="#1F2937">
        SKILLS SYSTEM
        <!-- 17. Subtle Title Opacity shift -->
        <animate attributeName="opacity" values="1;0.8;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="60" font-size="14" fill="#6B7280">Modular Context Injection</text>
  </g>

  <!-- =========================================
       ZONE 1: THE TOOLBOX (Skills Storage)
       Concept: Organized shelf of capabilities
       ========================================= -->
  <g transform="translate(60, 180)">
    <text x="0" y="-20" font-size="14" font-weight="bold" fill="#9CA3AF" letter-spacing="1">AVAILABLE SKILLS</text>
    
    <!-- Grid of Inactive Skills -->
    <g id="skill-shelf">
      <!-- Skill 1: Git -->
      <g transform="translate(0, 0)">
        <rect width="140" height="100" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow-ground)">
           <!-- 2. Hover/Focus effect on Git Skill -->
           <animate attributeName="stroke" values="#E5E7EB;#BFDBFE;#E5E7EB" dur="4s" begin="0s" repeatCount="indefinite"/>
        </rect>
        <rect x="10" y="10" width="20" height="20" rx="2" fill="#F3F4F6"/>
        <text x="10" y="55" font-size="14" font-weight="bold" fill="#374151">GIT-MASTER</text>
        <text x="10" y="75" font-size="10" fill="#9CA3AF">Version Ctrl</text>
        <line x1="10" y1="85" x2="130" y2="85" stroke="#E5E7EB" stroke-width="2"/>
      </g>
      
      <!-- Skill 2: Vue (Missing from slot, animating) -->
      <rect x="160" y="0" width="140" height="100" rx="4" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
      <text x="230" y="55" font-size="12" text-anchor="middle" fill="#9CA3AF">DEPLOYED</text>

      <!-- Skill 3: Writer -->
      <g transform="translate(0, 120)">
        <rect width="140" height="100" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow-ground)">
           <!-- 3. Hover/Focus effect on Writer Skill -->
           <animate attributeName="stroke" values="#E5E7EB;#BFDBFE;#E5E7EB" dur="4s" begin="1.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="10" y="10" width="20" height="20" rx="2" fill="#F3F4F6"/>
        <text x="10" y="55" font-size="14" font-weight="bold" fill="#374151">WRITER</text>
        <text x="10" y="75" font-size="10" fill="#9CA3AF">Tech Prose</text>
        <line x1="10" y1="85" x2="130" y2="85" stroke="#E5E7EB" stroke-width="2"/>
      </g>

      <!-- Skill 4: SQL -->
      <g transform="translate(160, 120)">
        <rect width="140" height="100" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow-ground)">
           <!-- 4. Hover/Focus effect on SQL Skill -->
           <animate attributeName="stroke" values="#E5E7EB;#BFDBFE;#E5E7EB" dur="4s" begin="2.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="10" y="10" width="20" height="20" rx="2" fill="#F3F4F6"/>
        <text x="10" y="55" font-size="14" font-weight="bold" fill="#374151">DB-ADMIN</text>
        <text x="10" y="75" font-size="10" fill="#9CA3AF">Query Opt</text>
        <line x1="10" y1="85" x2="130" y2="85" stroke="#E5E7EB" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- =========================================
       ZONE 2: THE WORKBENCH (Active Context)
       Concept: The Agent where skills are loaded
       ========================================= -->
  <g transform="translate(450, 160)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#9CA3AF" letter-spacing="1">AGENT CONTEXT</text>
    
    <!-- The Base Agent Board -->
    <rect x="0" y="20" width="400" height="320" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow-ground)"/>
    
    <!-- Base Persona Section -->
    <g transform="translate(20, 40)">
      <rect width="360" height="60" rx="4" fill="#F3F4F6" stroke="#E5E7EB">
        <!-- 5. Subtle breath on Base Persona -->
        <animate attributeName="stroke-opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="20" y="25" font-size="10" font-weight="bold" fill="#6B7280">BASE SYSTEM INSTRUCTION</text>
      <text x="20" y="45" font-size="12" fill="#4B5563">Role: Helpful Assistant</text>
    </g>

    <!-- Dynamic Slot (The "Socket") -->
    <g transform="translate(20, 120)">
      <rect width="360" height="140" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" stroke-dasharray="4,4">
         <!-- 6. Dash array marching ants for the socket -->
         <animate attributeName="stroke-dashoffset" values="0;8;16" dur="2s" repeatCount="indefinite" />
         <!-- 7. Socket pulse when waiting -->
         <animate attributeName="stroke-opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="180" y="70" font-size="12" fill="#93C5FD" text-anchor="middle">SKILL SLOT (PERSISTENT)</text>
    </g>

    <!-- ANIMATION: The "Vue" Skill Flying In -->
    <g>
       <!-- The Flying Card -->
       <g filter="url(#shadow-lift)">
         <!-- Animation path: From shelf (x=220, y=180 global) to slot (x=470, y=280 global) -->
         <!-- Relative to this group's origin (450, 160) -->
         <!-- Start: Shelf is at x=220 relative to 0. So x = 220 - 450 = -230. y = 180 - 160 = 20. -->
         <!-- End: Slot is at x=20, y=120 relative to this group. Center aligned: roughly x=110 (centered in 360 width slot is 110 if width is 140). y=140. -->
         
         <!-- Let's simplify coordinates. Shelf target: (-230, 20). Slot target: (130, 140). -->
         
         <g>
            <animateTransform attributeName="transform" type="translate" 
                              values="-230,20; 130,140; 130,140; -230,20" 
                              keyTimes="0; 0.3; 0.8; 1" 
                              dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0 0 0 0; 0.4 0 0.2 1"/>
            
            <rect width="140" height="100" rx="4" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
            <rect x="10" y="10" width="20" height="20" rx="2" fill="#DBEAFE"/>
            <text x="10" y="55" font-size="14" font-weight="bold" fill="#1E40AF">VUE-PRO</text>
            <text x="10" y="75" font-size="10" fill="#60A5FA">Frontend</text>
            
            <!-- 8. Connection status indicator blinking green -->
            <circle cx="130" cy="85" r="3" fill="#10B981" opacity="0">
               <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.3; 0.8; 1" dur="6s" repeatCount="indefinite"/>
            </circle>

            <!-- Active Indicator Dot -->
            <circle cx="120" cy="20" r="4" fill="#10B981">
               <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.3; 0.8; 1" dur="6s" repeatCount="indefinite"/>
            </circle>
         </g>
       </g>
    </g>

    <!-- Connection Lines appearing when docked -->
    <line x1="180" y1="120" x2="180" y2="140" stroke="#3B82F6" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.3; 0.8; 1" dur="6s" repeatCount="indefinite"/>
        <!-- 19. Added width pulse to connection line -->
        <animate attributeName="stroke-width" values="2;4;2" dur="0.5s" repeatCount="indefinite" begin="1.8s"/>
    </line>
    
    <!-- Output/Action -->
    <g transform="translate(20, 280)">
       <text x="0" y="0" font-size="10" fill="#9CA3AF">BEHAVIOR</text>
       <text x="0" y="20" font-size="14" fill="#374151">Writing Vue 3 Composition API...
         <!-- 10. Text typewriter effect opacity (simple blink) -->
         <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
       </text>
       <!-- Typing cursor -->
       <rect x="250" y="6" width="2" height="16" fill="#3B82F6">
          <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
       </rect>
    </g>
  </g>

  <!-- =========================================
       ZONE 3: TRANSIENT COMMANDS
       Concept: Single-use tools (like a wrench)
       ========================================= -->
  <g transform="translate(900, 180)">
    <text x="0" y="-20" font-size="14" font-weight="bold" fill="#9CA3AF" letter-spacing="1">COMMANDS</text>
    
    <!-- Command Item 1 -->
    <g transform="translate(0, 0)">
       <rect width="240" height="60" rx="30" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1" filter="url(#shadow-ground)">
          <!-- 11. Command 1 Border Pulse -->
          <animate attributeName="stroke-width" values="1;3;1" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
       </rect>
       <circle cx="30" cy="30" r="15" fill="#FEE2E2"/>
       <text x="60" y="35" font-size="14" font-weight="bold" fill="#EF4444">/publish</text>
       <text x="160" y="35" font-size="10" fill="#9CA3AF">One-off</text>
    </g>
    
    <!-- Command Item 2 -->
    <g transform="translate(0, 80)">
       <rect width="240" height="60" rx="30" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1" filter="url(#shadow-ground)">
          <!-- 12. Command 2 Border Pulse (offset) -->
          <animate attributeName="stroke-width" values="1;3;1" dur="2s" begin="1s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" begin="1s" repeatCount="indefinite"/>
       </rect>
       <circle cx="30" cy="30" r="15" fill="#FEE2E2"/>
       <text x="60" y="35" font-size="14" font-weight="bold" fill="#EF4444">/test</text>
       <text x="160" y="35" font-size="10" fill="#9CA3AF">One-off</text>
    </g>
    
    <!-- Comparison Note -->
    <g transform="translate(0, 180)">
        <text x="0" y="0" font-size="12" fill="#6B7280" font-style="italic">Commands are tools.</text>
        <text x="0" y="20" font-size="12" fill="#6B7280" font-style="italic">
        Used once, put back.
        <!-- 18. Emphasis on transient nature -->
        <animate attributeName="fill" values="#6B7280;#EF4444;#6B7280" dur="4s" repeatCount="indefinite"/>
    </text>
    </g>
  </g>

  <!-- =========================================
       LEGEND / FOOTER
       ========================================= -->
  <g transform="translate(60, 580)">
     <line x1="0" y1="0" x2="1080" y2="0" stroke="#E5E7EB" stroke-width="2"/>
     
     <g transform="translate(0, 30)">
         <!-- Legend Item 1 -->
         <rect x="0" y="0" width="16" height="16" rx="2" fill="#3B82F6">
             <!-- 15. Legend indicator blinking -->
             <animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/>
         </rect>
        <text x="25" y="13" font-size="12" fill="#4B5563">SKILL: Persistent "Mode"</text>
        
         <!-- Legend Item 2 -->
         <rect x="250" y="0" width="16" height="16" rx="8" fill="#EF4444">
             <!-- 16. Legend indicator pulsing -->
             <animate attributeName="r" values="8;6;8" dur="2s" repeatCount="indefinite"/> <!-- Note: rect doesn't have r, but this is a placeholder for clarity or maybe convert to circle? No, it's a rect. Let's animate opacity instead. -->
             <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
         </rect>
        <text x="275" y="13" font-size="12" fill="#4B5563">COMMAND: Transient Action</text>
        
        <!-- Tech info -->
        <text x="1080" y="13" font-size="12" fill="#9CA3AF" text-anchor="end">SVG v2.0 • KNOLLING LAYOUT</text>
     </g>
  </g>

</svg>