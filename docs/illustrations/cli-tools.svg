<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" style="background-color: #fdfdfd;">
  <!-- Style: Ikea Manual / Jigsaw Layout -->
  <!-- Concept: Agent assembling modular CLI tools like furniture pieces -->
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&amp;display=swap');
      
      /* Base Styles */
      .stroke-main { fill: #fff; stroke: #1a1a1a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-thin { fill: none; stroke: #1a1a1a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; }
      .fill-shadow { fill: #e6e6e6; }
      .text-label { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 24px; fill: #1a1a1a; text-anchor: middle; letter-spacing: 0.5px; }
      .text-sub { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; fill: #4a4a4a; text-anchor: middle; }
      .text-mono { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #1a1a1a; }
      .step-bubble { fill: #1a1a1a; }
      .step-text { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 32px; fill: #fff; text-anchor: middle; dominant-baseline: middle; }

      /* SVG native animations used instead of CSS keyframes */
    </style>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a1a1a"/>
    </marker>
    
    <clipPath id="screen-clip">
      <rect x="-90" y="-190" width="180" height="130" rx="4" />
    </clipPath>
    <clipPath id="stream-clip">
       <rect x="50" y="60" width="200" height="40" />
    </clipPath>
  </defs>

  <!-- Background: Manual Paper Texture Hint -->
  <rect width="100%" height="100%" fill="#fdfdfd"/>
  
  <!-- Title / Header -->
  <g transform="translate(60, 60)">
    <circle cx="25" cy="25" r="25" class="step-bubble"/>
    <text x="25" y="27" class="step-text">1</text>
    <text x="70" y="35" class="text-label" style="text-anchor: start; font-size: 32px;">AGENT CLI ASSEMBLY</text>
  </g>

  <!-- Main Assembly Area -->
  <g transform="translate(600, 380)">
    
    <!-- Left Piece: UNIX PHILOSOPHY (Base) -->
    <g class="component">
      <animateTransform attributeName="transform" type="translate" from="-20 0" to="0 0" dur="2s" fill="freeze" begin="0.5s"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.3;1" dur="2s" fill="freeze" begin="0.5s"/>
      <!-- 3D Shadow -->
      <path d="M-240 20 L-240 120 L-60 120 L-60 140 L-220 140 L-260 40 Z" class="fill-shadow" opacity="0.5"/>
      <!-- Main Shape (Jigsaw Male) -->
      <path d="M-250 0 L-50 0 L-50 40 C-30 40 -30 60 -50 60 L-50 100 L-250 100 L-250 0 Z" class="stroke-main"/>
      <text x="-150" y="45" class="text-label">UNIX</text>
      <text x="-150" y="70" class="text-sub">Modular &amp; Simple</text>
      
      <!-- Added: Pipe Connector Animation -->
      <g transform="translate(-50, 50)">
         <circle r="4" fill="#1a1a1a" opacity="0">
            <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="2s"/>
            <animate attributeName="r" values="4;15;4" dur="2s" repeatCount="indefinite" begin="2s"/>
         </circle>
      </g>
    </g>

    <!-- Right Piece: TEXT STREAM (Connector) -->
    <g class="component">
      <animateTransform attributeName="transform" type="translate" from="20 0" to="0 0" dur="2s" fill="freeze" begin="1s"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.3;1" dur="2s" fill="freeze" begin="1s"/>
      <!-- 3D Shadow -->
      <path d="M50 20 L250 20 L250 120 L230 140 L70 140 L50 120 Z" class="fill-shadow" opacity="0.5"/>
      <!-- Main Shape (Jigsaw Female Left, Male Right) -->
      <path d="M50 0 L250 0 L250 100 L50 100 L50 60 C70 60 70 40 50 40 L50 0 Z" class="stroke-main"/>
      
      <!-- Modified: Stream Content with Animation -->
      <text x="150" y="35" class="text-label" style="font-size: 20px;">STDOUT</text>
      
      <g clip-path="url(#stream-clip)">
        <text x="150" y="70" class="text-mono" text-anchor="middle" font-size="12" fill="#666">
          <tspan>&gt; stream text...</tspan>
          <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
        </text>
        <text x="150" y="85" class="text-mono" text-anchor="middle" font-size="10" fill="#999">
          010101110100
          <animate attributeName="x" values="150;153;147;150" dur="2.5s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>

    <!-- Top Piece: JSON OUTPUT (The Interface) - HEAVILY MODIFIED -->
    <g class="component">
      <animateTransform attributeName="transform" type="translate" from="0 -30" to="0 0" dur="2s" fill="freeze" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.3;1" dur="2s" fill="freeze" begin="1.5s"/>
      
      <!-- 3D Shadow -->
      <path d="M-80 -180 L80 -180 L80 -40 L60 -20 L-100 -20 L-100 -160 Z" class="fill-shadow" opacity="0.5"/>
      
      <!-- Main Shape (Plug into both) -->
      <path d="M-100 -200 L100 -200 L100 -50 C100 -30 80 -30 80 -10 L-80 -10 C-80 -30 -100 -30 -100 -50 L-100 -200 Z" class="stroke-main"/>
      
      <!-- Screen Area -->
      <g transform="translate(0, 0)">
        <rect x="-90" y="-190" width="180" height="130" rx="4" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
        
        <!-- Terminal Window Bar -->
        <rect x="-90" y="-190" width="180" height="20" rx="4" fill="#1a1a1a"/>
        <!-- Fix clip path issue by redrawing rect for clip or just rely on overflow hidden if browser supports, but SVG needs clipPath -->
        <!-- Actually, let's just draw circle on top -->
        <circle cx="-80" cy="-180" r="3" fill="#fff"/>
        <circle cx="-70" cy="-180" r="3" fill="#999"/>
        <circle cx="-60" cy="-180" r="3" fill="#999"/>
        <text x="0" y="-176" class="text-mono" text-anchor="middle" fill="#fff" font-size="10">bash</text>

        <!-- Terminal Content -->
        <g clip-path="url(#screen-clip)">
          <g transform="translate(0, -10)"> <!-- slight adjust for padding -->
            <!-- Command 1: Typing Animation -->
            <text x="-85" y="-155" class="text-mono" font-size="12">
              <tspan font-weight="bold" fill="#1a1a1a">$</tspan> 
              <tspan fill="#4a4a4a">git log --json</tspan>
              <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="2.5s"/>
            </text>

            <!-- Command 2: Pipe -->
            <text x="-85" y="-135" class="text-mono" font-size="12">
              <tspan font-weight="bold" fill="#1a1a1a">$</tspan> 
              <tspan fill="#4a4a4a">curl | jq .data</tspan>
              <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="4s"/>
            </text>

            <!-- JSON Output with Scroll Effect -->
            <g>
               <animateTransform attributeName="transform" type="translate" from="0 20" to="0 0" dur="0.5s" fill="freeze" begin="4.5s"/>
               <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="4.5s"/>
               
               <text x="-85" y="-115" class="text-mono" font-size="10" fill="#666">{</text>
               <text x="-75" y="-100" class="text-mono" font-size="10" fill="#1a1a1a">"id": "a1b2",</text>
               <text x="-75" y="-85" class="text-mono" font-size="10" fill="#1a1a1a">"msg": "feat: cli",</text>
               <text x="-75" y="-70" class="text-mono" font-size="10" fill="#1a1a1a">"status": "ok"</text>
               <text x="-85" y="-55" class="text-mono" font-size="10" fill="#666">}</text>
            </g>
            
            <!-- Blinking Cursor -->
            <rect x="-85" y="-50" width="6" height="12" fill="#1a1a1a">
               <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="1.2s" repeatCount="indefinite" begin="5s"/>
            </rect>
          </g>
        </g>
      </g>
    </g>

    <!-- Connection Lines (Dashed instructions) -->
    <path d="M-150 110 L-150 150 L150 150 L150 110" class="stroke-thin" fill="none"/>
    <text x="0" y="170" class="text-sub" style="font-size: 14px;">SNAP TO CONNECT (PIPE | )</text>

  </g>

  <!-- "Ikea Man" Agent Figure -->
  <g transform="translate(150, 400)">
    <!-- Head -->
    <circle cx="50" cy="0" r="25" class="stroke-main" fill="#fff"/>
    <!-- Body -->
    <path d="M50 25 L50 100 M20 40 L50 50 L80 40 M30 130 L50 100 L70 130" class="stroke-main" fill="none"/>
    <!-- Thought Bubble -->
    <g transform="translate(60, -60)">
      <animateTransform attributeName="transform" type="translate" values="60 -60; 60 -70; 60 -60" dur="4s" repeatCount="indefinite"/>
      <path d="M0 0 L20 -20 L100 -20 L100 -70 L0 -70 L0 -20 Z" class="stroke-main" fill="#fff"/>
      <text x="50" y="-40" class="text-sub" style="font-size: 14px; font-weight: 800;">EASY!</text>
    </g>
  </g>

  <!-- Tools / Parts List Side Panel -->
  <g transform="translate(900, 100)">
    <text x="100" y="0" class="text-label" style="font-size: 20px; text-decoration: underline;">PARTS LIST</text>
    
    <!-- Part 1 -->
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="30" height="30" class="stroke-main" stroke-width="3"/>
      <text x="50" y="20" class="text-sub" style="text-anchor: start;">x1 stdin/stdout</text>
    </g>
    
    <!-- Part 2 -->
    <g transform="translate(0, 90)">
      <circle cx="15" cy="15" r="15" class="stroke-main" stroke-width="3"/>
      <text x="50" y="20" class="text-sub" style="text-anchor: start;">x1 Structured Data</text>
    </g>
    
    <!-- Part 3 -->
    <g transform="translate(0, 140)">
      <path d="M0 0 L30 15 L0 30" class="stroke-main" stroke-width="3" fill="none"/>
      <text x="50" y="20" class="text-sub" style="text-anchor: start;">xN Pipes</text>
    </g>
    
    <!-- Added: Part 4 (Missing in original new version) -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="30" height="20" rx="3" fill="none" stroke="#1a1a1a" stroke-width="3"/>
      <text x="8" y="14" font-size="14" font-weight="bold" fill="#1a1a1a">&gt;_</text>
      <text x="50" y="15" class="text-sub" style="text-anchor: start;">x1 Terminal</text>
    </g>
  </g>

  <!-- Bottom Warning / Info -->
  <g transform="translate(600, 620)">
    <text x="0" y="0" class="text-sub" style="font-size: 14px; font-style: italic;">
      * No heavy frameworks required for assembly.
    </text>
  </g>

</svg>
