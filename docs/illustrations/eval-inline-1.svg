<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Error recovery loop: attempt, verify, inject evidence into context, then choose rollback or strategy change with enforced verification">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071226" />
      <stop offset="1" stop-color="#0b1a33" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.95" />
      <stop offset="1" stop-color="#34d399" stop-opacity="0.9" />
    </linearGradient>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa" />
    </marker>

    <style>
      .frame { fill: url(#bg); stroke: rgba(148,163,184,0.35); stroke-width: 1; }
      .title { font: 700 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #f8fafc; }
      .subtitle { font: 500 13.5px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(226,232,240,0.85); }
      .section { font: 700 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(226,232,240,0.9); letter-spacing: 0.3px; }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(148,163,184,0.35); stroke-width: 1; }
      .cardStrong { fill: rgba(96,165,250,0.10); stroke: rgba(96,165,250,0.65); stroke-width: 1; }
      .label { font: 700 15px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #e5e7eb; }
      .text { font: 500 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: rgba(226,232,240,0.85); }
      .muted { fill: rgba(148,163,184,0.92); }
      .good { fill: rgba(52,211,153,0.95); }
      .warn { fill: rgba(251,191,36,0.95); }
      .bad { fill: rgba(248,113,113,0.95); }

      .flow { stroke: rgba(96,165,250,0.85); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 10 12; marker-end: url(#arrow); animation: dash 3.6s linear infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; }

      @keyframes dash { to { stroke-dashoffset: -220; } }
      @keyframes pulse { 0%, 100% { opacity: 0.88; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse { animation: none; }
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect class="frame" x="20" y="20" width="1160" height="480" rx="22" />
  <rect x="20" y="20" width="1160" height="480" rx="22" fill="none" stroke="rgba(96,165,250,0.18)" />

  <!-- Header -->
  <text class="title" x="52" y="66">Error Recovery is an Evidence Loop</text>
  <text class="subtitle" x="52" y="92">Keep failure signals, inject them into context, and choose the next move based on proof—not optimism.</text>
  <path d="M52 106 H1148" stroke="rgba(148,163,184,0.22)" />

  <!-- Top flow cards -->
  <g>
    <!-- Card 1 -->
    <rect class="card" x="70" y="132" width="250" height="122" rx="16" />
    <circle cx="96" cy="158" r="10" fill="rgba(96,165,250,0.25)" stroke="rgba(96,165,250,0.7)" />
    <path d="M92 158 L96 162 L102 152" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text class="label" x="118" y="162">Attempt</text>
    <text class="text" x="86" y="188">
      <tspan x="86" dy="0">Run a tool call</tspan>
      <tspan x="86" dy="18">Edit code / config</tspan>
      <tspan x="86" dy="18">Make a change</tspan>
    </text>

    <!-- Card 2 -->
    <rect class="card" x="340" y="132" width="250" height="122" rx="16" />
    <circle cx="366" cy="158" r="10" fill="rgba(251,191,36,0.22)" stroke="rgba(251,191,36,0.75)" />
    <path d="M366 149 V167" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="366" cy="171" r="1.7" fill="#fbbf24" />
    <text class="label" x="388" y="162">Verify</text>
    <text class="text" x="356" y="188">
      <tspan x="356" dy="0">Exit code / errors</tspan>
      <tspan x="356" dy="18">Tests / build / lint</tspan>
      <tspan x="356" dy="18">External checks (HTTP 200)</tspan>
    </text>

    <!-- Card 3 -->
    <rect class="cardStrong pulse" x="610" y="132" width="250" height="122" rx="16" />
    <circle cx="636" cy="158" r="10" fill="rgba(52,211,153,0.22)" stroke="rgba(52,211,153,0.78)" />
    <path d="M632 158 L636 162 L642 152" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text class="label" x="658" y="162">Evidence in Context</text>
    <text class="text" x="626" y="188">
      <tspan x="626" dy="0">Tool output</tspan>
      <tspan x="626" dy="18">Test report</tspan>
      <tspan x="626" dy="18">Diff / artifacts</tspan>
    </text>

    <!-- Card 4 -->
    <rect class="card" x="880" y="132" width="250" height="122" rx="16" />
    <circle cx="906" cy="158" r="10" fill="rgba(148,163,184,0.22)" stroke="rgba(148,163,184,0.65)" />
    <path d="M900 158 H912" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
    <text class="label" x="928" y="162">Decide Next Move</text>
    <text class="text" x="896" y="188">
      <tspan x="896" dy="0">Rollback / reroute</tspan>
      <tspan x="896" dy="18">Enforce verification gates</tspan>
      <tspan x="896" dy="18">Or start over (new session)</tspan>
    </text>

    <!-- Flow arrows -->
    <path class="flow" d="M320 193 H340" />
    <path class="flow" d="M590 193 H610" />
    <path class="flow" d="M860 193 H880" />
  </g>

  <!-- Section label -->
  <text class="section" x="70" y="290">Recovery moves (choose by evidence)</text>
  <path d="M70 300 H1130" stroke="rgba(148,163,184,0.22)" />

  <!-- Recovery move cards -->
  <g>
    <!-- Rollback -->
    <rect class="card" x="70" y="318" width="340" height="156" rx="16" />
    <circle cx="98" cy="346" r="11" fill="rgba(52,211,153,0.20)" stroke="rgba(52,211,153,0.70)" />
    <path d="M101 340 a6 6 0 1 0 0 12" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" />
    <path d="M95 339 L90 345 L97 346" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text class="label" x="124" y="351">Rollback</text>
    <text class="text" x="92" y="378">
      <tspan x="92" dy="0">Return to a clean checkpoint</tspan>
      <tspan x="92" dy="18">Preserve failure evidence</tspan>
      <tspan x="92" dy="18">Retry with a different change</tspan>
    </text>
    <text class="text muted" x="92" y="442">Example: revert the diff before exploring a new approach</text>

    <!-- Switch strategy -->
    <rect class="card" x="430" y="318" width="340" height="156" rx="16" />
    <circle cx="458" cy="346" r="11" fill="rgba(96,165,250,0.20)" stroke="rgba(96,165,250,0.72)" />
    <path d="M452 346 H464" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" />
    <path d="M458 340 V352" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" />
    <text class="label" x="484" y="351">Switch Strategy</text>
    <text class="text" x="452" y="378">
      <tspan x="452" dy="0">Stop repeating the same fix</tspan>
      <tspan x="452" dy="18">Set a retry threshold</tspan>
      <tspan x="452" dy="18">Request a new direction if stuck</tspan>
    </text>
    <text class="text muted" x="452" y="442">Signal: the same error appears multiple times</text>

    <!-- Enforce verification -->
    <rect class="card" x="790" y="318" width="340" height="156" rx="16" />
    <circle cx="818" cy="346" r="11" fill="rgba(251,191,36,0.20)" stroke="rgba(251,191,36,0.75)" />
    <path d="M814 349 L818 353 L825 341" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text class="label" x="844" y="351">Enforce Verification</text>
    <text class="text" x="812" y="378">
      <tspan x="812" dy="0">Make tests/build/lint mandatory</tspan>
      <tspan x="812" dy="18">Require logs and artifacts as proof</tspan>
      <tspan x="812" dy="18">Prevent “Done!” without evidence</tspan>
    </text>
    <text class="text muted" x="812" y="442">External signals &gt; self-assessment</text>
  </g>

  <!-- Bottom note -->
  <g>
    <rect x="70" y="478" width="1060" height="0" rx="0" fill="none" />
    <text class="subtitle" x="70" y="488">
      If verification results are not captured and injected, the Agent is effectively walking blind.
    </text>
  </g>
</svg>
